    let k = todayKey(), current = 0;
    if (!countDay(k)) k = addDays(k, -1);
    while (countDay(k)) { current++; k = addDays(k, -1); }
    let best = 0, run = 0, prev = '';
    Array.from(store.days.keys()).sort().forEach((key) => {
      if (!countDay(key)) return;
      run = prev && addDays(prev, 1) === key ? run + 1 : 1;
      prev = key;
      if (run > best) best = run;
    });
    return { current: current, best: Math.max(best, current) };
  }
  function nextColor() {
    const used = new Array(8).fill(0);
    store.stashes.forEach((s) => { used[s.color]++; });
    return used.indexOf(Math.min.apply(null, used));
  }
  function lastSource(stashId) {
    const list = ideasOf(stashId);
    for (let k = list.length - 1; k >= 0; k--) if (list[k].source) return list[k].source;
    return '';
  }
  function snapshotAll() {
    return { v: 1, ideas: Object.fromEntries(store.ideas), stashes: Object.fromEntries(store.stashes), days: Object.fromEntries(store.days), state: store.state };
  }

  /* ───────── хранение: браузер ───────── */
  function LocalAdapter() {
    let timer = 0;
    function read() {
      try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
    }
    function load(data) {
      store.ideas = new Map(); store.stashes = new Map(); store.days = new Map(); store.state = normState(null);
      if (!isObj(data)) return;
      for (const id in (data.ideas || {})) store.ideas.set(id, normIdea(data.ideas[id], id));
      for (const id in (data.stashes || {})) store.stashes.set(id, normStash(data.stashes[id], id));
      for (const id in (data.days || {})) if (DAY_RE.test(id)) store.days.set(id, normDay(data.days[id], id));
      store.state = normState(data.state);
    }
    const NOTE_BLOCKED = 'Этот браузер не даёт странице сохранять данные. Изменения пропадут, когда вы закроете вкладку.';
    const NOTE_FULL = 'Хранилище браузера переполнено, новые изменения не сохраняются. Сохраните копию в файл и удалите лишнее.';
    function persistNow() {
      clearTimeout(timer); timer = 0;
      let note = '';
      try { localStorage.setItem(LS_KEY, JSON.stringify(snapshotAll())); }
      catch (e) { note = e && e.name === 'QuotaExceededError' ? NOTE_FULL : NOTE_BLOCKED; }
      // о невозможности сохранять говорим постоянной строкой вверху, а не всплывающим сообщением на каждое действие
      if (note ? store.note !== note : (store.note === NOTE_BLOCKED || store.note === NOTE_FULL)) { store.note = note; emit(); }
    }
    function persist() { if (!timer) timer = setTimeout(persistNow, 150); }
    return {
      kind: 'local',
      start: function () {
        const data = read();
        load(data);
        if (!data && packs.length) { addPacks(packs, Date.now() - 60000); persistNow(); }   // первый запуск: кладём все готовые подборки на пробу
        else if (data && refreshFromPacks()) persistNow();
        window.addEventListener('storage', (e) => { if (e.key === LS_KEY && !timer) { load(read()); emit(); } });
        window.addEventListener('pagehide', () => { if (timer) persistNow(); });
        doc.addEventListener('visibilitychange', () => { if (doc.hidden && timer) persistNow(); });
        store.ready = true;
        return Promise.resolve();
      },
      set: persist,
      update: persist,
      remove: persist,
      pending: () => 0,
    };
  }

  /* ───────── хранение: облако страницы ─────────
     Документы: ideas/<id>, stashes/<id>, days/<ГГГГ-ММ-ДД>, app/state.
     Память обновляется сразу, запись уходит в очередь: по одной операции на документ и не больше трёх одновременно. */
  function CloudAdapter(db) {
    const LIFECYCLE = ['revoked', 'not_granted', 'capability_disabled', 'capability_removed', 'not_declared'];
    const NOTE_SLOW = 'Пока не получается связаться с хранилищем. Показано то, что удалось загрузить; остальное появится, когда вернётся связь.';
    const NOTE_LOST = 'Связь с хранилищем прервалась: изменения с других устройств пока не видны.';
    const NOTE_DEAD = 'Нет доступа к облачному хранилищу, изменения не сохраняются. Обновите страницу.';
    const NAMES = ['ideas', 'stashes', 'days', 'state'];
    const writers = new Map();   // путь документа → { busy, pending }
    const exists = new Set();    // документы, которые точно есть в хранилище
    const first = {}, cached = {}, fresh = {};
    const waiters = [], retryList = [];
    let active = 0, pendingOps = 0, dead = false, olderBusy = false, olderDone = false, slowTimer = 0, lastFailToast = 0;
    let ready;
    const started = new Promise((r) => { ready = r; });

    function becomeReady() { if (!store.ready) { store.ready = true; ready(); } }
    function settle(name, meta) {
      first[name] = true;
      cached[name] = !!(meta && meta.fromCache);
      const all = NAMES.every((n) => first[n]);
      const definitive = all && NAMES.every((n) => !cached[n]);
      store.syncing = !definitive;
      if (definitive) { clearTimeout(slowTimer); if (store.note === NOTE_SLOW) store.note = ''; }
      if (definitive || (all && store.ideas.size > 0)) becomeReady();
    }

    function applyDoc(path, snap) {
      const cut = path.indexOf('/');
      const col = path.slice(0, cut), id = path.slice(cut + 1);
      const data = snap.exists ? snap.data() : null;
      if (data) exists.add(path); else exists.delete(path);
      if (col === 'ideas') { if (data) store.ideas.set(id, normIdea(data, id)); else store.ideas.delete(id); }
      else if (col === 'stashes') { if (data) store.stashes.set(id, normStash(data, id)); else store.stashes.delete(id); }
      else if (col === 'days') { if (data && DAY_RE.test(id)) store.days.set(id, normDay(data, id)); else store.days.delete(id); }
      else if (path === 'app/state') store.state = normState(data);
    }

    function onCol(name, snap) {
      // Подписка на идеи — окно из PAGE самых новых; всё, что старше нижней границы окна, догружается отдельно.
      const full = name === 'ideas' && snap.size >= PAGE;
      const floor = full ? snap.docs[snap.docs.length - 1].id : '';
      if (fresh[name]) {
        fresh[name] = false;
        const seen = new Set(snap.docs.map((d) => d.id));
        const map = name === 'ideas' ? store.ideas : name === 'stashes' ? store.stashes : store.days;
        Array.from(map.keys()).forEach((id) => {
          if (seen.has(id) || writers.has(name + '/' + id) || (full && id < floor)) return;
          map.delete(id); exists.delete(name + '/' + id);
        });
        snap.docs.forEach((d) => { if (!writers.has(name + '/' + d.id)) applyDoc(name + '/' + d.id, d); });
      } else {
        snap.docChanges().forEach((ch) => {
          const path = name + '/' + ch.doc.id;
          if (writers.has(path)) return;   // идёт собственная запись: локальная версия новее снимка
          if (ch.type === 'removed') { if (!(full && ch.doc.id < floor)) applyDoc(path, { exists: false }); }
          else applyDoc(path, ch.doc);
        });
      }
      settle(name, snap.metadata);
      if (full && !snap.metadata.fromCache) loadOlder(floor);
      emit();
    }
    function onState(snap) {
      if (!writers.has('app/state')) applyDoc('app/state', snap);
      settle('state', snap.metadata);
      emit();
    }
    async function loadOlder(before) {
      if (olderBusy || olderDone) return;
      olderBusy = true;
      try {
        let cursor = before;
        for (let guard = 0; guard < 30; guard++) {
          const snap = await db.collection('ideas').where('id', '<', cursor).orderBy('id', 'desc').limit(PAGE).get();
          snap.docs.forEach((d) => { const path = 'ideas/' + d.id; if (!writers.has(path) && !store.ideas.has(d.id)) applyDoc(path, d); });
          emit();
          if (snap.size < PAGE) break;
          cursor = snap.docs[snap.docs.length - 1].id;
        }
        olderDone = true;
      } catch (e) {
        console.warn('[Суть] не удалось догрузить старые идеи:', e && e.code);
      }
      olderBusy = false;
    }

    function listen(name, make, handler) {
      const open = () => {
        fresh[name] = true;
        try { make().onSnapshot(handler, (err) => lost(name, err, open)); }
        catch (e) { lost(name, { code: 'invalid_argument', message: String(e) }, open); }
      };
      open();
    }
    function lost(name, err, open) {
      const code = (err && err.code) || 'unavailable';
      console.warn('[Суть] подписка «' + name + '» остановилась:', code, err && err.message);
      first[name] = true; cached[name] = false;
      if (LIFECYCLE.includes(code)) { dead = true; store.note = NOTE_DEAD; store.retry = null; }
      else {
        retryList.push(open);
        store.note = NOTE_LOST;
        store.retry = () => { const list = retryList.splice(0); store.note = ''; store.retry = null; emit(); list.forEach((f) => f()); };
      }
      becomeReady();
      emit();
    }

    function acquire() {
      if (active < 3) { active++; return Promise.resolve(); }
      return new Promise((r) => waiters.push(r));
    }
    function release() { const next = waiters.shift(); if (next) next(); else active--; }
    function mergeOps(a, b) {
      if (!a || b.t !== 'update') return b;
      if (a.t === 'delete') return a;
      return { t: a.t, data: deepMerge(a.data, b.data), full: b.full || a.full };
    }
    function push(path, op) {
      if (dead) return;
      let w = writers.get(path);
      if (!w) { w = { busy: false, pending: null }; writers.set(path, w); }
      if (!w.pending) pendingOps++;
      w.pending = mergeOps(w.pending, op);
      if (!w.busy) pump(path, w);
    }
    async function pump(path, w) {
      w.busy = true;
      while (w.pending) {
        const op = w.pending;
        w.pending = null;
        await acquire();
        try { await exec(path, op, 0); } catch (e) { failed(path, op, e); } finally { release(); }
        pendingOps--;
      }
      writers.delete(path);
    }
    async function exec(path, op, attempt) {
      const ref = db.doc(path);
      try {
        if (op.t === 'set') await ref.set(op.data);
        else if (op.t === 'update') await ref.update(op.data);
        else await ref.delete();
      } catch (e) {
        const code = e && e.code;
        if (code === 'unavailable' && attempt < 2) { await sleep(500 + Math.random() * 900); return exec(path, op, attempt + 1); }
        if (code === 'resource_exhausted' && attempt < 5) { await sleep(1000 * Math.pow(2, attempt) + Math.random() * 400); return exec(path, op, attempt + 1); }
        // update отклоняется, если документа ещё нет: для дневника и настроек создаём его целиком
        if (code === 'invalid_argument' && op.t === 'update' && op.full && attempt < 1) return exec(path, { t: 'set', data: plain(op.full()) }, 1);
        throw e;
      }
    }
    function failed(path, op, e) {
      const code = (e && e.code) || 'unavailable';
      console.warn('[Суть] запись не удалась:', path, op.t, code, e && e.message);
      if (LIFECYCLE.includes(code)) { dead = true; store.note = NOTE_DEAD; emit(); return; }
      const quiet = code === 'invalid_argument' && op.t === 'update';   // документ удалили на другом устройстве
      if (!quiet && Date.now() - lastFailToast > 5000) {
        lastFailToast = Date.now();
        toast(code === 'quota_exceeded' ? 'Хранилище заполнено. Удалите часть идей, чтобы сохранять новые.' : 'Не удалось сохранить изменение. Проверьте соединение.');
      }
      resync(path);
    }
    async function resync(path) {   // после неудачной записи возвращаем в память то, что на самом деле лежит в хранилище
      try {
        const snap = await db.doc(path).get();
        const w = writers.get(path);
        if (!w || !w.pending) { applyDoc(path, snap); emit(); }
      } catch (e) { /* останется как есть до следующего снимка */ }
    }

    return {
      kind: 'cloud',
      start: function () {
        store.syncing = true;
        listen('stashes', () => db.collection('stashes').limit(PAGE), (s) => onCol('stashes', s));
        listen('ideas', () => db.collection('ideas').orderBy('id', 'desc').limit(PAGE), (s) => onCol('ideas', s));
        listen('days', () => db.collection('days').orderBy('d', 'desc').limit(400), (s) => onCol('days', s));
        listen('state', () => db.doc('app/state'), onState);
        slowTimer = setTimeout(() => {
          if (!store.ready || store.syncing) { if (!store.note) store.note = NOTE_SLOW; becomeReady(); emit(); }
        }, 10000);
        return started;
      },
      set: function (col, id, data) { const path = col + '/' + id; exists.add(path); push(path, { t: 'set', data: plain(data) }); },
      update: function (col, id, patch, full) {
        const path = col + '/' + id;
        if (exists.has(path)) push(path, { t: 'update', data: plain(patch), full: full });
        else if (full) { exists.add(path); push(path, { t: 'set', data: plain(full()) }); }
      },
      remove: function (col, id) { const path = col + '/' + id; exists.delete(path); push(path, { t: 'delete' }); },
      pending: () => pendingOps,
    };
  }

  /* ───────── изменения ───────── */
  function createIdea(fields) {
    const t = Date.now();
    const idea = normIdea(Object.assign({ seen: 0, seenAt: 0, createdAt: t, updatedAt: t }, fields), newId());
    store.ideas.set(idea.id, idea);
    adapter.set('ideas', idea.id, idea);
    emit();
    return idea;
  }
  function updateIdea(id, fields) {
    const old = store.ideas.get(id);
    if (!old) return null;
    const idea = normIdea(Object.assign({}, old, fields, { updatedAt: Date.now() }), id);
    store.ideas.set(id, idea);
    adapter.set('ideas', id, idea);
    emit();
    return idea;
  }
  function patchIdea(id, patch) {   // точечная правка (избранное, отметка о прочтении): в облако уходят только эти поля
    const old = store.ideas.get(id);
    if (!old) return;
    store.ideas.set(id, normIdea(Object.assign({}, old, patch), id));
    adapter.update('ideas', id, patch);
    emit();
  }
  function removeIdea(id) {
    const old = store.ideas.get(id);
    if (!old) return null;
    store.ideas.delete(id);
    adapter.remove('ideas', id);
    emit();
    return old;
  }
  function restoreIdea(idea) {
    store.ideas.set(idea.id, idea);
    adapter.set('ideas', idea.id, idea);
    emit();
  }
  function createStash(fields) {
    const t = Date.now();
    const st = normStash(Object.assign({ createdAt: t, updatedAt: t }, fields), newId());
    store.stashes.set(st.id, st);
    adapter.set('stashes', st.id, st);
    emit();
    return st;
  }
  function updateStash(id, fields) {
    const old = store.stashes.get(id);
    if (!old) return;
    const st = normStash(Object.assign({}, old, fields, { updatedAt: Date.now() }), id);
    store.stashes.set(id, st);
    adapter.set('stashes', id, st);
    emit();
  }
  function removeStash(id, withIdeas) {
    if (!store.stashes.has(id)) return;
    ideasOf(id).forEach((i) => {
      if (withIdeas) { store.ideas.delete(i.id); adapter.remove('ideas', i.id); }
      else { store.ideas.set(i.id, normIdea(Object.assign({}, i, { stash: '' }), i.id)); adapter.update('ideas', i.id, { stash: '' }); }
    });
    store.stashes.delete(id);
    adapter.remove('stashes', id);
    emit();
  }
  function patchDay(key, patch) {
    const old = store.days.get(key) || { d: key, deck: [], ids: {} };
    store.days.set(key, { d: key, deck: patch.deck || old.deck, ids: patch.ids ? Object.assign({}, old.ids, patch.ids) : old.ids });
    adapter.update('days', key, patch, () => store.days.get(key));
    emit();
  }
  function patchState(patch) {
    store.state = normState(Object.assign({}, store.state, patch));
    adapter.update('app', 'state', patch, () => store.state);
    emit();
  }
  function markRead(id) {
    const idea = store.ideas.get(id);
    if (!idea) return;
    const key = todayKey();
    const day = store.days.get(key);
    if (day && day.ids[id]) return;   // сегодня уже отмечена: лишних записей не делаем
    const mark = {};
    mark[id] = 1;
    patchDay(key, { ids: mark });
    patchIdea(id, { seen: idea.seen + 1, seenAt: Date.now() });
  }
  /* ───────── каталог готовых подборок ─────────
     Подборка каталога становится коллекцией с тем же id; «добавлена» значит, что такая коллекция есть в картотеке. */
  let packs = [];
  function cleanPacks(list) {
    return (Array.isArray(list) ? list : []).filter((p) => isObj(p) && ID_RE.test(String(p.id)) && Array.isArray(p.ideas)).map((p) => ({
      id: p.id,
      title: str(p.title, 120).trim() || 'Подборка',
      note: str(p.note, 600).trim(),
      color: clampInt(p.color, 0, 7),
      ideas: p.ideas.filter((it) => isObj(it) && ID_RE.test(String(it.id))),
      removed: (Array.isArray(p.removed) ? p.removed : []).filter((id) => ID_RE.test(String(id))),   // снятые карточки
    }));
  }
  const availablePacks = () => packs.filter((p) => !store.stashes.has(p.id));
  const newPacks = () => availablePacks().filter((p) => !store.state.packsSeen.includes(p.id));
  const countIdeas = (list) => list.reduce((sum, p) => sum + p.ideas.length, 0);
  function addPack(p, t) {
    const st = normStash({ title: p.title, note: p.note, color: p.color, createdAt: t, updatedAt: t, demo: true }, p.id);
    store.stashes.set(st.id, st);
    adapter.set('stashes', st.id, st);
    p.ideas.forEach((it, k) => {
      const old = store.ideas.get(it.id);   // идея могла остаться от удалённой коллекции: её отметки сохраняем
      const keep = old ? { fav: old.fav, skip: old.skip, seen: old.seen, seenAt: old.seenAt } : null;
      const idea = normIdea(Object.assign({}, it, keep, { stash: p.id, createdAt: t + 1 + k, updatedAt: t + 1 + k, demo: true }), it.id);
      store.ideas.set(idea.id, idea);
      adapter.set('ideas', idea.id, idea);
    });
  }
  function addPacks(list, base) {
    const t = base || Date.now();
    list.forEach((p, k) => addPack(p, t + k * 200));
    seePacks();
    emit();
  }
  function packUpdates() {
    // Чем картотека отстала от каталога: исправленные тексты и ссылки готовых карточек. Отметки человека сохраняются,
    // а карточки, которые он правил сам (время правки отличается от времени создания), в список не попадают.
    // Снятая карточка (её не удалось подтвердить источником) уходит из картотеки по тому же правилу: запись { gone: id }.
    const same = (a, b) => a.title === b.title && a.text === b.text && a.source === b.source && a.url === b.url && a.tags.join('|') === b.tags.join('|');
    const untouched = (d) => d && d.demo && d.updatedAt === d.createdAt;
    const out = [];
    packs.forEach((p) => {
      p.removed.forEach((id) => { if (untouched(store.ideas.get(id))) out.push({ col: 'ideas', gone: id }); });
      const st = store.stashes.get(p.id);
      if (st && st.demo && st.updatedAt === st.createdAt && (st.title !== p.title || st.note !== p.note || st.color !== p.color)) {
        out.push({ col: 'stashes', doc: normStash(Object.assign({}, st, { title: p.title, note: p.note, color: p.color }), st.id) });
      }
      p.ideas.forEach((it) => {
        const old = store.ideas.get(it.id);
        if (!old || !old.demo || old.updatedAt !== old.createdAt) return;
        const fresh = normIdea(Object.assign({}, old, { title: it.title, text: it.text, source: it.source, url: it.url, tags: it.tags }), old.id);
        if (!same(fresh, old)) out.push({ col: 'ideas', doc: fresh });
      });
    });
    return out;
  }
  function refreshFromPacks() {
    // Локальная версия делает это сама при запуске; в облачной запись идёт только по кнопке, а не при загрузке страницы.
    const list = packUpdates();
    list.forEach((u) => {
      if (u.gone) { store.ideas.delete(u.gone); adapter.remove('ideas', u.gone); return; }
      (u.col === 'ideas' ? store.ideas : store.stashes).set(u.doc.id, u.doc);
      adapter.set(u.col, u.doc.id, u.doc);
    });
    if (list.length) emit();
    return list.length;
  }
  function seePacks() {   // запоминаем, какие подборки каталога человек уже видел, чтобы не предлагать их как новые
    const seen = store.state.packsSeen;
    const more = packs.map((p) => p.id).filter((id) => !seen.includes(id));
    if (more.length) patchState({ packsSeen: seen.concat(more) });
  }
  function interestRows() {   // по коллекциям: сколько прочитано, что зацепило, что мимо; сверху то, что цепляет чаще
    const rows = [];
    derived().byStash.forEach((list, key) => {
      const st = store.stashes.get(key);
      let read = 0, fav = 0, skip = 0;
      list.forEach((i) => { if (i.seen) read++; if (i.fav) fav++; if (i.skip) skip++; });
      if (read || fav || skip) rows.push({ title: st ? st.title : 'Без коллекции', color: st ? st.color : 0, total: list.length, read: read, fav: fav, skip: skip, score: (fav - skip) / Math.max(1, read) });
    });
    return rows.sort((a, b) => b.score - a.score || b.fav - a.fav || b.read - a.read);
  }
  function interestsText(rows) {
    const liked = derived().all.filter((i) => i.fav).slice(0, 15).map((i) => '«' + (i.title || snippet(i.text, 60)) + '»');
    return ['Мои отметки в «Сути» на ' + new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }) + ':']
      .concat(rows.map((r) => '— ' + r.title + ': зацепило ' + r.fav + ', не моё ' + r.skip + ', прочитано ' + r.read + ' из ' + r.total))
      .concat(liked.length ? ['', 'Что зацепило: ' + liked.join('; ')] : [])
      .join('\n');
  }
  function removeDemo() {
    Array.from(store.ideas.values()).forEach((i) => { if (i.demo) { store.ideas.delete(i.id); adapter.remove('ideas', i.id); } });
    Array.from(store.stashes.values()).forEach((s) => {
      if (!s.demo) return;
      let used = false;
      store.ideas.forEach((i) => { if (i.stash === s.id) used = true; });
      if (used) { store.stashes.set(s.id, Object.assign({}, s, { demo: false })); adapter.update('stashes', s.id, { demo: false }); }
      else { store.stashes.delete(s.id); adapter.remove('stashes', s.id); }
    });
    emit();
  }
  function wipeAll() {
    Array.from(store.ideas.keys()).forEach((id) => { store.ideas.delete(id); adapter.remove('ideas', id); });
    Array.from(store.stashes.keys()).forEach((id) => { store.stashes.delete(id); adapter.remove('stashes', id); });
    Array.from(store.days.keys()).forEach((id) => { store.days.delete(id); adapter.remove('days', id); });
    emit();
  }
  function exportPayload() {
    return JSON.stringify({
      app: 'sut', version: 1, exportedAt: new Date().toISOString(),
      ideas: Array.from(store.ideas.values()), stashes: Array.from(store.stashes.values()),
      days: Object.fromEntries(store.days), state: store.state,
    }, null, 1);
  }
  function importData(text) {
    let data;
    try { data = JSON.parse(text); } catch (e) { return { error: 'Не получилось прочитать файл: это не копия данных «Сути».' }; }
    if (!isObj(data) || !Array.isArray(data.ideas)) return { error: 'В этом файле нет списка идей.' };
    let added = 0, updated = 0;
    (Array.isArray(data.stashes) ? data.stashes : []).forEach((s) => {
      if (!isObj(s) || !ID_RE.test(String(s.id))) return;
      const st = normStash(s, s.id);
      store.stashes.set(st.id, st);
      adapter.set('stashes', st.id, st);
    });
    data.ideas.slice(0, 5000).forEach((it) => {
      if (!isObj(it)) return;
      const id = ID_RE.test(String(it.id)) ? it.id : newId();
      const idea = normIdea(it, id);
      if (!idea.title && !idea.text) return;
      if (!idea.createdAt) { idea.createdAt = Date.now(); idea.updatedAt = idea.createdAt; }
      if (store.ideas.has(id)) updated++; else added++;
      store.ideas.set(id, idea);
      adapter.set('ideas', id, idea);
    });
    if (isObj(data.days)) {
      for (const k in data.days) {
        if (!DAY_RE.test(k)) continue;
        const d = normDay(data.days[k], k);
        if (!Object.keys(d.ids).length) continue;
        const have = store.days.get(k);
        patchDay(k, d.deck.length && !(have && have.deck.length) ? { ids: d.ids, deck: d.deck } : { ids: d.ids });
      }
    }
    emit();
    return { added: added, updated: updated };
  }

  /* ───────── подборка дня ───────── */
  function buildDeck(n, exclude) {
    // сначала непрочитанные (в случайном, но постоянном на день порядке), потом те, что читали давнее всего
    const salt = todayKey();
    return Array.from(store.ideas.values()).filter((i) => !i.skip && !exclude.has(i.id))
      .map((i) => ({ id: i.id, seen: i.seen ? 1 : 0, at: i.seenAt, r: hash32(i.id + salt) }))
      .sort((a, b) => a.seen - b.seen || (a.seen ? a.at - b.at : 0) || a.r - b.r)
      .slice(0, n).map((x) => x.id);
  }
  function deckState() {
    const key = todayKey();
    const day = store.days.get(key) || { d: key, deck: [], ids: {} };
    let deck = day.deck.filter((id) => store.ideas.has(id));
    const saved = deck.length > 0;
    if (!saved) deck = buildDeck(store.state.goal, new Set());
    return { key: key, day: day, deck: deck, saved: saved, left: deck.filter((id) => !day.ids[id]), readToday: Object.keys(day.ids).length };
  }
  function startDaily(auto) {
    const s = deckState();
    if (!s.deck.length) return;
    // подборка закрепляется за днём не при открытии, а когда человек начал читать: читалка сохранит её при первой отметке
    openReader({ ids: s.deck, index: s.left.length ? s.deck.indexOf(s.left[0]) : 0, mode: 'daily', title: 'Подборка дня',
      deckToSave: s.saved ? null : s.deck, auto: auto === true });
  }
  function maybeAutoOpen() {
    // запуск сразу с карточки: приложение открыли как таковое, а не конкретный раздел, и на сегодня есть непрочитанное
    if (!store.state.autoOpen || layers.length || !store.ideas.size) return;
    if (navHash && navHash !== 'today') return;
    if (canInstall() && !isStandalone()) return;   // в браузере до установки нужен главный экран: там подсказка, как установить
    if (deckState().left.length) startDaily(true);
  }
  function moreDaily() {
    const s = deckState();
    const deck = buildDeck(store.state.goal, new Set(Object.keys(s.day.ids)));
    if (!deck.length) { toast('Сегодня вы уже прочитали всю картотеку.'); return; }
    patchDay(s.key, { deck: deck });
    openReader({ ids: deck, index: 0, mode: 'daily', title: 'Подборка дня' });
  }

  /* ───────── разбор текста ───────── */
  function parseBulk(text) {
    const out = [];
    const clean = (l) => l.replace(/^(?:\d{1,3}[.)]\s+|[-*•—–]\s+|#{1,6}\s+)/, '').replace(/^\*\*(.+?)\*\*:?$/, '$1').trim();
    String(text || '').replace(/\r\n?/g, '\n').split(/\n[ \t]*\n+/).forEach((block) => {
      const lines = block.split('\n').map((l) => l.trim()).filter(Boolean);
      if (!lines.length || out.length >= 100) return;
      if (lines.length === 1) { const one = clean(lines[0]); if (one) out.push({ title: '', text: one }); return; }
      out.push({ title: str(clean(lines[0]).replace(/[:.]$/, ''), 160), text: lines.slice(1).join('\n') });
    });
    return out;
  }
  const CHAT_PROMPT = 'Выдели 7 ключевых идей из материала, который я пришлю следующим сообщением (книга, статья или конспект). ' +
    'Формат ответа строго такой: первая строка — заголовок идеи до 60 знаков, без нумерации и кавычек; со следующей строки — текст идеи, 2–4 предложения простым языком; ' +
    'между идеями одна пустая строка. Без вступлений, списков, звёздочек и пояснений.';
  function aiPrompt(material, n) {
    return [
      'Ты помогаешь вести личную картотеку коротких идей: каждая карточка — одна самостоятельная мысль.',
      'Выдели из материала ниже ровно ' + n + ' самых ценных идей. Если материал — только название книги, статьи или тема, опирайся на общеизвестное содержание и не приписывай автору того, в чём не уверен.',
      'Требования к каждой идее:',
      '— "title": заголовок до 60 знаков, конкретный, без кавычек и точки в конце;',
      '— "text": 2–4 предложения, до 450 знаков, понятные без контекста, своими словами и без воды;',
      '— "tags": 1–3 коротких тега строчными буквами.',
      'Пиши по-русски. Не выдумывай цифр, фактов и цитат, которых нет в материале.',

      '{"collection": "короткое название подборки", "source": "автор и название источника или пустая строка", "ideas": [{"title": "…", "text": "…", "tags": ["…"]}]}',
      '',

  function parseAI(data) {
    const arr = Array.isArray(data) ? data : isObj(data) && Array.isArray(data.ideas) ? data.ideas : [];
    const items = arr.filter(isObj).map((x) => ({ title: str(x.title, 160).trim(), text: str(x.text, 2000).trim(), tags: parseTags(x.tags) }))
      .filter((x) => x.title || x.text).slice(0, 20);
    return { items: items, collection: isObj(data) ? str(data.collection, 120).trim() : '', source: isObj(data) ? str(data.source, 200).trim() : '' };
  }
  const AI_ERRORS = {
    not_granted: 'Claude не разрешён для этой страницы. Идеи можно добавить вручную или списком.',
    sampling_disabled: 'Claude недоступен для этого аккаунта. Идеи можно добавить вручную или списком.',
    not_declared: 'Claude недоступен на этой странице. Идеи можно добавить вручную или списком.',
    capability_disabled: 'Claude недоступен в этом окне. Идеи можно добавить вручную или списком.',
    capability_removed: 'Это окно Claude устарело и не умеет отвечать страницам. Обновите приложение.',
    rate_limited: 'Слишком много запросов подряд. Подождите минуту и попробуйте снова.',
    session_expired: 'Сессия истекла. Войдите в Claude заново и повторите.',
    refused: 'Claude отказался работать с этим материалом. Попробуйте другой текст.',
    prompt_too_large: 'Текст слишком длинный. Вставьте фрагмент покороче.',
    invalid_json: 'Не получилось разобрать ответ. Попробуйте ещё раз.',

  };

  /* ───────── слои: читалка, шторки, диалоги, меню ───────── */
  const layers = [];
  function pushLayer(layer) {
    if (layers.length) layers[layers.length - 1].el.inert = true;
    layers.push(layer);
    layersEl.appendChild(layer.el);
    appEl.inert = true;
  }
  function popLayer(layer) {
    const k = layers.indexOf(layer);
    if (k < 0) return;
    layers.splice(k, 1);
    layer.el.remove();
    if (layers.length) layers[layers.length - 1].el.inert = false;
    appEl.inert = layers.length > 0;
  }
  doc.addEventListener('keydown', (e) => {
    const top = layers[layers.length - 1];
    if (top && top.onKey) top.onKey(e);
  });
  const refocus = (el) => { if (el && el.focus && doc.contains(el)) el.focus(); };

  function toast(text, action) {
    const t = h('div', { class: 'toast' }, h('span', { text: text }),
      action ? h('button', { type: 'button', onclick: () => { t.remove(); action.fn(); } }, action.label) : null);
    toastsEl.appendChild(t);
    setTimeout(() => t.remove(), action ? 6500 : 3800);
  }

  function dialog(opts) {   // вместо confirm(): он на опубликованной странице не работает
    return new Promise((resolve) => {
      const opener = doc.activeElement;
      const box = h('div', { class: 'dialog', role: 'alertdialog', 'aria-modal': 'true', 'aria-label': opts.title },
        h('h2', { text: opts.title }), opts.text ? h('p', { text: opts.text }) : null,
        h('div', { class: 'dialog-actions' }, opts.actions.map((a) => h('button', { class: 'btn ' + (a.kind || 'btn-line'), type: 'button', onclick: () => done(a.value) }, a.label))));
      const layer = { el: h('div', { class: 'scrim center' }, box), onKey: (e) => { if (e.key === 'Escape') done(null); } };
      function done(v) { popLayer(layer); refocus(opener); resolve(v); }
      pushLayer(layer);
      box.querySelector('button').focus();
    });
  }

  function openMenu(anchor, items) {
    const menu = h('div', { class: 'menu', role: 'menu' }, items.map((it) =>
      h('button', { class: 'menu-item' + (it.danger ? ' danger' : ''), type: 'button', role: 'menuitem', onclick: () => { close(); it.fn(); } }, icon(it.icon, 18), it.label)));
    const scrim = h('div', { class: 'menu-scrim', onclick: (e) => { if (e.target === scrim) close(); } }, menu);
    const layer = { el: scrim, onKey: (e) => { if (e.key === 'Escape') close(); } };
    function close() { popLayer(layer); refocus(anchor); }
    const r = anchor.getBoundingClientRect();
    pushLayer(layer);
    const mw = menu.offsetWidth, mh = menu.offsetHeight;
    let top = r.bottom + 6;
    if (top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 6);
    menu.style.left = Math.max(8, Math.min(r.right - mw, window.innerWidth - mw - 8)) + 'px';
    menu.style.top = top + 'px';
    menu.querySelector('button').focus();
  }

  function openSheet(opts) {
    const opener = doc.activeElement;
    const body = h('div', { class: 'sheet-body' });
    const foot = h('div', { class: 'sheet-foot', hidden: true });
    const sheet = h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': opts.title },
      h('div', { class: 'sheet-head' }, h('h2', { text: opts.title }), iconBtn('close', 'Закрыть', () => close(false))),
      opts.tabs ? h('div', { class: 'sheet-tabs' }, opts.tabs) : null, body, foot);
    const scrim = h('div', { class: 'scrim' }, sheet);
    let pressed = false, asking = false;
    scrim.addEventListener('pointerdown', (e) => { pressed = e.target === scrim; });
    scrim.addEventListener('click', (e) => { if (e.target === scrim && pressed) close(false); });
    const layer = { el: scrim, onKey: (e) => { if (e.key === 'Escape') close(false); } };
    async function close(force) {
      if (asking) return;
      if (!force && opts.dirty && opts.dirty()) {
        asking = true;
        const leave = await dialog({ title: 'Закрыть без сохранения?', text: 'Введённый текст пропадёт.', actions: [{ label: 'Вернуться к тексту', value: false, kind: 'btn-primary' }, { label: 'Закрыть', value: true, kind: 'btn-line btn-danger' }] });
        asking = false;
        if (!leave) return;
      }
      popLayer(layer);
      if (opts.onClose) opts.onClose();
      refocus(opener);
    }
    pushLayer(layer);
    return {
      body: body,
      close: close,
      setFoot: function (nodes) { fill(foot, nodes); foot.hidden = !foot.childNodes.length; },
    };
  }

  function showTextSheet(title, text, hint) {
    const ta = h('textarea', { class: 'textarea', id: 'copy-text', rows: '8', readonly: true, value: text });
    const sheet = openSheet({ title: title });
    fill(sheet.body, hint ? h('p', { class: 'hint', text: hint }) : null, ta);
    sheet.setFoot([btn('Выделить всё', () => { ta.focus(); ta.select(); }, 'btn-primary')]);
    ta.focus(); ta.select();
  }
  function copyText(text, okMessage) {
    const fallback = () => showTextSheet('Скопируйте текст', text, 'Не получилось скопировать автоматически. Выделите текст и скопируйте его сами.');
    try { navigator.clipboard.writeText(text).then(() => toast(okMessage || 'Скопировано.'), fallback); } catch (e) { fallback(); }
  }

  /* ───────── чтение ───────── */
  function openReader(opts) {
    const ids = opts.ids.filter((id) => store.ideas.has(id));
    if (!ids.length) return;
    const st = { ids: ids, i: Math.min(Math.max(0, opts.index || 0), ids.length - 1), done: false, sig: '', timer: 0 };
    const opener = doc.activeElement;
    const daily = opts.mode === 'daily';
    let card = null, drag = null;
    let deckToSave = opts.deckToSave || null;
    let armed = !opts.auto;   // при автозапуске карточка не считается прочитанной, пока человек не дотронулся до приложения
    function read(id) {
      if (deckToSave) { patchDay(todayKey(), { deck: deckToSave }); deckToSave = null; }
      markRead(id);
    }

    const prog = h('div', { class: 'rprog' });
    const count = h('span', { class: 'rcount' });
    const stage = h('div', { class: 'reader-stage' });
    const ctl = (button, label) => h('div', { class: 'rctl' }, button, h('span', { 'aria-hidden': 'true', text: label }));
    const prevBtn = h('button', { class: 'rbtn', type: 'button', 'aria-label': 'Предыдущая идея', title: 'Предыдущая идея', onclick: () => step(-1) }, icon('left', 24));
    const skipBtn = h('button', { class: 'rbtn skip', type: 'button', 'aria-label': 'Не моё', title: 'Не моё: больше не показывать в подборке дня', onclick: toggleSkip }, icon('ban', 24));
    const favBtn = h('button', { class: 'rbtn fav', type: 'button', 'aria-label': 'Зацепило: в избранное', title: 'Зацепило: в избранное', onclick: toggleFav }, icon('heart', 24));
    const nextBtn = h('button', { class: 'rnext', type: 'button', onclick: () => step(1) });
    const moreBtn = iconBtn('more', 'Действия с идеей', () => ideaMenu(moreBtn, cur()));
    const skipCtl = ctl(skipBtn, 'Не моё'), favCtl = ctl(favBtn, 'Зацепило');
    const el = h('div', { class: 'reader', role: 'dialog', 'aria-modal': 'true', 'aria-label': opts.title || 'Чтение идей' },
      h('div', { class: 'reader-top' }, iconBtn('close', 'Закрыть', close), prog, count, moreBtn),
      stage,
      h('div', { class: 'reader-bottom' }, ctl(prevBtn, 'Назад'), skipCtl, favCtl, nextBtn));
    const layer = { el: el, update: update, onKey: onKey };

    function cur() { return store.ideas.get(st.ids[st.i]); }
    function sigOf(idea) { const s = stashOf(idea); return idea.id + '|' + idea.updatedAt + '|' + (s ? s.title + s.color : ''); }
    function setMarks(idea) {
      favBtn.classList.toggle('on', idea.fav);
      favBtn.setAttribute('aria-pressed', String(idea.fav));
      skipBtn.classList.toggle('on', idea.skip);
      skipBtn.setAttribute('aria-pressed', String(idea.skip));
    }

    function face(idea) {
      const s = stashOf(idea);
      const foot = [];
      if (idea.source) foot.push(h('span', { text: idea.source }));
      if (/^https:\/\//i.test(idea.url)) foot.push(h('a', { href: idea.url, target: '_blank', rel: 'noopener noreferrer', text: 'Подробнее: ' + hostOf(idea.url) }));
      else if (idea.url) foot.push(h('span', { text: idea.url }));
      if (idea.tags.length) foot.push(h('span', { class: 'rtags' }, idea.tags.map((t) => h('span', { text: '#' + t }))));
      return h('article', { class: 'rcard' },
        h('div', { class: 'rcard-kicker' }, h('i'), h('span', { class: 'ellip', text: s ? s.title : 'Без коллекции' })),
        idea.title ? h('h2', { class: 'rcard-title' }, h('span', { class: 'hl', text: idea.title })) : null,
        idea.text ? h('p', { class: 'rcard-text' + (idea.title ? '' : ' solo'), text: idea.text }) : null,
        foot.length ? h('div', { class: 'rcard-foot' }, foot) : null);
    }
    function endFace() {
      const s = streakInfo();
      const n = countDay(todayKey());
      return h('article', { class: 'rcard rend' },
        h('span', { class: 'label', text: daily ? 'Подборка дня' : (opts.title || 'Чтение') }),
        h('h2', null, h('span', { class: 'hl', text: daily ? 'Подборка прочитана' : 'Это была последняя идея' })),
        h('p', { class: 'rcard-text', text: 'Сегодня прочитано: ' + nIdeas(n) + '.' + (s.current > 1 ? ' Серия: ' + nDays(s.current) + ' подряд.' : '') }),
        h('div', { class: 'row' },
          daily ? btn('Ещё подборка', () => { close(); moreDaily(); }, 'btn-primary', 'right')
            : btn('С начала', () => { st.done = false; st.i = 0; paint(-1); }, 'btn-line'),
          btn('Закрыть', close, daily ? 'btn-line' : 'btn-primary')));
    }

    function paint(dir) {
      clearTimeout(st.timer);
      const n = st.ids.length;
      if (n <= 14) {
        prog.className = 'rprog';
        fill(prog, st.ids.map((_, k) => h('i', { class: st.done || k <= st.i ? 'on' : '' })));
      } else {
        prog.className = 'rprog bar';
        fill(prog, h('i', { style: { width: ((st.done ? n : st.i + 1) / n * 100) + '%' } }));
      }
      count.textContent = (st.done ? n : st.i + 1) + ' / ' + n;
      prevBtn.disabled = !st.done && st.i === 0;
      skipCtl.hidden = favCtl.hidden = nextBtn.hidden = moreBtn.hidden = st.done;
      if (st.done) {
        el.className = 'reader mk-0';
        card = endFace();
        st.sig = '';
      } else {
        const idea = cur();
        el.className = 'reader mk-' + markerOf(idea);
        card = face(idea);
        st.sig = sigOf(idea);
        setMarks(idea);
        const last = st.i === n - 1;
        fill(nextBtn, last ? 'Готово' : 'Дальше', icon(last ? 'check' : 'right', 20));
        if (armed) st.timer = setTimeout(() => read(idea.id), 1200);   // задержались на карточке — считаем прочитанной
      }
      if (dir) card.classList.add(dir > 0 ? 'in-next' : 'in-prev');
      fill(stage, card);
    }
    function step(d) {
      if (st.done) { if (d < 0) { st.done = false; paint(-1); } return; }
      if (d > 0) {
        const idea = cur();
        if (idea) read(idea.id);
        if (st.i === st.ids.length - 1) st.done = true; else st.i++;
        paint(1);
      } else if (st.i > 0) { st.i--; paint(-1); }
    }
    // две отметки исключают друг друга: по ним потом видно, какие темы человеку интересны
    function toggleFav() {
      const idea = cur();
      if (!idea) return;
      if (idea.fav) { patchIdea(idea.id, { fav: false }); return; }
      patchIdea(idea.id, { fav: true, skip: false });
      read(idea.id);   // раз зацепило, значит прочитано
    }
    function toggleSkip() {
      const idea = cur();
      if (!idea) return;
      if (idea.skip) { patchIdea(idea.id, { skip: false }); return; }
      patchIdea(idea.id, { skip: true, fav: false });
      step(1);   // «не моё» — и сразу к следующей
    }
    function update() {   // пока читалка открыта, идеи могли изменить или удалить
      const alive = st.ids.filter((id) => store.ideas.has(id));
      if (alive.length !== st.ids.length) {
        if (!alive.length) { close(); return; }
        const at = alive.indexOf(st.ids[st.i]);
        st.i = at >= 0 ? at : Math.min(st.i, alive.length - 1);
        st.ids = alive;
        paint(0);
        return;
      }
      if (st.done) return;
      const idea = cur();
      if (sigOf(idea) !== st.sig) paint(0); else setMarks(idea);
    }
    function onKey(e) {
      if (e.key === 'Escape') { close(); return; }
      if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); step(1); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); step(-1); }
    }
    function close() {
      clearTimeout(st.timer);
      popLayer(layer);
      refocus(opener);
    }

    // смахивание пальцем: влево — дальше, вправо — назад
    const settleCard = () => { if (card) { card.style.transition = ''; card.style.transform = ''; } };
    stage.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse' || st.done) return;
      drag = { id: e.pointerId, x: e.clientX, y: e.clientY, dx: 0, on: false };
    });
    stage.addEventListener('pointermove', (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.on) {
        if (Math.abs(dx) < 12 || Math.abs(dx) < Math.abs(dy) * 1.3) return;
        drag.on = true;
      }
      drag.dx = dx;
      card.style.transition = 'none';
      card.style.transform = 'translateX(' + (dx * 0.9) + 'px) rotate(' + (dx * 0.012) + 'deg)';
    });
    stage.addEventListener('pointerup', (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      const dx = drag.on ? drag.dx : 0;
      drag = null;
      settleCard();
      if (dx < -70) step(1); else if (dx > 70) step(-1);
    });
    stage.addEventListener('pointercancel', () => { drag = null; settleCard(); });

    // первое касание после автозапуска: с этого момента карточка, на которой задержались, считается прочитанной
    const arm = () => {
      if (armed) return;
      armed = true;
      const idea = st.done ? null : cur();
      if (idea) { clearTimeout(st.timer); st.timer = setTimeout(() => read(idea.id), 1200); }
    };
    ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach((type) => el.addEventListener(type, arm, { capture: true, passive: true }));

    pushLayer(layer);
    paint(0);
    nextBtn.focus();
  }

  function ideaAsText(idea) {
    return [idea.title, idea.text, idea.source ? '— ' + idea.source : ''].filter(Boolean).join('\n\n');
  }
  function deleteIdeaWithUndo(id) {
    const old = removeIdea(id);
    if (old) toast('Идея удалена.', { label: 'Вернуть', fn: () => restoreIdea(old) });
  }
  function ideaMenu(anchor, idea) {
    if (!idea) return;
    openMenu(anchor, [
      { label: 'Изменить', icon: 'edit', fn: () => openAdd({ idea: idea }) },
      { label: 'Скопировать текст', icon: 'copy', fn: () => copyText(ideaAsText(idea), 'Текст идеи скопирован.') },
      { label: 'Удалить', icon: 'trash', danger: true, fn: () => deleteIdeaWithUndo(idea.id) },
    ]);
  }

  /* ───────── добавление и правка идей ───────── */
  function stashPicker(selected, prefix) {
    const sel = h('select', { class: 'select', id: prefix + '-stash' });
    const name = h('input', { class: 'input', id: prefix + '-newstash', type: 'text', maxlength: '120', autocomplete: 'off', placeholder: 'Название новой коллекции', 'aria-label': 'Название новой коллекции', hidden: true });
    const options = () => fill(sel, h('option', { value: '', text: 'Без коллекции' }),
      sortedStashes().map((s) => h('option', { value: s.id, text: s.title })), h('option', { value: '+', text: '＋ Новая коллекция…' }));
    options();
    sel.value = store.stashes.has(selected) ? selected : '';
    sel.addEventListener('change', () => { name.hidden = sel.value !== '+'; if (!name.hidden) name.focus(); });
    const same = (title) => sortedStashes().find((s) => s.title.toLowerCase() === title.toLowerCase());
    return {
      el: h('div', { class: 'vstack tight' }, sel, name),
      sel: sel,
      name: name,
      suggest: function (title) {   // предложить коллекцию по названию: существующую или новую
        const found = same(title);
        if (found) { sel.value = found.id; name.hidden = true; } else { sel.value = '+'; name.hidden = false; name.value = title; }
      },
      resolve: function () {        // id коллекции ('' — без коллекции); null, если новая не названа
        if (sel.value !== '+') return sel.value;
        const title = name.value.trim();
        if (!title) return null;
        const st = same(title) || createStash({ title: title, color: nextColor() });
        options(); sel.value = st.id; name.hidden = true; name.value = '';
        return st.id;
      },
    };
  }

  function openAdd(opts) {
    opts = opts || {};
    const editing = opts.idea ? store.ideas.get(opts.idea.id) : null;
    let tab = editing ? 'one' : (opts.tab || 'one');
    if (tab === 'ai' && !env.sample) tab = 'one';
    const panes = {};
    const tabs = editing ? null : segmented(
      [['one', 'Одна идея'], ['bulk', 'Списком']].concat(env.sample ? [['ai', 'С Claude']] : []),
      () => tab, (v) => { tab = v; show(); }, 'full');
    const sheet = openSheet({
      title: editing ? 'Изменить идею' : 'Новая идея',
      tabs: tabs && tabs.el,
      dirty: () => Object.keys(panes).some((k) => panes[k].dirty()),
      onClose: () => Object.keys(panes).forEach((k) => { if (panes[k].dispose) panes[k].dispose(); }),
    });
    function show() {
      if (!panes[tab]) panes[tab] = tab === 'bulk' ? paneBulk() : tab === 'ai' ? paneAI() : paneOne();
      fill(sheet.body, panes[tab].el);
      panes[tab].foot();
      if (tabs) tabs.update();
      if (panes[tab].focus) panes[tab].focus();
    }
    const done = (stash) => { sheet.close(true); if (stash && !editing) go('c-' + stash); };

    function paneOne() {
      const init = editing || { title: '', text: '', stash: opts.stash || '', source: opts.stash ? lastSource(opts.stash) : '', url: '', tags: [] };
      const title = h('input', { class: 'input', id: 'f-title', type: 'text', maxlength: '160', autocomplete: 'off', placeholder: 'Главная мысль одной строкой', value: init.title });
      const text = h('textarea', { class: 'textarea', id: 'f-text', rows: '6', maxlength: '6000', placeholder: 'Суть своими словами: два-четыре предложения', value: init.text });
      const counter = h('span', { class: 'counter' });
      const picker = stashPicker(init.stash, 'f');
      const source = h('input', { class: 'input', id: 'f-source', type: 'text', maxlength: '200', autocomplete: 'off', list: 'dl-sources', placeholder: 'Автор, книга, подкаст', value: init.source });
      const url = h('input', { class: 'input', id: 'f-url', type: 'url', inputmode: 'url', maxlength: '500', autocomplete: 'off', placeholder: 'https://', value: init.url });
      const tags = h('input', { class: 'input', id: 'f-tags', type: 'text', maxlength: '200', autocomplete: 'off', placeholder: 'через запятую: привычки, фокус', value: init.tags.join(', ') });
      const err = h('p', { class: 'form-error', role: 'alert', hidden: true });
      const recount = () => { const n = text.value.length; counter.textContent = n + ' зн.'; counter.classList.toggle('warn', n > 700); };
      text.addEventListener('input', recount);
      recount();
      const snap = () => [title.value, text.value, picker.sel.value, picker.name.value, source.value, url.value, tags.value].join('\u0001');
      let base = snap();
      const fail = (message, control) => { err.textContent = message; err.hidden = false; if (control) control.focus(); return null; };
      function collect() {
        err.hidden = true;
        const t = title.value.trim(), x = text.value.trim();
        let u = url.value.trim();
        if (u && !/^[a-z][a-z0-9+.-]*:/i.test(u) && /^[^\s/]+\.[^\s]+$/.test(u)) { u = 'https://' + u; url.value = u; }   // адрес без https:// дополняем сами
        if (!t && !x) return fail('Напишите заголовок или текст идеи.', title);
        if (u && !/^https?:\/\/\S+$/i.test(u)) return fail('Ссылка должна начинаться с https://', url);
        const stash = picker.resolve();
        if (stash === null) return fail('Назовите новую коллекцию.', picker.name);
        return { title: t, text: x, stash: stash, source: source.value.trim(), url: u, tags: parseTags(tags.value) };
      }
      function save(again) {
        const data = collect();
        if (!data) return;
        if (editing) { updateIdea(editing.id, data); toast('Изменения сохранены.'); sheet.close(true); return; }
        createIdea(data);
        if (again) {
          toast('Идея добавлена. Можно писать следующую.');
          title.value = ''; text.value = ''; url.value = '';
          recount(); base = snap(); title.focus();
        } else { toast('Идея добавлена.'); sheet.close(true); }
      }
      const popular = derived().tags.slice(0, 8).map((t) => t[0]);
      const tagChips = popular.length ? h('div', { class: 'chips' }, popular.map((t) => h('button', { class: 'chip', type: 'button', onclick: () => {
        const list = parseTags(tags.value);
        const at = list.indexOf(t);
        if (at >= 0) list.splice(at, 1); else list.push(t);
        tags.value = list.join(', ');
      } }, '#' + t))) : null;
      const el = h('div', { class: 'vstack form' },
        field('Заголовок', title), field('Текст', text, counter), field('Коллекция', picker.el, null, picker.sel.id),
        field('Источник', source), field('Теги', h('div', { class: 'vstack tight' }, tags, tagChips), null, tags.id), field('Ссылка', url), err);
      return {
        el: el,
        dirty: () => snap() !== base,
        focus: () => { if (!editing) title.focus(); },
        foot: () => sheet.setFoot(editing
          ? [btn('Удалить', () => { sheet.close(true); deleteIdeaWithUndo(editing.id); }, 'btn-ghost btn-danger', 'trash'), h('span', { class: 'grow' }), btn('Сохранить', () => save(false), 'btn-primary')]
          : [btn('Сохранить и ещё одну', () => save(true), 'btn-line'), btn('Сохранить', () => save(false), 'btn-primary')]),
      };
    }

    function paneBulk() {
      const ta = h('textarea', { class: 'textarea', id: 'b-text', rows: '8', placeholder: 'Заголовок первой идеи\nЕё текст в одну или несколько строк.\n\nЗаголовок второй идеи\nИ её текст.' });
      const info = h('p', { class: 'hint' });
      const preview = h('div', { class: 'bulk-preview' });
      const picker = stashPicker(opts.stash || '', 'b');
      const source = h('input', { class: 'input', id: 'b-source', type: 'text', maxlength: '200', autocomplete: 'off', list: 'dl-sources', placeholder: 'Автор, книга, подкаст', value: opts.stash ? lastSource(opts.stash) : '' });
      const addBtn = btn('Добавить', addAll, 'btn-primary');
      let parsed = [];
      function refresh() {
        parsed = parseBulk(ta.value);
        info.textContent = parsed.length ? 'Распознано: ' + nIdeas(parsed.length) + '.' : 'Каждая идея — отдельный абзац, между идеями пустая строка. Первая строка абзаца станет заголовком.';
        fill(preview, parsed.slice(0, 30).map((p, k) => h('div', { class: 'bulk-item' },
          h('b', { text: (k + 1) + '. ' + (p.title || snippet(p.text, 70)) }), p.title && p.text ? h('span', { text: snippet(p.text, 110) }) : null)));
        addBtn.disabled = !parsed.length;
        addBtn.textContent = parsed.length ? 'Добавить ' + nIdeasAcc(parsed.length) : 'Добавить';
      }
      function addAll() {
        if (!parsed.length) return;
        const stash = picker.resolve();
        if (stash === null) { picker.name.focus(); return; }
        const src = source.value.trim(), t0 = Date.now();
        parsed.forEach((p, k) => createIdea({ title: p.title, text: p.text, stash: stash, source: src, createdAt: t0 + k, updatedAt: t0 + k }));
        toast('Добавлено: ' + nIdeas(parsed.length) + '.');
        done(stash);
      }
      ta.addEventListener('input', refresh);
      refresh();
      const el = h('div', { class: 'vstack form' },
        field('Идеи', ta), info, preview,
        h('button', { class: 'linkbtn', type: 'button', onclick: () => copyText(CHAT_PROMPT, 'Промпт скопирован. Отправьте его в любой ИИ-чат, а следом — название книги или текст.') }, 'Скопировать промпт для ИИ-чата, который выдаст идеи в таком виде'),
        field('Коллекция', picker.el, null, picker.sel.id), field('Источник', source));
      return { el: el, dirty: () => ta.value.trim().length > 0, focus: () => ta.focus(), foot: () => sheet.setFoot([addBtn]) };
    }

    function paneAI() {
      const src = h('textarea', { class: 'textarea', id: 'ai-src', rows: '7', maxlength: '60000', placeholder: 'Вставьте текст статьи или конспекта. Или просто назовите книгу либо тему.' });
      let n = 5, state = 'idle', ctl = null, items = [], checks = [], lastAsk = '';
      const nSeg = segmented([[3, '3'], [5, '5'], [7, '7'], [10, '10']], () => n, (v) => { n = v; nSeg.update(); });
      const picker = stashPicker(opts.stash || '', 'ai');
      const source = h('input', { class: 'input', id: 'ai-source', type: 'text', maxlength: '200', autocomplete: 'off', list: 'dl-sources', placeholder: 'Автор, книга, подкаст' });
      const statusText = h('span', { text: '' });
      const busyBox = h('div', { class: 'busy', role: 'status', hidden: true }, h('i', { class: 'spin' }), statusText);
      const err = h('p', { class: 'form-error', role: 'alert', hidden: true });
      const list = h('div', { class: 'vstack tight' });
      const inputBox = h('div', { class: 'vstack form' },
        field('Материал', src),
        h('div', { class: 'field' }, h('span', { class: 'label', text: 'Сколько идей выделить' }), nSeg.el),
        h('p', { class: 'hint', text: 'Запрос идёт через ваш аккаунт Claude и расходует его лимит. Если вы даёте только название, Claude пишет по памяти: важное сверяйте с источником.' }));
      const resultBox = h('div', { class: 'vstack form', hidden: true },
        h('p', { class: 'hint', text: 'Отметьте идеи, которые хотите сохранить. Текст потом можно поправить.' }), list,
        field('Коллекция', picker.el, null, picker.sel.id), field('Источник', source));
      const el = h('div', { class: 'vstack form' }, inputBox, busyBox, err, resultBox);

      function render() {
        inputBox.hidden = state !== 'idle';
        busyBox.hidden = state !== 'busy';
        resultBox.hidden = state !== 'result';
        if (state === 'result') {
          checks = items.map((_, k) => h('input', { type: 'checkbox', id: 'ai-pick-' + k, checked: true, onchange: foot }));
          fill(list, items.map((it, k) => h('label', { class: 'pick', for: 'ai-pick-' + k }, checks[k],
            h('div', null, it.title ? h('b', { text: it.title }) : null, h('span', { text: it.text })))));
        }
        foot();
      }
      function foot() {
        if (state === 'idle') sheet.setFoot([btn('Выделить идеи', run, 'btn-primary', 'spark')]);
        else if (state === 'busy') sheet.setFoot([btn('Остановить', () => { if (ctl) ctl.abort(); }, 'btn-line', 'stop')]);
        else {
          const k = checks.filter((c) => c.checked).length;
          const save = btn(k ? 'Сохранить ' + nIdeasAcc(k) : 'Ничего не выбрано', saveAll, 'btn-primary');
          save.disabled = !k;
          sheet.setFoot([btn('Назад', () => { state = 'idle'; render(); }, 'btn-line', 'left'), save]);
        }
      }
      async function run() {
        const material = src.value.trim();
        if (material.length < 3) { src.focus(); return; }
        const ask = n + '\u0001' + material;
        const o = { onText: (u) => {
          const k = (String(u.text).match(/"title"\s*:/g) || []).length;
          if (k) statusText.textContent = 'Claude пишет идеи: ' + Math.min(k, n) + ' из ' + n + '…';
        } };
        if (ask === lastAsk) o.cache = false;   // тот же запрос ещё раз — значит, нужен новый ответ, а не сохранённый
        lastAsk = ask;
        ctl = new AbortController();
        o.signal = ctl.signal;
        err.hidden = true;
        state = 'busy';
        statusText.textContent = 'Claude читает материал. Обычно это занимает до минуты.';
        render();
        try {
          const got = parseAI(await env.sample.json(aiPrompt(material, n), o));
          if (!got.items.length) throw { code: 'invalid_json' };
          items = got.items;
          if (!picker.sel.value && got.collection) picker.suggest(got.collection);
          if (!source.value && got.source) source.value = got.source;
          state = 'result';
        } catch (e) {
          state = 'idle';
          const code = e && e.code;
          if (code !== 'cancelled') {
            err.textContent = code === 'rate_limited' && e.reason === 'usage_limit' ? 'Лимит использования Claude исчерпан. Попробуйте позже.'
              : AI_ERRORS[code] || 'Не удалось получить ответ: похоже, проблема со связью. Попробуйте ещё раз.';
            err.hidden = false;
          }
        }
        ctl = null;
        render();
      }
      function saveAll() {
        const chosen = items.filter((_, k) => checks[k].checked);
        if (!chosen.length) return;
        const stash = picker.resolve();
        if (stash === null) { picker.name.focus(); return; }
        const srcText = source.value.trim(), t0 = Date.now();
        chosen.forEach((it, k) => createIdea({ title: it.title, text: it.text, tags: it.tags, stash: stash, source: srcText, createdAt: t0 + k, updatedAt: t0 + k }));
        toast('Сохранено: ' + nIdeas(chosen.length) + '.');
        state = 'idle'; src.value = '';
        done(stash);
      }
      return {
        el: el,
        dirty: () => state !== 'idle' || src.value.trim().length > 0,
        focus: () => { if (state === 'idle') src.focus(); },
        foot: foot,
        dispose: () => { if (ctl) ctl.abort(); },
      };
    }

    show();
  }

  /* ───────── коллекции ───────── */
  function openStashForm(st) {
    const name = h('input', { class: 'input', id: 's-title', type: 'text', maxlength: '120', autocomplete: 'off', placeholder: 'Например, название книги или тема', value: st ? st.title : '' });
    const note = h('textarea', { class: 'textarea short', id: 's-note', rows: '3', maxlength: '600', placeholder: 'О чём эта коллекция (необязательно)', value: st ? st.note : '' });
    let color = st ? st.color : nextColor();
    const swatches = h('div', { class: 'swatches', role: 'radiogroup', 'aria-label': 'Цвет маркера' });
    const paintSwatches = () => fill(swatches, MARKERS.map((label, k) => h('button', { class: 'swatch mk-' + k, type: 'button', role: 'radio', 'aria-checked': String(k === color), 'aria-label': label, title: label, onclick: () => { color = k; paintSwatches(); } })));
    paintSwatches();
    const err = h('p', { class: 'form-error', role: 'alert', hidden: true });
    const snap = () => name.value + '\u0001' + note.value + '\u0001' + color;
    const base = snap();
    const sheet = openSheet({ title: st ? 'Изменить коллекцию' : 'Новая коллекция', dirty: () => snap() !== base });
    function save() {
      const title = name.value.trim();
      if (!title) { err.textContent = 'Дайте коллекции название.'; err.hidden = false; name.focus(); return; }
      if (st) { updateStash(st.id, { title: title, note: note.value.trim(), color: color }); toast('Коллекция обновлена.'); sheet.close(true); }
      else { const made = createStash({ title: title, note: note.value.trim(), color: color }); sheet.close(true); go('c-' + made.id); }
    }
    fill(sheet.body, h('div', { class: 'vstack form' }, field('Название', name), field('Описание', note),
      h('div', { class: 'field' }, h('span', { class: 'label', text: 'Цвет маркера' }), swatches), err));
    sheet.setFoot([btn('Сохранить', save, 'btn-primary')]);
    name.focus();
  }
  async function askRemoveStash(st) {
    const n = ideasOf(st.id).length;
    const choice = await dialog(n ? {
      title: 'Удалить коллекцию «' + st.title + '»?',
      text: 'В ней ' + nIdeas(n) + '. Их можно оставить в библиотеке без коллекции или удалить вместе с ней.',
      actions: [{ label: 'Отмена', value: null, kind: 'btn-primary' }, { label: 'Удалить только коллекцию', value: 'keep' }, { label: 'Удалить вместе с идеями', value: 'all', kind: 'btn-line btn-danger' }],
    } : {
      title: 'Удалить коллекцию «' + st.title + '»?',
      actions: [{ label: 'Отмена', value: null, kind: 'btn-primary' }, { label: 'Удалить', value: 'keep', kind: 'btn-line btn-danger' }],
    });
    if (!choice) return;
    lib.tab = 'stashes';
    go('library');
    removeStash(st.id, choice === 'all');
    toast('Коллекция удалена.');
  }

  /* ───────── данные: копия, загрузка, очистка ───────── */
  function exportData() {
    const payload = exportPayload();
    const filename = 'sut-' + todayKey() + '.json';
    const asText = () => showTextSheet('Копия данных', payload, 'Сохранить файл здесь не получилось. Скопируйте текст и сохраните его в файл с расширением .json.');
    if (env.downloads) {
      env.downloads.save({ filename: filename, data: payload }).then(
        () => toast('Копия сохранена в файл ' + filename + '.'),
        (e) => { if (!e || e.code !== 'declined') asText(); });
      return;
    }
    if (env.hosted) { asText(); return; }
    try {
      const href = URL.createObjectURL(new Blob([payload], { type: 'application/json' }));
      const a = h('a', { href: href, download: filename });
      doc.body.appendChild(a); a.click(); a.remove();

  /* ───────── экран «Библиотека» ───────── */
  const lib = { tab: 'ideas', q: '', filter: 'all', sort: 'new', limit: 40, fresh: [] };
  function filterIdeas() {
    const f = lib.filter;
    let list = derived().all;
    if (f === 'fav') list = list.filter((i) => i.fav);
    else if (f === 'unread') list = list.filter((i) => !i.seen);
    else if (f === 'skip') list = list.filter((i) => i.skip);
    else if (f === 'none') list = list.filter((i) => !stashOf(i));
    else if (f.slice(0, 4) === 'tag:') { const t = f.slice(4); list = list.filter((i) => i.tags.includes(t)); }
    const words = norm(lib.q).split(/\s+/).filter(Boolean);
    if (words.length) {
      list = list.filter((i) => {
        const s = stashOf(i);
        const hay = norm(i.title + '\n' + i.text + '\n' + i.source + '\n' + i.tags.join(' ') + '\n' + (s ? s.title : ''));
        return words.every((w) => hay.includes(w));
      });
    }
    if (lib.sort === 'old') list = list.slice().reverse();
    else if (lib.sort === 'stale') list = list.slice().sort((a, b) => a.seenAt - b.seenAt || a.createdAt - b.createdAt);
    return list;
  }
