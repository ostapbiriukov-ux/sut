      seg.update();
      searchBox.hidden = lib.tab !== 'ideas' || !store.ideas.size;
      if (lib.tab === 'ideas') {
        if (!store.ideas.size) { lastSig = 'empty' + (env.sample ? 1 : 0); fill(body, emptyLibrary()); return; }
        const tags = derived().tags.slice(0, 8).map((t) => t[0]);
        if (lib.filter.slice(0, 4) === 'tag:' && !tags.includes(lib.filter.slice(4))) lib.filter = 'all';
        const list = filterIdeas();
        const shown = list.slice(0, lib.limit);
        const sig = ['i', lib.filter, lib.sort, lib.q ? 1 : 0, list.length, tags.join(','), shown.map((i) => {
          const s = stashOf(i);
          return i.id + i.updatedAt + (i.fav ? 'f' : '') + (i.skip ? 'x' : '') + (i.seen ? 's' : '') + (s ? s.title + s.color : '');
        }).join('|')].join('~');
        if (sig === lastSig) return;
        lastSig = sig;
        const rest = list.length - shown.length;
        fill(body, chips(tags), toolbar(list.length),
          shown.length ? h('div', { class: 'list' }, shown.map((i) => ideaCard(i, () => filterIdeas().map((x) => x.id))))
            : h('section', { class: 'empty' }, h('h2', { text: 'Ничего не нашлось' }), h('p', { text: 'Попробуйте другое слово или снимите фильтр.' }),
              btn('Сбросить поиск и фильтр', () => { lib.q = ''; lib.filter = 'all'; search.value = ''; update(); }, 'btn-line')),
          rest > 0 ? btn('Показать ещё ' + Math.min(40, rest), () => { lib.limit += 40; update(); }, 'btn-line') : null);
      } else {
        const sts = sortedStashes();
        const avail = availablePacks();
        const sig = 's' + sts.map((s) => { const l = ideasOf(s.id); return s.id + s.title + s.color + l.length + '/' + l.filter((i) => i.seen).length; }).join('|') +
          '~' + avail.map((p) => p.id + (lib.fresh.includes(p.id) ? '*' : '')).join(',');
        if (sig === lastSig) return;
        lastSig = sig;
        fill(body, h('div', { class: 'stashes' }, sts.map(stashCard),
          h('button', { class: 'stash new', type: 'button', onclick: () => openStashForm() }, icon('plus', 20), 'Новая коллекция')),
        avail.length ? h('section', { class: 'block' },
          h('div', { class: 'block-head' }, h('h2', { text: 'Каталог' }),
            avail.length > 1 ? h('button', { class: 'linkbtn', type: 'button', onclick: () => { const n = countIdeas(avail); addPacks(avail); toast('Добавлено: ' + nIdeas(n) + '.'); } }, 'Добавить все') : null),
          h('p', { class: 'hint', text: 'Готовые подборки, которых у вас пока нет. Берите то, что любопытно: идеи начнут попадать в подборку дня.' }),
          h('div', { class: 'list' }, avail.map((p) => packRow(p, lib.fresh.includes(p.id))))) : null);
      }
    }
    return { el: el, update: update };
  }

  /* ───────── экран коллекции ───────── */
  function StashView(route) {
    const el = h('div', { class: 'vstack' });
    function update() {
      const st = store.stashes.get(route.id);
      if (!st) return;
      const list = ideasOf(st.id);
      const ids = () => ideasOf(st.id).map((i) => i.id);
      const unread = list.findIndex((i) => !i.seen);
      const more = iconBtn('more', 'Действия с коллекцией', () => openMenu(more, [
        { label: 'Изменить', icon: 'edit', fn: () => openStashForm(st) },
        { label: 'Удалить', icon: 'trash', danger: true, fn: () => askRemoveStash(st) },
      ]), 'line');
      fill(el,
        h('button', { class: 'backlink', type: 'button', onclick: () => { lib.tab = 'stashes'; go('library'); } }, icon('left', 18), 'Библиотека'),
        h('header', { class: 'stash-head mk-' + st.color },
          h('span', { class: 'tabchip', text: nIdeas(list.length) }),
          h('h1', null, h('span', { class: 'hl', text: st.title })),
          st.note ? h('p', { class: 'lead', text: st.note }) : null),
        h('div', { class: 'row' },
          list.length ? btn(unread > 0 ? 'Продолжить' : 'Читать', () => openReader({ ids: ids(), index: Math.max(0, unread), mode: 'list', title: st.title }), 'btn-primary', 'play') : null,
          btn('Добавить', () => openAdd({ tab: 'one', stash: st.id }), 'btn-line', 'plus'), more),
        list.length ? h('div', { class: 'list' }, list.map((i) => ideaCard(i, ids, true)))
          : h('section', { class: 'empty' }, h('h2', { text: 'В коллекции пока пусто' }),
            h('p', { text: 'Добавляйте идеи по одной, списком или попросите Claude выделить главное из текста.' })));
    }
    return { el: el, update: update };
  }

  /* ───────── экран «Прогресс» ───────── */
  function heatmap() {
    const today = todayKey();
    const monday = (keyToDate(today).getDay() + 6) % 7;
    const start = addDays(today, -(monday + 7 * 15));
    const goal = store.state.goal;
    const grid = h('div', { class: 'heat', role: 'img', 'aria-label': 'Прочитанные идеи по дням за последние 16 недель' });
    for (let k = 0; k < 16 * 7; k++) {
      const key = addDays(start, k);
      if (key > today) { grid.appendChild(h('i', { class: 'off' })); continue; }
      const n = countDay(key);
      const level = !n ? '' : n >= goal ? 'l3' : n * 2 >= goal ? 'l2' : 'l1';
      grid.appendChild(h('i', { class: level, title: keyToDate(key).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }) + ': ' + nIdeas(n) }));
    }
    return grid;
  }
  function MeView() {
    const el = h('div', { class: 'vstack' });
    const tile = (value, label) => h('div', { class: 'tile' }, h('b', { text: String(value) }), h('span', { text: label }));
    function update() {
      const s = streakInfo();
      const today = countDay(todayKey());
      const total = store.ideas.size;
      let read = 0;
      store.ideas.forEach((i) => { if (i.seen) read++; });
      const goal = store.state.goal;
      const demo = derived().demo;
      const themeSeg = env.hosted ? null : segmented([['system', 'Как в системе'], ['light', 'Светлая'], ['dark', 'Тёмная']], () => store.state.theme, (v) => patchState({ theme: v }));
      const where = store.mode === 'cloud'
        ? 'Идеи хранятся в облаке вашего аккаунта Claude: они одинаковые на телефоне и на компьютере, и видите их только вы.'
        : env.hosted ? 'Идеи сохраняются только в этом браузере.'
          : 'Идеи хранятся в этом браузере на этом устройстве. Если очистить данные браузера, они пропадут, поэтому время от времени сохраняйте копию в файл.';
      fill(el,
        h('header', { class: 'vh' }, h('h1', { text: 'Прогресс' })),
        h('div', { class: 'tiles' },
          tile(s.current, plural(s.current, 'день подряд', 'дня подряд', 'дней подряд')),
          tile(today, 'прочитано сегодня'),
          tile(total, plural(total, 'идея в картотеке', 'идеи в картотеке', 'идей в картотеке')),
          tile(total ? Math.round(read / total * 100) + '%' : '0%', 'прочитано хотя бы раз')),
        h('section', { class: 'panel' },
          h('div', { class: 'block-head' }, h('h2', { text: 'Активность' }), h('span', { class: 'muted', text: 'лучшая серия: ' + nDays(s.best) })),
          h('div', { class: 'heat-wrap' }, heatmap()),
          h('div', { class: 'legend' }, 'меньше', h('i'), h('i', { class: 'l1' }), h('i', { class: 'l2' }), h('i', { class: 'l3' }), 'цель дня')),
        interestsPanel(),
        h('section', { class: 'panel' },
          h('div', { class: 'block-head' }, h('h2', { text: 'Подборка дня' })),
          h('div', { class: 'stepper' },
            iconBtn('minus', 'Меньше', () => patchState({ goal: goal - 1 }), 'line'),
            h('output', { text: nIdeas(goal) + ' в день' }),
            iconBtn('plus', 'Больше', () => patchState({ goal: goal + 1 }), 'line')),
          h('p', { class: 'hint', text: 'Столько идей попадает в подборку дня.' }),
          h('label', { class: 'check', for: 'set-auto' },
            h('input', { type: 'checkbox', id: 'set-auto', checked: store.state.autoOpen, onchange: (e) => patchState({ autoOpen: e.target.checked }) }),
            h('span', { text: 'При запуске сразу открывать первую карточку дня' }))),
        themeSeg ? h('section', { class: 'panel' }, h('div', { class: 'block-head' }, h('h2', { text: 'Оформление' })), themeSeg.el) : null,
        installPanel(),
        h('section', { class: 'panel' },
          h('div', { class: 'block-head' }, h('h2', { text: 'Данные' })),
          h('p', { class: 'hint', text: where }),
          h('div', { class: 'row' }, btn('Сохранить копию в файл', exportData, 'btn-line', 'down'), btn('Загрузить из копии', openImport, 'btn-line', 'up')),
          demo || total || store.stashes.size ? h('div', { class: 'row' },
            demo ? btn('Убрать готовые подборки', askRemoveDemo, 'btn-ghost btn-danger') : null,
            btn('Удалить всё', askWipe, 'btn-ghost btn-danger')) : null),
        h('p', { class: 'hint', text: 'Суть, версия 1.0' }));
    }
    return { el: el, update: update };
  }

  /* ───────── каркас и навигация ───────── */
  const NAV = [['today', 'Сегодня', 'sun'], ['library', 'Библиотека', 'cards'], ['me', 'Прогресс', 'chart']];
  const VIEWS = { today: TodayView, library: LibraryView, stash: StashView, me: MeView };
  const scrollMemo = new Map();
  let current = null, navHash = '', noticeSig = null, pendTimer = 0, sourcesSig = null;

  function readHash() { try { return (location.hash || '').replace(/^#/, ''); } catch (e) { return ''; } }
  function parseRoute() {
    if (navHash.slice(0, 2) === 'c-' && store.stashes.has(navHash.slice(2))) return { name: 'stash', id: navHash.slice(2) };
    if (navHash === 'library' || navHash === 'me') return { name: navHash };
    return { name: 'today' };
  }
  function go(name) {
    navHash = name;
    try { if (readHash() !== name) location.hash = name; } catch (e) { /* адресная строка недоступна: живём на внутреннем состоянии */ }
    route();
  }
  function route() {
    if (!store.ready) return;
    const r = parseRoute();
    const key = r.name + (r.id ? ':' + r.id : '');
    if (current && current.key === key) { current.update(); return; }
    if (current) scrollMemo.set(current.key, stageEl.scrollTop);
    const view = VIEWS[r.name](r);
    current = { key: key, update: view.update };
    fill(viewEl, view.el);
    view.update();
    stageEl.scrollTop = scrollMemo.get(key) || 0;
    const active = r.name === 'stash' ? 'library' : r.name;
    doc.querySelectorAll('[data-nav]').forEach((b) => {
      if (b.getAttribute('data-nav') === active) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
  }
  function buildShell() {
    fill(railEl,
      h('div', { class: 'brand' }, h('span', { class: 'hl', text: 'Суть' })),
      NAV.map((n) => h('button', { class: 'rail-item', type: 'button', 'data-nav': n[0], onclick: () => go(n[0]) }, icon(n[2], 20), h('span', { class: 'nav-label', text: n[1] }))),
      btn('Новая идея', () => openAdd({ tab: 'one' }), 'btn-primary rail-add', 'plus'),
      h('p', { class: 'rail-foot', id: 'rail-foot' }));
    const tab = (n) => h('button', { class: 'tab', type: 'button', 'data-nav': n[0], onclick: () => go(n[0]) }, icon(n[2], 22), h('span', { class: 'nav-label', text: n[1] }));
    fill(tabbarEl, tab(NAV[0]), tab(NAV[1]),
      h('button', { class: 'tab', type: 'button', 'aria-label': 'Новая идея', title: 'Новая идея', onclick: () => openAdd({ tab: 'one' }) }, h('span', { class: 'tab-plus' }, icon('plus', 22))),
      tab(NAV[2]));
  }
  function renderNotice() {
    const pend = adapter ? adapter.pending() : 0;
    const busy = pend > 12;
    if (busy && !pendTimer) pendTimer = setInterval(() => { if (adapter.pending() <= 12) { clearInterval(pendTimer); pendTimer = 0; } renderNotice(); }, 500);
    const sig = store.note + '|' + (store.retry ? 1 : 0) + '|' + (busy ? pend : 0) + '|' + (env.updateReady ? 1 : 0);
    if (sig === noticeSig) return;
    noticeSig = sig;
    fill(noticeEl,
      env.updateReady ? h('div', { class: 'notice', role: 'status' }, icon('spark', 18), h('p', { text: 'Вышло обновление приложения.' }),
        btn('Обновить', () => location.reload(), 'btn-sm btn-primary')) : null,
      store.note ? h('div', { class: 'notice', role: 'status' }, icon('info', 18), h('p', { text: store.note }),
        store.retry ? btn('Повторить', store.retry, 'btn-sm btn-line') : null) : null,
      busy ? h('div', { class: 'notice', role: 'status' }, h('i', { class: 'spin' }), h('p', { text: 'Сохраняю изменения в облако, осталось: ' + pend + '.' })) : null);
  }
  function syncSources() {
    const seen = [];
    for (const i of derived().all) { if (i.source && !seen.includes(i.source)) seen.push(i.source); if (seen.length >= 60) break; }
    const sig = seen.join('\n');
    if (sig === sourcesSig) return;
    sourcesSig = sig;
    fill(sourcesEl, seen.map((s) => h('option', { value: s })));
  }
  function applyTheme() {
    if (env.hosted) return;   // внутри Claude светлую или тёмную тему задаёт само приложение Claude
    const t = store.state.theme;
    if (t === 'light' || t === 'dark') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme');
    const meta = doc.querySelector('meta[name="theme-color"]');   // цвет системной полосы у установленного приложения
    if (meta) meta.setAttribute('content', getComputedStyle(root).getPropertyValue('--bg').trim() || '#f1f2f6');
  }
  function onChange() {
    if (!store.ready) return;
    applyTheme();
    renderNotice();
    syncSources();
    const foot = doc.getElementById('rail-foot');
    if (foot) foot.textContent = store.mode === 'cloud' ? 'Идеи хранятся в облаке Claude и видны только вам.' : 'Идеи хранятся в этом браузере.';
    route();
    layers.slice().forEach((l) => { if (l.update) l.update(); });
  }

  async function boot() {
    root.lang = 'ru';
    buildShell();
    navHash = readHash();
    window.addEventListener('hashchange', () => { navHash = readHash(); route(); });

    const cl = window.claude && typeof window.claude.use === 'function' ? window.claude : null;
    env.hosted = !!cl;
    // каталог подборок: в самостоятельной версии встроен в страницу, у страницы в Claude лежит рядом отдельным файлом
    if (Array.isArray(window.SUT_PACKS)) packs = cleanPacks(window.SUT_PACKS);
    else if (cl) {
      fetch('packs.json').then((r) => (r.ok ? r.json() : [])).then((list) => { packs = cleanPacks(list); emit(); })
        .catch(() => { /* каталог не загрузился: приложение работает и без него */ });
    }
    let db = null, owner = false;
    if (cl) {
      const use = (name) => Promise.resolve().then(() => cl.use(name)).catch(() => null);
      use('sample').then((s) => { if (typeof s === 'function' && typeof s.json === 'function') { env.sample = s; emit(); } });
      use('downloads').then((d) => { if (d && typeof d.save === 'function') env.downloads = d; });
      const got = await Promise.all([use('db'), use('user')]);
      db = got[0];
      try { owner = got[1] ? !!(await got[1].isOwner()) : false; } catch (e) { owner = false; }
    }
    if (db && owner) {
      store.mode = 'cloud';
      adapter = CloudAdapter(db);
    } else {
      store.mode = 'local';
      adapter = LocalAdapter();
      if (cl) {
        store.note = db ? 'Эта картотека принадлежит другому человеку. Ваши идеи сохраняются только в этом браузере.'
          : 'Облачное хранилище в этом окне недоступно. Показаны идеи, сохранённые в этом браузере.';
      }
    }
    await adapter.start();
    subs.add(onChange);
    onChange();
    setupInstall();
    if (navHash === 'add') { go('today'); openAdd({ tab: 'one' }); }   // ярлык «Новая идея» на значке приложения
    else maybeAutoOpen();
    if (window.matchMedia) {
      const scheme = window.matchMedia('(prefers-color-scheme: dark)');
      if (scheme.addEventListener) scheme.addEventListener('change', applyTheme);
    }

    let lastDay = todayKey();
    const tick = () => { const k = todayKey(); if (k !== lastDay) { lastDay = k; emit(); } };
    setInterval(tick, 30000);
    doc.addEventListener('visibilitychange', () => { if (!doc.hidden) tick(); });
  }

  boot().catch((e) => {
    console.error(e);
    fill(viewEl, h('section', { class: 'empty' }, h('h2', { text: 'Не получилось открыть картотеку' }),
      h('p', { text: 'Обновите страницу. Если не поможет, данные всё равно на месте: проблема в отображении, а не в хранилище.' })));
  });
})();
</script>
</body></html>
