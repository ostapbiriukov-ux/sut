<script>
window.SUT_PACKS = [{"id": "00s1", "title": "Привычки", "note": "Как маленькие ежедневные действия складываются в большие перемены.", "color": 0, "ideas": [{"id": "00i101", "title": "Один процент в день — это не мелочь", "text": "Маленькое улучшение сегодня почти незаметно, но такие шаги складываются, как сложный процент. Джеймс Клир приводит расчёт: если каждый день становиться на один процент лучше, за год станешь лучше в тридцать семь раз, а если каждый день сдавать на один процент, скатишься почти к нулю. Привычки он называет сложным процентом саморазвития.", "source": "Джеймс Клир, «Атомные привычки», глава 1 (отрывок на сайте автора)", "url": "https://jamesclear.com/marginal-gains", "tags": ["привычки", "рост"]}, {"id": "00i102", "title": "Петля привычки: сигнал, действие, награда", "text": "По Чарльзу Дахиггу, любая привычка — это петля из трёх частей. Сначала сигнал, который переводит мозг в автоматический режим. Затем само привычное действие. В конце награда: то, что мозгу нравится и помогает запомнить петлю на будущее. Когда меняются сигналы, шаблон ломается. Поэтому, говорит Дахигг, менять привычку проще в отпуске: старых сигналов и наград рядом нет.", "source": "Чарльз Дахигг, автор книги «Сила привычки», в интервью NPR", "url": "https://www.npr.org/2012/03/05/147192599/habits-how-they-form-and-how-to-break-them", "tags": ["привычки"]}, {"id": "00i103", "title": "Привяжите новую привычку к старой", "text": "Новое действие легче встроить в день, если прикрепить его к тому, что вы уже делаете. Формула такая: «После [привычное дело] я [новая привычка]». Например: «Налив утром кофе, я минуту помедитирую». Привычное дело служит ясным сигналом для нового. Метод придумал Би Джей Фогг для своей программы Tiny Habits; Джеймс Клир называет его наслаиванием привычек.", "source": "Би Джей Фогг; Джеймс Клир, «Атомные привычки»", "url": "https://jamesclear.com/habit-stacking", "tags": ["привычки", "приёмы"]}, {"id": "00i104", "title": "Правило двух минут для привычек", "text": "Новая привычка в начале должна занимать меньше двух минут. «Читать перед сном» превращается в «прочитать одну страницу», «пробежать три мили» — в «завязать кроссовки». Смысл не в результате, а в том, чтобы научиться начинать: привычку сначала нужно закрепить, и только потом её можно улучшать.", "source": "Джеймс Клир, «Атомные привычки» (отрывок на сайте автора)", "url": "https://jamesclear.com/how-to-stop-procrastinating", "tags": ["привычки", "приёмы"]}, {"id": "00i105", "title": "Окружение подсказывает, что делать", "text": "Заметная часть наших действий — просто ответ на то, что нас окружает: печенье на столе, скорее всего, будет съедено. Джеймс Клир предлагает менять не себя, а обстановку. Спортивную форму приготовьте с вечера, зубную нить поставьте рядом со щёткой. Правило одно: до полезного действия должно стать меньше шагов, до вредного — больше.", "source": "Джеймс Клир, статья о дизайне среды", "url": "https://jamesclear.com/environment-design-organ-donation", "tags": ["привычки", "среда"]}, {"id": "00i106", "title": "Сначала решите, кем вы хотите быть", "text": "Обычно привычки начинают с результата: «хочу похудеть». Джеймс Клир советует начинать с представления о себе, потому что поведение отражает то, каким человеком вы себя считаете. Шагов два: решить, каким человеком вы хотите быть, и доказывать это себе маленькими победами. Не «стать сильным», а «быть человеком, который не пропускает тренировки» — и для начала отжиматься три раза в неделю.", "source": "Джеймс Клир, «Атомные привычки», глава 2 (отрывок на сайте автора)", "url": "https://jamesclear.com/identity-based-habits", "tags": ["привычки", "идентичность"]}, {"id": "00i107", "title": "Намерение с местом и временем", "text": "Цель отвечает на вопрос «что я сделаю», а намерение реализации — «когда, где и как». Это план вида «если наступит такая-то ситуация, я сделаю то-то»: например, «завтра утром, выходя из душа, проведу самоосмотр». Петер Голльвитцер и Паскаль Ширан свели результаты 94 исследований: такие планы заметно повышают шансы довести дело до конца, эффект от среднего до большого.", "source": "Петер Голльвитцер и Паскаль Ширан, обзор для Национального института рака США", "url": "https://cancercontrol.cancer.gov/brp/research/constructs/implementation-intentions", "tags": ["привычки", "планирование"]}]}, {"id": "00s2", "title": "Фокус и глубокая работа", "note": "Как беречь внимание и делать сложное без спешки.", "color": 3, "ideas": [{"id": "00i201", "title": "Глубокая работа — редкий и ценный навык", "text": "Кэл Ньюпорт называет глубокой работой умение сосредоточиться без отвлечений на задаче, которая требует всей силы ума. Оно позволяет быстро осваивать сложное и выдавать ценный результат. Гипотеза Ньюпорта: такая работа становится всё ценнее и одновременно встречается всё реже, поэтому развивший этот навык выигрывает. Мало кто, замечает он, возвращается домой полным сил после дня лихорадочных ответов на письма.", "source": "Кэл Ньюпорт о своей книге «В работу с головой»", "url": "https://calnewport.com/deep-work-rules-for-focused-success-in-a-distracted-world/", "tags": ["фокус", "работа"]}, {"id": "00i202", "title": "Остаток внимания", "text": "Переключаясь на новую задачу, мы не переносим внимание целиком. В двух экспериментах Софи Лерой люди хуже справлялись со следующим делом, если предыдущее осталось незаконченным: оторвать от него мысли было трудно. Этот след она назвала остатком внимания. Легче всего переключались те, кто успел закончить первую задачу, причём в условиях нехватки времени.", "source": "Софи Лерой, Organizational Behavior and Human Decision Processes, 2009", "url": "https://ideas.repec.org/a/eee/jobhdp/v109y2009i2p168-181.html", "tags": ["фокус", "внимание"]}, {"id": "00i203", "title": "Метод помидора", "text": "Франческо Чирилло начал придумывать свой метод в 1980-х, готовясь к университетскому экзамену: он поспорил с собой, что сумеет сосредоточиться хотя бы на две минуты, и завёл кухонный таймер в виде помидора. Сегодня техника Pomodoro — целая система работы со временем, в основе которой 25-минутные отрезки и перерывы. Перерывы здесь — часть практики, а не награда за усердие. Чтобы начать, достаточно таймера, карандаша и бумаги.", "source": "Франческо Чирилло, официальный сайт техники Pomodoro", "url": "https://www.pomodorotechnique.com/what-is-the-pomodoro-technique.php", "tags": ["фокус", "приёмы"]}, {"id": "00i204", "title": "Состояние потока", "text": "Поток — это состояние, когда дело так захватывает, что им хочется заниматься ради него самого. Человек словно растворяется в занятии: внимание держится без усилий, действия кажутся полностью подвластными, а время идёт быстрее обычного. По Михаю Чиксентмихайи, поток возникает, когда задача трудна и требует умений, которые у вас действительно есть: навыки задействованы целиком, но соответствуют требованиям дела.", "source": "Михай Чиксентмихайи; учебник OpenStax Psychology 2e и словарь Американской психологической ассоциации", "url": "https://openstax.org/books/psychology-2e/pages/14-5-the-pursuit-of-happiness", "tags": ["фокус", "поток"]}, {"id": "00i205", "title": "Закон Паркинсона", "text": "«Работа заполняет время, отпущенное на её выполнение». Этот закон британский историк Сирил Норткот Паркинсон сформулировал в 1955 году в сатирическом эссе для журнала The Economist. Смеялся он над бюрократией, которую наблюдал офицером штаба во время Второй мировой: чиновники создают работу друг другу, чтобы множить число подчинённых и поднимать собственный вес. Позже он добавил второй закон: расходы растут вслед за доходами.", "source": "Сирил Норткот Паркинсон, 1955; энциклопедия «Британника»", "url": "https://www.britannica.com/biography/C-Northcote-Parkinson", "tags": ["время", "работа"]}, {"id": "00i206", "title": "Незаконченное не отпускает", "text": "Незавершённые цели продолжают крутиться в голове: в опытах Масикампо и Баумайстера они вызывали навязчивые мысли во время чтения и мешали решать посторонние задачи. Но когда участникам давали составить конкретный план для такой цели, эти эффекты пропадали, хотя сама цель оставалась невыполненной. План как будто ставит стремление на паузу до назначенного времени и освобождает ум для другого.", "source": "Масикампо и Баумайстер, Journal of Personality and Social Psychology, 2011", "url": "https://pubmed.ncbi.nlm.nih.gov/21688924/", "tags": ["внимание", "приёмы"]}]}, {"id": "00s3", "title": "Как учиться и запоминать", "note": "Приёмы, которые помогают знаниям остаться в голове надолго.", "color": 1, "ideas": [{"id": "00i301", "title": "Кривая забывания", "text": "В 1885 году немецкий психолог Герман Эббингауз заучивал списки бессмысленных слогов, а потом проверял, сколько осталось в памяти через разное время: от двадцати минут до тридцати дней. Так получилась кривая забывания. По его данным, как их приводит учебник, половина заученного теряется уже через двадцать минут, а 70% — через сутки. Дальше забывание замедляется: новое уходит быстро, а потом кривая выравнивается.", "source": "Герман Эббингауз, 1885; учебник OpenStax Psychology 2e", "url": "https://openstax.org/books/psychology-2e/pages/8-3-problems-with-memory", "tags": ["память", "учёба"]}, {"id": "00i302", "title": "Интервальные повторения", "text": "Повторять лучше не подряд, а с промежутками: это называют эффектом распределённой практики. Большой обзор 2006 года собрал 839 сравнений из 317 экспериментов и показал тонкость: лучший промежуток зависит от того, на какой срок нужно запомнить. Чем дольше должно храниться знание, тем больше стоит делать перерыв между повторениями.", "source": "Сепеда и соавторы, Psychological Bulletin, 2006", "url": "https://pubmed.ncbi.nlm.nih.gov/16719566/", "tags": ["память", "приёмы"]}, {"id": "00i303", "title": "Вспоминать полезнее, чем перечитывать", "text": "В опытах Рёдигера и Карпике студенты читали тексты, а затем одни перечитывали их, а другие по памяти записывали всё, что запомнили. Через пять минут лучше помнили те, кто перечитывал. Но через два дня и через неделю впереди были те, кто вспоминал, причём с большим отрывом. При этом перечитывавшие были увереннее в своих знаниях. Проверка себя не только измеряет знание, но и укрепляет его.", "source": "Рёдигер и Карпике, Psychological Science, 2006", "url": "https://pubmed.ncbi.nlm.nih.gov/16507066/", "tags": ["память", "учёба"]}, {"id": "00i304", "title": "Объясните воображаемому ученику", "text": "Чтобы лучше понять материал, попробуйте его объяснить. В опыте с 597 школьниками часть учеников объясняла тему однокласснику, часть — воображаемому слушателю, остальные не объясняли никому. Объяснение воображаемому ученику улучшило понимание и сразу, и на отложенной проверке; объяснение живому однокласснику помогло только сразу. Авторы оговариваются: применять приём на практике стоит с осторожностью.", "source": "Ван, Линь и Чэнь, British Journal of Educational Psychology, 2021", "url": "https://pubmed.ncbi.nlm.nih.gov/33759183/", "tags": ["учёба", "понимание"]}, {"id": "00i305", "title": "Желательные трудности", "text": "То, как легко идёт занятие, плохо предсказывает, что останется в памяти надолго. Роберт Бьорк назвал желательными трудностями условия, которые замедляют успехи на самом занятии, зато улучшают долгосрочный результат. Примеры: повторять с промежутками, а не подряд; проверять себя, а не перечитывать; перемешивать типы задач и менять условия практики.", "source": "Роберт Бьорк; сайт его лаборатории в Калифорнийском университете в Лос-Анджелесе", "url": "https://bjorklab.psych.ucla.edu/research/", "tags": ["учёба", "память"]}, {"id": "00i306", "title": "Осознанная практика", "text": "Опыт сам по себе не делает мастером: по данным, которые приводит Андерс Эрикссон, стаж, репутация и впечатление знатока слабо связаны с тем, как человек действительно работает. Мастерство вырастает из осознанной практики. Это занятия, часто выстроенные учителем или тренером, которые нацелены на улучшение конкретных задач и включают немедленную обратную связь, время на разбор и многократные повторения, чтобы отточить действие.", "source": "Андерс Эрикссон, Academic Emergency Medicine, 2008", "url": "https://pubmed.ncbi.nlm.nih.gov/18778378/", "tags": ["учёба", "мастерство"]}]}, {"id": "00s4", "title": "Ясное мышление", "note": "Ловушки ума и простые инструменты, чтобы в них не попадаться.", "color": 5, "removed": ["00i406", "00i408"], "ideas": [{"id": "00i401", "title": "Склонность к подтверждению", "text": "Склонность к подтверждению — привычка сосредоточиваться на том, что подтверждает уже сложившиеся убеждения. Пример из учебника психологии: если вы решили, что преподаватель неприятный человек, вы замечаете каждую его резкость и пропускаете бесчисленные случаи, когда он вёл себя приветливо.", "source": "Учебник OpenStax Psychology 2e, раздел 7.3", "url": "https://openstax.org/books/psychology-2e/pages/7-3-problem-solving", "tags": ["мышление", "искажения"]}, {"id": "00i402", "title": "Ошибка выжившего", "text": "Мы судим по тем, кто дошёл до конца, а выбывшие о себе рассказать не могут. Самый известный пример — математик Абрахам Вальд и пробоины на вернувшихся бомбардировщиках. Билл Кассельман в колонке Американского математического общества проверил эту историю: зерно правды в ней есть, но самые эффектные подробности почти ничем не подтверждены. Достоверно то, что Вальд в годы войны решал задачу об уязвимости самолётов, имея данные только о вернувшихся машинах.", "source": "Билл Кассельман, «Легенда об Абрахаме Вальде», колонка Американского математического общества", "url": "https://www.ams.org/publicoutreach/feature-column/fc-2016-06", "tags": ["мышление", "искажения"]}, {"id": "00i403", "title": "Невозвратные затраты", "text": "Невозвратные затраты — это то, что уже потрачено и чего не вернуть. Экономисты советуют не учитывать их в решениях. Пример из учебника: Селена заплатила восемь долларов за билет в кино и через полчаса поняла, что фильм ужасен. Деньги не вернутся в любом случае, а вот следующие полтора часа ещё можно потратить иначе. Урок: забыть о том, что ушло безвозвратно, и сравнивать только предстоящие выгоды и издержки.", "source": "Учебник OpenStax Principles of Economics 3e, раздел 2.1", "url": "https://openstax.org/books/principles-economics-3e/pages/2-1-how-individuals-make-choices-based-on-their-budget-constraint", "tags": ["мышление", "решения"]}, {"id": "00i404", "title": "Инверсия: думайте от обратного", "text": "В 1986 году Чарли Мангер, выступая перед выпускниками школы, повторил ход юмориста Джонни Карсона: тот не брался объяснить, как стать счастливым, зато по опыту знал, как наверняка сделать жизнь несчастной. Мангер пояснил приём: чтобы понять, как получить X, изучите, как получается «не X». Математик Якоби, по его словам, постоянно повторял: «Переворачивай, всегда переворачивай». Многие трудные задачи лучше всего решаются с конца.", "source": "Чарли Мангер, речь перед выпускниками Harvard School, 13 июня 1986 года", "url": "https://www.stripe.press/poor-charlies-almanack/talk-one", "tags": ["мышление", "модели"]}, {"id": "00i405", "title": "Бритва Оккама", "text": "Знаменитую формулу «не следует умножать сущности без необходимости» у самого Уильяма Оккама, философа XIV века, найти нельзя, хотя мысль действительно его. По Стэнфордской философской энциклопедии, это осторожное методологическое правило: не принимать утверждение, которое требует признать больше сущностей, чем конкурирующее, если к этому не вынуждают основания. Такими основаниями Оккам считал разум, опыт и Священное Писание.", "source": "Стэнфордская философская энциклопедия, статья «Уильям Оккам»", "url": "https://plato.stanford.edu/entries/ockham/", "tags": ["мышление", "модели"]}, {"id": "00i407", "title": "Эффект Даннинга — Крюгера", "text": "Чтобы оценить свою работу, нужны те же знания, что и для самой работы. В четырёх опытах Крюгера и Даннинга участники, попавшие в худшую четверть по тестам на юмор, грамматику и логику, сильно переоценивали себя: их результат был лучше, чем лишь у 12% участников, а сами они считали, что обошли 62%. Авторы связали это с неумением отличать верное от ошибочного. Когда участников подучили, они стали трезвее оценивать пределы своих умений.", "source": "Джастин Крюгер и Дэвид Даннинг, Journal of Personality and Social Psychology, 1999", "url": "https://pubmed.ncbi.nlm.nih.gov/10626367/", "tags": ["мышление", "искажения"]}, {"id": "00i409", "title": "Круг компетентности", "text": "Уоррен Баффет писал акционерам: чтобы вкладывать разумно, не обязательно разбираться в каждой компании и даже во многих. Достаточно уметь оценивать те, что лежат внутри вашего круга компетентности. «Размер этого круга не очень важен; жизненно важно знать его границы». Цель инвестора, по Баффету, проста: купить по разумной цене долю в понятном бизнесе, прибыль которого почти наверняка вырастет через пять, десять и двадцать лет.", "source": "Уоррен Баффет, письмо акционерам Berkshire Hathaway за 1996 год", "url": "https://www.berkshirehathaway.com/letters/1996.html", "tags": ["мышление", "решения"]}]}, {"id": "00s5", "title": "Стоицизм на каждый день", "note": "Мысли Эпиктета, Сенеки и Марка Аврелия о спокойствии и поступках.", "color": 4, "ideas": [{"id": "00i501", "title": "Что в нашей власти", "text": "Эпиктет начинает «Энхиридион» с разделения: одно в нашей власти, другое нет. В нашей власти мнения, стремления, желания и уклонение, словом, наши собственные действия. Не в нашей — тело, имущество, репутация и должности. Кто принимает чужое за своё, будет встречать препятствия, горевать и винить богов и людей. Кто считает своим только своё, того никто не принудит и не остановит.", "source": "Эпиктет, «Энхиридион», 1", "url": "https://standardebooks.org/ebooks/epictetus/short-works/george-long/text/the-enchiridion", "tags": ["стоицизм", "спокойствие"]}, {"id": "00i502", "title": "Нас тревожат не события, а суждения о них", "text": "Людей тревожат не сами события, а мнения о них, говорит Эпиктет. Его пример — смерть: в ней нет ничего ужасного, иначе она показалась бы ужасной и Сократу; ужасно само мнение, будто она ужасна. Поэтому, когда мы расстроены или встревожены, стоит винить не других, а собственные мнения. Необразованный винит в своих бедах других, начавший учиться — себя, а образованный не винит никого.", "source": "Эпиктет, «Энхиридион», 5", "url": "https://standardebooks.org/ebooks/epictetus/short-works/george-long/text/the-enchiridion", "tags": ["стоицизм", "эмоции"]}, {"id": "00i503", "title": "Заранее представить худшее", "text": "Сенека советует другу, который боится проиграть суд: чтобы избавиться от тревоги, допусти, что случится именно то, чего ты боишься, и оцени размер беды. Тогда станет видно, что она либо невелика, либо недолга. В другом письме он объясняет, зачем это нужно: тяжелее всего бьёт неожиданное. Поэтому ум стоит заранее посылать навстречу всему и думать не о том, что бывает обычно, а о том, что вообще может случиться.", "source": "Сенека, «Нравственные письма к Луцилию», письма 24 и 91", "url": "https://standardebooks.org/ebooks/seneca/moral-letters-to-lucilius/richard-m-gummere/text/letter-24", "tags": ["стоицизм", "практика"]}, {"id": "00i504", "title": "Каждое дело как последнее", "text": "Марк Аврелий советует себе делать то, что сейчас в руках, с простым достоинством, доброжелательностью, свободой и справедливостью, отложив все прочие мысли. Этого можно достичь, пишет он, если совершать каждое дело так, будто оно последнее в жизни: без небрежности, без притворства и себялюбия, без недовольства своей участью.", "source": "Марк Аврелий, «Размышления», 2.5", "url": "https://standardebooks.org/ebooks/marcus-aurelius/meditations/george-long/text/book-2", "tags": ["стоицизм", "время"]}, {"id": "00i505", "title": "Препятствие становится путём", "text": "Другие люди могут помешать моему действию, замечает Марк Аврелий, но не моему настрою и намерению. Ум способен обратить любую помеху себе на пользу. «То, что мешало делу, начинает делу помогать, и преграда на пути помогает идти по этому пути».", "source": "Марк Аврелий, «Размышления», 5.20", "url": "https://standardebooks.org/ebooks/marcus-aurelius/meditations/george-long/text/book-5", "tags": ["стоицизм", "трудности"]}, {"id": "00i506", "title": "Воображение мучает сильнее, чем реальность", "text": "Сенека пишет Луцилию: вещей, которые нас пугают, больше, чем тех, что действительно давят, и страдаем мы чаще в воображении, чем на деле. Его совет: не быть несчастным раньше времени. Опасность, перед которой вы бледнеете, может и не прийти, и во всяком случае ещё не пришла. Мы привыкли преувеличивать беду, выдумывать её или ждать заранее.", "source": "Сенека, «Нравственные письма к Луцилию», письмо 13", "url": "https://standardebooks.org/ebooks/seneca/moral-letters-to-lucilius/richard-m-gummere/text/letter-13", "tags": ["стоицизм", "тревога"]}, {"id": "00i507", "title": "Вечерний разбор дня", "text": "Философ Секстий каждый вечер, ложась спать, спрашивал себя: от какого недостатка я сегодня избавился? какому пороку воспротивился? в чём стал лучше? Сенека перенял эту привычку. Когда уносят светильник, он перебирает весь день, все свои слова и поступки, ничего от себя не скрывая. Бояться своих ошибок незачем, пишет он, если можно сказать себе: «На этот раз прощаю, но больше так не делай».", "source": "Сенека, «О гневе», книга III, 36", "url": "https://standardebooks.org/ebooks/seneca/dialogues/aubrey-stewart/text/on-anger", "tags": ["стоицизм", "практика"]}]}, {"id": "00s6", "title": "Решения и приоритеты", "note": "Как выбирать главное и не застревать в сомнениях.", "color": 2, "ideas": [{"id": "00i601", "title": "Принцип Парето", "text": "Экономист Вильфредо Парето заметил, что большая часть богатства принадлежит немногим. Джозеф Джуран в начале 1950-х увидел здесь общий закон и назвал его принципом Парето: в любой группе причин, дающих общий результат, немногие отвечают за основную его часть. Отсюда «правило 80/20»: примерно пятая часть причин даёт четыре пятых результата. Джуран называл эти причины «жизненно важным меньшинством».", "source": "Институт Джурана (Juran): о принципе Парето", "url": "https://www.juran.com/blog/a-guide-to-the-pareto-principle-80-20-rule-pareto-analysis/", "tags": ["приоритеты", "модели"]}, {"id": "00i602", "title": "Срочное и важное — не одно и то же", "text": "В 1954 году президент Эйзенхауэр привёл слова одного бывшего руководителя колледжа: «У меня два вида проблем: срочные и важные. Срочные не важны, а важные никогда не срочны». На тех же двух признаках построены четыре квадранта времени у Стивена Кови. Срочное — то, что нужно сделать скоро, как ответить на звонящий телефон. Важное — то, что служит вашим ценностям и главным целям. Лучше всего, по Кови, окупается важное, но несрочное: планирование, учёба, восстановление сил.", "source": "Дуайт Эйзенхауэр, речь 19 августа 1954 года; Стивен Кови, «7 навыков высокоэффективных людей», навык 3", "url": "https://www.presidency.ucsb.edu/documents/address-the-second-assembly-the-world-council-churches-evanston-illinois", "tags": ["приоритеты", "приёмы"]}, {"id": "00i603", "title": "Дело на две минуты делайте сразу", "text": "Правило Дэвида Аллена: если действие можно закончить за две минуты там, где вы сейчас находитесь, сделайте его сразу, а не откладывайте в список. Объяснение чисто практическое. На само дело уйдёт меньше двух минут, а чтобы потом снова на него посмотреть, вспомнить и обдумать, понадобится больше.", "source": "Дэвид Аллен, автор метода Getting Things Done", "url": "https://gettingthingsdone.com/2020/05/the-two-minute-rule-2/", "tags": ["приоритеты", "приёмы"]}, {"id": "00i604", "title": "Двери в одну и в две стороны", "text": "Джефф Безос делит решения на два типа. Первый — значимые и необратимые, «двери в одну сторону»: войдя, назад не вернёшься. Их нужно принимать методично, осторожно, медленно, после обсуждений. Второй тип — обратимые, «двери в обе стороны»: неудачное решение можно отменить. Такие стоит принимать быстро, силами одного толкового человека или небольшой группы. Беда больших компаний в том, что они применяют тяжёлую процедуру ко всему подряд и в итоге становятся медленными и боятся пробовать.", "source": "Джефф Безос, письмо акционерам Amazon за 2015 год", "url": "https://www.sec.gov/Archives/edgar/data/1018724/000119312516530910/d168744dex991.htm", "tags": ["решения", "модели"]}, {"id": "00i605", "title": "Правило 10–10–10", "text": "Сьюзи Уэлч описывает приём, которым пользуется при любом решении: спросить себя, какими будут его последствия через 10 минут, через 10 месяцев и через 10 лет. По её словам, это способ решать не на автомате, а обдуманно, заранее взвешивая, чем выбор обернётся прямо сейчас, в ближайшем будущем и в далёком.", "source": "Сьюзи Уэлч, «10-10-10» (отрывок из книги)", "url": "https://www.goodmorningamerica.com/news/story/suzy-welch-10-10-10-decision-making-process-10270041", "tags": ["решения", "приёмы"]}, {"id": "00i606", "title": "Разбор провала до старта", "text": "Проекты проваливаются очень часто, пишет Гэри Кляйн, и одна из причин в том, что на этапе планирования люди не решаются высказать сомнения. Его приём называется premortem. Группа представляет, что событие уже произошло, то есть проект провалился, и придумывает этому объяснение. Тем, кто знает дело и видит его слабые места, так безопаснее высказаться, а шансов на плохой исход становится меньше.", "source": "Гэри Кляйн, Harvard Business Review, сентябрь 2007", "url": "https://hbr.org/2007/09/performing-a-project-premortem", "tags": ["решения", "планирование"]}]}, {"id": "00s07", "title": "Почему затягивает лента", "note": "Как приложения удерживают внимание и что с этим можно сделать.", "color": 7, "ideas": [{"id": "00i0701", "title": "Награда, которую нельзя предсказать", "text": "Психологи различают режимы подкрепления, то есть правила, по которым поведение получает награду. Если награда приходит после непредсказуемого числа действий, поведение идёт быстро и ровно и дольше всего не угасает, когда награды прекращаются. Учебник приводит в пример азартные игры. Проверку соцсетей он относит к соседнему режиму, где награда приходит через непредсказуемое время: реакция умеренная, но устойчивая.", "source": "Учебник OpenStax Psychology 2e, раздел 6.3", "url": "https://openstax.org/books/psychology-2e/pages/6-3-operant-conditioning", "tags": ["внимание", "привычки"]}, {"id": "00i0702", "title": "У ленты нет конца, и это не случайность", "text": "Бесконечную прокрутку в 2006 году придумал инженер Аза Раскин: с ней можно листать сколько угодно, ничего не нажимая. В интервью Би-би-си он объяснил, чем это оборачивается: «Если не давать мозгу времени догнать собственные порывы, вы просто продолжаете листать». Раскин говорит, что не собирался никого делать зависимым и теперь чувствует вину. Причину он видит в бизнес-модели: компаниям нужно, чтобы время в приложении росло.", "source": "Аза Раскин в интервью Би-би-си", "url": "https://www.bbc.com/news/technology-44640959", "tags": ["внимание", "технологии"]}, {"id": "00i0703", "title": "Хотеть — не значит получать удовольствие", "text": "Кент Берридж и Терри Робинсон показали, что «хочу» и «нравится» обеспечивают в мозге разные системы. Тягу к награде создаёт мощная система, в которую входит дофамин. Само удовольствие зависит от других, меньших и более хрупких систем, и дофамин для него не нужен. Отсюда их объяснение зависимости: тяга, особенно в ответ на привычные сигналы, усиливается, а удовольствие при этом не обязательно растёт.", "source": "Кент Берридж и Терри Робинсон, American Psychologist, 2016", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC5171207", "tags": ["мозг", "внимание"]}, {"id": "00i0704", "title": "Плохое цепляет сильнее хорошего", "text": "Обзор Роя Баумайстера с коллегами собрал данные из разных областей психологии: плохие эмоции, плохие отзывы и плохие впечатления действуют сильнее хороших, а плохая информация обрабатывается тщательнее. Исключений авторы почти не нашли. То же видно в новостях: в анализе примерно 105 тысяч вариантов заголовков каждое дополнительное негативное слово повышало долю кликов на 2,3%.", "source": "Баумайстер и соавторы, Review of General Psychology, 2001; Робертсон и соавторы, Nature Human Behaviour, 2023", "url": "https://experts.umn.edu/en/publications/bad-is-stronger-than-good/", "tags": ["внимание", "новости"]}, {"id": "00i0705", "title": "Три условия любого действия", "text": "По модели Би Джея Фогга действие происходит, только когда в один момент сходятся три вещи: мотивация, возможность и подсказка. Если действия нет, значит, не хватило хотя бы одной. Отсюда практический вывод в обе стороны. Чтобы привычка появилась, сделайте действие проще и поставьте напоминание. Чтобы ушла, уберите подсказку или усложните действие: например, отключите уведомления или выйдите из аккаунта.", "source": "Модель поведения Би Джея Фогга, Лаборатория дизайна поведения Стэнфорда", "url": "https://behaviordesign.stanford.edu/resources/fogg-behavior-model", "tags": ["привычки", "приёмы"]}, {"id": "00i0706", "title": "Скука — не поломка", "text": "Скуку обычно считают вредной, но Сэнди Манн и Ребекка Кэдман проверили, не помогает ли она придумывать новое. В первом опыте 80 человек сначала либо выполняли скучное письменное задание, либо нет, а затем решали творческую задачу; во втором 90 человек скучали по-разному: писали или читали. После скучных занятий участники показывали себя изобретательнее. Авторы связывают это с тем, что скучающий ум уходит в мечты наяву.", "source": "Сэнди Манн и Ребекка Кэдман, 2014", "url": "https://knowledge.lancashire.ac.uk/22263/", "tags": ["внимание", "креативность"]}]}, {"id": "00s08", "title": "Деньги без паники", "note": "Базовые идеи о личных финансах, которые полезно знать каждому.", "color": 1, "ideas": [{"id": "00i0801", "title": "Сложный процент и правило 72", "text": "Сложный процент — это проценты на проценты. Положите 100 долларов под 5% годовых: через год будет 105, через два — 110,25, потому что доход начислен и на первые пять долларов. Если больше ничего не вносить, через 10 лет на счёте окажется больше 162 долларов, а через 25 — почти 340. Срок удвоения прикидывают по правилу 72: разделите 72 на годовую ставку. При 9% вклад удваивается примерно за 8 лет.", "source": "Investor.gov, сайт Комиссии по ценным бумагам и биржам США", "url": "https://www.investor.gov/additional-resources/information/youth/teachers-classroom-resources/what-compound-interest", "tags": ["деньги", "проценты"]}, {"id": "00i0802", "title": "Инфляция съедает молча", "text": "Инфляция — это устойчивое повышение общего уровня цен. Банк России описывает её цену так: при высокой инфляции доходы теряют покупательную способность, а обесценение подрывает само желание сберегать. Даже при 4% в год, а это цель Банка России, цены удваиваются примерно за 18 лет: 1,04 в восемнадцатой степени чуть больше двух. Значит, доход по сбережениям имеет смысл сравнивать с ростом цен.", "source": "Банк России, «Что такое инфляция»", "url": "https://cbr.ru/dkp/about_inflation/", "tags": ["деньги", "инфляция"]}, {"id": "00i0803", "title": "Подушка безопасности", "text": "Финансовая подушка — запас денег на чёрный день: увольнение, болезнь, поломку. Её размер, по материалам Банка России, зависит от ваших рисков. Если здоровье крепкое, профессия востребована и долгов нет, может хватить пары зарплат. Если на вас дети, пожилые родители и ипотека, понадобится сумма минимум на полгода жизни. Хранить запас лучше на вкладе или накопительном счёте, откуда деньги можно забрать в любой момент, а пополнять удобнее прямо в день зарплаты.", "source": "Fincult.info, сайт Банка России о финансовой грамотности", "url": "https://fincult.info/article/finansovaya-podushka-bezopasnosti-chto-eto-takoe-i-zachem-ona-nuzhna/", "tags": ["деньги", "запас"]}, {"id": "00i0804", "title": "Сначала заплати себе", "text": "В книге-притче Джорджа Клейсона герой получает совет, который делает его богатым: «Часть всего, что ты зарабатываешь, принадлежит тебе». Откладывать нужно не меньше десятой доли, как бы мало ты ни получал, и делать это в первую очередь: сначала заплати себе, а портному и сапожнику — из оставшегося. Богатство, говорится там, растёт как дерево из крошечного семени, и первая сбережённая монета и есть это семя.", "source": "Джордж Клейсон, «Самый богатый человек в Вавилоне»", "url": "https://archive.org/stream/RichestManInBabylon_650/the_richest_man_in_babylon_djvu.txt", "tags": ["деньги", "привычки"]}, {"id": "00i0805", "title": "Расходы растут вслед за доходами", "text": "О том, что на сбережения не хватает денег, говорят люди с любым доходом, замечают в американском регуляторе FINRA. Дело в том, что называют lifestyle creep, «расползанием образа жизни»: траты подтягиваются к заработку. Совет оттуда же: при каждой прибавке к зарплате сразу «повышать зарплату себе будущему», то есть направлять часть прибавки в накопления. И настроить автоматический перевод, чтобы эти деньги не уходили на повседневное.", "source": "FINRA, регулятор брокерской отрасли США: материал для инвесторов", "url": "https://syndication.finra.org/content/how-invest-budget", "tags": ["деньги", "привычки"]}, {"id": "00i0806", "title": "Цена вещи в часах жизни", "text": "Деньги — это то, на что мы обмениваем свою жизненную энергию, то есть отпущенное нам время, говорится в книге «Кошелёк или жизнь?». Чтобы узнать настоящую цену своего часа, из заработка вычтите всё, чего стоит сама работа: дорогу, рабочую одежду, обеды, траты на то, чтобы прийти в себя. А к рабочим часам прибавьте сборы, дорогу и отдых после работы. Разделите одно на другое, и любую покупку можно будет пересчитать в часы жизни.", "source": "Вики Робин и Джо Домингес, «Кошелёк или жизнь?» (краткое изложение на сайте Вики Робин)", "url": "https://vickirobin.com/your-money-or-your-life-summary/", "tags": ["деньги", "решения"]}]}, {"id": "00s09", "title": "Сон и энергия", "note": "Что известно о сне и бодрости и как этим пользоваться.", "color": 6, "ideas": [{"id": "00i0901", "title": "Сколько сна нужно взрослому", "text": "Национальный фонд сна США рекомендует взрослым семь–девять часов сна в сутки, пожилым — семь–восемь. Недосып накапливается незаметно. В опыте Ван Донгена здоровые взрослые две недели спали по шесть или по четыре часа, и их внимание ухудшалось с каждым днём, дойдя до уровня двух бессонных ночей подряд. При этом сонливость почти не росла: участники не замечали, насколько хуже стали работать.", "source": "Национальный фонд сна (США), 2015; Ван Донген и соавторы, журнал Sleep, 2003", "url": "https://pubmed.ncbi.nlm.nih.gov/29073412/", "tags": ["сон", "здоровье"]}, {"id": "00i0902", "title": "Социальный джетлаг", "text": "У каждого свой хронотип: одни по природе встают рано, другие поздно, большинство посередине. Расписание работы и учёбы с этим не считается. Сильнее всего страдают «совы»: в будни они недосыпают, а в свободные дни отсыпаются. Разрыв между социальным и биологическим временем хронобиологи назвали социальным джетлагом. В опросе 501 человека «совы» заметно чаще курили, и авторы считают такие связи следствием именно этого разрыва. Их вывод: расписание по возможности стоит подстраивать под хронотип.", "source": "Виттман, Рённеберг и соавторы, Chronobiology International, 2006", "url": "https://pubmed.ncbi.nlm.nih.gov/16687322/", "tags": ["сон", "режим"]}, {"id": "00i0903", "title": "Свет настраивает внутренние часы", "text": "Внутренние часы организма находятся в гипоталамусе, в супрахиазматическом ядре. Сверяются они по свету: светочувствительные нейроны сетчатки сообщают часам, сколько света вокруг, и так внутренний ритм подстраивается под внешний мир. С тем же сигналом связан мелатонин, один из главных регуляторов сна и бодрствования: темнота запускает его выделение, а свет подавляет.", "source": "Учебник OpenStax Psychology 2e, раздел 4.1", "url": "https://openstax.org/books/psychology-2e/pages/4-1-what-is-consciousness", "tags": ["сон", "свет"]}, {"id": "00i0904", "title": "Кофеин действует дольше, чем кажется", "text": "В опыте Дрейка с коллегами участники получали 400 мг кофеина прямо перед сном, за три часа или за шесть часов до него. Сон нарушался во всех трёх случаях. Даже кофеин, принятый за шесть часов, сокращал сон больше чем на час, причём приборы это фиксировали, а сами участники в дневниках не замечали. Вывод авторов: от заметных доз кофеина стоит отказаться минимум за шесть часов до сна.", "source": "Дрейк и соавторы, Journal of Clinical Sleep Medicine, 2013", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC3805807", "tags": ["сон", "кофеин"]}, {"id": "00i0905", "title": "Короткий дневной сон", "text": "Какой длины должен быть дневной сон? Брукс и Лэк проверили это на 24 молодых людях, спавших ночью около пяти часов. Пять минут дрёмы почти ничего не дали. Десять минут сразу улучшили бодрость и работу ума, и часть эффекта держалась больше двух с половиной часов. После двадцати минут польза приходила через 35 минут, а после тридцати сначала наступала вялость, инерция сна, и лишь потом улучшение. Лучшим оказался десятиминутный сон.", "source": "Брукс и Лэк, журнал Sleep, 2006", "url": "https://pubmed.ncbi.nlm.nih.gov/16796222/", "tags": ["сон", "энергия"]}, {"id": "00i0906", "title": "Движение как минимум", "text": "Всемирная организация здравоохранения рекомендует взрослым 150–300 минут умеренной аэробной нагрузки в неделю или 75–150 минут интенсивной, а также регулярные упражнения для укрепления мышц. Нижняя граница — это полчаса пять раз в неделю. Два главных вывода рекомендаций: любая физическая активность лучше, чем её полное отсутствие, а сидячего времени стоит становиться меньше в любом возрасте.", "source": "Рекомендации ВОЗ по физической активности, 2020", "url": "https://www.who.int/ru/news-room/fact-sheets/detail/physical-activity", "tags": ["здоровье", "движение"]}]}, {"id": "00s10", "title": "Как устроены люди", "note": "Открытия социальной психологии о том, как мы видим себя и других.", "color": 2, "ideas": [{"id": "00i1001", "title": "Фундаментальная ошибка атрибуции", "text": "Объясняя чужие поступки, мы склонны переоценивать характер человека и недооценивать обстоятельства. Это называют фундаментальной ошибкой атрибуции (Ли Росс, 1977). Пример из учебника: человек пришёл домой и накричал на близких. Первая мысль — «грубиян»; о том, что его только что уволили, мы не знаем. Со своими поступками наоборот: о себе мы помним обстоятельства. Учебник оговаривается: эффект, возможно, слабее, чем принято считать, и свойствен не всем культурам.", "source": "Ли Росс, 1977; учебник OpenStax Psychology 2e, раздел 12.1", "url": "https://openstax.org/books/psychology-2e/pages/12-1-what-is-social-psychology", "tags": ["психология", "люди"]}, {"id": "00i1002", "title": "Эффект прожектора", "text": "Нам кажется, что окружающие замечают нашу внешность и поступки гораздо внимательнее, чем на самом деле. Томас Гилович с коллегами просили участников надеть футболку с лестным или неловким изображением и оценить, сколько человек его запомнит. Участники переоценивали это число. Так же они переоценивали, насколько заметны другим их удачные и неудачные реплики в обсуждении. Объяснение авторов: мы отталкиваемся от собственных ярких ощущений и недостаточно поправляемся на чужую точку зрения.", "source": "Гилович, Медвек и Савицки, Journal of Personality and Social Psychology, 2000", "url": "https://pubmed.ncbi.nlm.nih.gov/10707330/", "tags": ["психология", "тревога"]}, {"id": "00i1003", "title": "Эффект свидетеля", "text": "Чем больше людей видят, что кому-то нужна помощь, тем меньше вероятность, что поможет каждый из них. Это явление в 1968 году описали психологи Латане и Дарли. Объясняют его рассеиванием ответственности: каждый думает, что уже вмешался кто-то другой. Толчком к исследованиям стало убийство Китти Дженовезе в 1964 году. Писали, что никто из соседей не помог, но позже выяснилось, что случай описали неточно: некоторые свидетели всё же вмешались.", "source": "Латане и Дарли, 1968; учебник OpenStax Psychology 2e, раздел 12.6", "url": "https://openstax.org/books/psychology-2e/pages/12-6-aggression", "tags": ["психология", "люди"]}, {"id": "00i1004", "title": "Давление большинства", "text": "В опытах Соломона Аша нужно было сравнить длину отрезков, и верный ответ был очевиден. Но в группе все, кроме одного, были подставными и называли неверный вариант. В итоге 76% настоящих участников хотя бы раз согласились с группой вопреки собственным глазам. Давление росло, пока большинство не достигало семи человек, а дальше не усиливалось. Зато хватало одного несогласного, чтобы конформность упала почти до нуля.", "source": "Соломон Аш, 1955; учебник OpenStax Psychology 2e, раздел 12.4", "url": "https://openstax.org/books/psychology-2e/pages/12-4-conformity-compliance-and-obedience", "tags": ["психология", "группа"]}, {"id": "00i1005", "title": "Эффект ореола", "text": "Общее впечатление о человеке окрашивает наши суждения о его отдельных качествах. Того, кто нам симпатичен, мы легко считаем более умным, знающим и честным, чем он есть. Привлекательных внешне чаще считаем хорошими людьми, а общительных и дружелюбных — более нравственными. Словарь Американской психологической ассоциации называет это ошибкой оценки: общее впечатление или одно качество влияет на суждения обо всех остальных.", "source": "Словарь Американской психологической ассоциации; учебник OpenStax Psychology 2e", "url": "https://dictionary.apa.org/halo-effect", "tags": ["психология", "искажения"]}, {"id": "00i1006", "title": "Запоминаются пик и финал", "text": "Вспоминая пережитое, мы не складываем все его минуты. Редельмейер и Канеман записывали, какую боль чувствуют пациенты прямо во время колоноскопии и дробления камней, а потом спрашивали, насколько тяжёлой была процедура в целом. Итоговая оценка зависела от двух моментов: самого болезненного и последних трёх минут. Длительность почти не влияла: долгие процедуры не вспоминались как более тяжёлые.", "source": "Редельмейер и Канеман, журнал Pain, 1996", "url": "https://pubmed.ncbi.nlm.nih.gov/8857625/", "tags": ["психология", "память"]}]}, {"id": "00s11", "title": "Разговор и влияние", "note": "Приёмы, которые помогают слушать, договариваться и говорить о трудном.", "color": 4, "ideas": [{"id": "00i1101", "title": "Сначала понять, потом быть понятым", "text": "Стивен Кови считал это главным принципом общения: сначала стремись понять, потом — быть понятым. Обычно мы слушаем «автобиографически»: превращаем чужой рассказ в свой и пропускаем слова собеседника через собственный опыт и ценности. Эмпатическое слушание устроено иначе: мы сдерживаем желание тут же ответить и даём человеку место высказать свою точку зрения и чувства. А когда приходит наша очередь, говорим ясно и с учётом того, что нужно слушателю.", "source": "Стивен Кови, «7 навыков высокоэффективных людей», навык 5", "url": "https://www.franklincovey.com/courses/the-7-habits/habit-5/", "tags": ["общение", "слушание"]}, {"id": "00i1102", "title": "Я-сообщения", "text": "Сказать человеку только о своих чувствах недостаточно: он не поймёт, что именно не так. В модели Томаса Гордона у «я-сообщения» три части: короткое описание поведения без обвинений, ваши чувства и ощутимые последствия этого поведения для вас. Пример: «Я очень расстраиваюсь, когда тебя нет на месте в 8:30 и некому ответить на звонки, потому что мне приходится бросать свою работу и подменять тебя».", "source": "Томас Гордон; Gordon Training International", "url": "https://www.gordontraining.com/leadership/what-are-the-essential-components-of-an-i-message/", "tags": ["общение", "конфликты"]}, {"id": "00i1103", "title": "Четыре опоры ненасильственного общения", "text": "Метод Маршалла Розенберга строится вокруг четырёх вещей: наблюдения, чувства, потребности и просьбы. Его суть Центр ненасильственного общения формулирует так: влиять на других не принуждением, а открыто говоря о своих чувствах и потребностях и обращаясь с просьбой. Полезно проверять себя: нет ли в моих словах критики и обвинений, не прячется ли за просьбой требование, готов ли я услышать «нет». В опыте со 198 студентами-медиками курс метода повысил эмпатию и навыки общения сильнее обычной программы; проверен только краткосрочный эффект.", "source": "Маршалл Розенберг; Центр ненасильственного общения (CNVC); BMC Medical Education, 2026", "url": "https://www.cnvc.org/about/purpose-of-nvc", "tags": ["общение", "конфликты"]}, {"id": "00i1104", "title": "Назовите чувство вслух", "text": "Когда собеседник считает, что его не слышат, спорить с этим бесполезно. В подходе Криса Восса советуют назвать его ощущение вслух. Не «я не хочу, чтобы вы думали, будто мы вас игнорируем», а «наверняка вам кажется, что мы игнорируем ваши желания». Это просто наблюдение: вы не соглашаетесь и не возражаете. Приём называют labeling, «навешиванием ярлыка». Человек чувствует себя услышанным именно там, где вы расходитесь, и негатив разряжается.", "source": "The Black Swan Group, компания Криса Восса", "url": "https://www.blackswanltd.com/newsletter/are-you-tactical-empathy-curious", "tags": ["переговоры", "эмоции"]}, {"id": "00i1105", "title": "Запасной вариант в переговорах", "text": "BATNA — это лучшая альтернатива обсуждаемому соглашению, то есть то, что вы будете делать, если договориться не удастся. Программа по переговорам Гарвардской школы права называет умение определить её базовым навыком. От BATNA зависят три вещи: стоит ли принимать предложение, насколько сильна ваша позиция и когда разумно встать из-за стола. Частая ошибка — смотреть только на предложение перед собой и забывать о своих альтернативах.", "source": "Программа по переговорам Гарвардской школы права", "url": "https://www.pon.harvard.edu/daily/batna/translate-your-batna-to-the-current-deal/", "tags": ["переговоры", "решения"]}, {"id": "00i1106", "title": "Обратная связь по трём шагам", "text": "Модель SBI Центра креативного лидерства делит обратную связь на три части. Ситуация: назовите конкретный момент, а не «на прошлой неделе». Поведение: опишите, что человек сделал, без мнений и оценок, например «ты перебил меня, когда я рассказывал команде о бюджете», а не «ты был груб». Влияние: скажите, к чему это привело и что вы почувствовали. Раз вы описываете случившееся, а не выносите приговор, вас с большей вероятностью услышат.", "source": "Модель SBI, Центр креативного лидерства (CCL)", "url": "https://www.ccl.org/articles/leading-effectively-articles/closing-the-gap-between-intent-vs-impact-sbii/", "tags": ["общение", "работа"]}]}, {"id": "00s12", "title": "Мысленные эксперименты", "note": "Короткие истории, которыми философы проверяют наши убеждения.", "color": 5, "ideas": [{"id": "00i1201", "title": "Корабль Тесея", "text": "Афиняне хранили корабль Тесея и по мере износа заменяли старые доски новыми. По Плутарху, философы спорили о нём: одни говорили, что корабль остался тем же, другие — что стал другим. Томас Гоббс усложнил задачу: пусть кто-то соберёт снятые доски в прежнем порядке. Кораблей стало два, и где настоящий? У одних довод: вещь переживает постепенную замену частей. У других: вещь можно разобрать и собрать снова. Оба убедительны, но вместе дают странный вывод, будто корабль уцелел дважды.", "source": "Плутарх, «Тесей»; Томас Гоббс; Стэнфордская философская энциклопедия", "url": "https://plato.stanford.edu/entries/material-constitution/", "tags": ["философия", "идентичность"]}, {"id": "00i1202", "title": "Пещера Платона", "text": "Узники с детства сидят в пещере в оковах и видят только тени, которые огонь отбрасывает на стену перед ними. Тени они принимают за сами вещи. Если одного освободить и вывести наверх, он постепенно привыкнет к свету и увидит солнце. Но, вернувшись, он будет плохо различать тени, и остальные поднимут его на смех, а того, кто попробует их освободить, готовы будут убить. «Они подобны нам», говорит Сократ: пещера — это видимый мир, а подъём — восхождение души к умопостигаемому.", "source": "Платон, «Государство», книга VII", "url": "https://classics.mit.edu/Plato/republic.8.vii.html", "tags": ["философия", "познание"]}, {"id": "00i1203", "title": "Проблема вагонетки", "text": "Филиппа Фут сравнила два случая. Судья может осудить и казнить невиновного, чтобы предотвратить бунт, в котором погибнут пятеро. Водитель вагонетки может свернуть на путь, где стоит один человек, чтобы не задавить пятерых. Первое, по Фут, недопустимо, второе допустимо, хотя счёт одинаков. Джудит Томсон заменила водителя прохожим у стрелки, и прежнее объяснение перестало работать. Опрос 70 тысяч человек в 42 странах показал: порядок, в котором люди считают такие жертвы допустимыми, везде один, хотя сама готовность жертвовать сильно различается.", "source": "Филиппа Фут; Джудит Томсон; Стэнфордская философская энциклопедия; Авад и соавторы, PNAS, 2020", "url": "https://plato.stanford.edu/entries/doing-allowing/", "tags": ["философия", "этика"]}, {"id": "00i1204", "title": "Завеса неведения", "text": "Джон Ролз предложил мысленный опыт: свободные и равные люди договариваются о принципах справедливого общества, но перед ними «завеса неведения». Никто не знает ни своих личных качеств, ни своих представлений о благе, ни своего положения в обществе; известны только общие факты о психологии, экономике и природе. Так обеспечивается беспристрастность: нельзя подогнать правила под себя. Ролз считал, что в таком положении разумно выбрать его два принципа справедливости.", "source": "Джон Ролз, «Теория справедливости», 1971; Стэнфордская философская энциклопедия", "url": "https://plato.stanford.edu/entries/original-position/", "tags": ["философия", "справедливость"]}, {"id": "00i1205", "title": "Китайская комната", "text": "Джон Сёрл в 1980 году предложил представить, что он сидит один в комнате и по программе, как компьютер, подбирает ответы на китайские иероглифы, которые ему просовывают под дверь. Китайского он не знает, но ответы выходят верными, и снаружи кажется, что в комнате сидит носитель языка. Вывод Сёрла: программа может создать видимость понимания, но не само понимание. Компьютер переставляет символы по правилам и не знает, что они значат.", "source": "Джон Сёрл, 1980; Стэнфордская философская энциклопедия", "url": "https://plato.stanford.edu/entries/chinese-room/", "tags": ["философия", "сознание"]}, {"id": "00i1206", "title": "Машина опыта", "text": "Роберт Нозик в 1974 году предложил представить машину, которая даст вам любые переживания по вашему выбору. Подключились бы вы к ней на всю жизнь? В опросах большинство отказывается: в одном исследовании 84%, в другом 71%. Отсюда вывод, что людям важны не только приятные ощущения. Но если вопрос перевернуть (вы уже в машине, хотите ли вернуться в реальность?), реальность выбирают лишь 13%. Похоже, многое решает привычка держаться за то, что есть.", "source": "Роберт Нозик, «Анархия, государство и утопия», 1974; Интернет-энциклопедия философии", "url": "https://iep.utm.edu/experience-machine/", "tags": ["философия", "счастье"]}]}, {"id": "00s13", "title": "Космос и масштаб", "note": "Факты о Вселенной, после которых привычные расстояния кажутся другими.", "color": 3, "ideas": [{"id": "00i1301", "title": "Смотреть в небо — значит смотреть в прошлое", "text": "Свету нужно время на дорогу, поэтому всё далёкое мы видим таким, каким оно было раньше. Солнечный свет идёт до нас около 8,3 минуты: мы всегда видим Солнце с опозданием. Следующая ближайшая звезда — в 4,3 светового года, и её свет вышел в путь больше четырёх лет назад. Галактику Андромеды мы видим такой, какой она была 2,5 миллиона лет назад. Чем дальше объект, тем глубже в прошлое мы заглядываем.", "source": "NASA Space Place: что такое световой год", "url": "https://spaceplace.nasa.gov/light-year/en/", "tags": ["космос", "свет"]}, {"id": "00i1302", "title": "Космический календарь", "text": "Сожмём всю историю Вселенной в один год: Большой взрыв случился в первое мгновение 1 января, а сейчас последняя секунда 31 декабря. Тогда Солнечная система образовалась около 10 сентября. Те, кого можно назвать людьми, появились только вечером 31 декабря. Алфавит изобрели на пятидесятой секунде последней минуты года, а современная астрономия началась за долю секунды до полуночи. Этот образ придумал Карл Саган в книге «Драконы Эдема».", "source": "Карл Саган, «Драконы Эдема», 1977; учебник OpenStax Astronomy 2e", "url": "https://openstax.org/books/astronomy-2e/pages/1-9-a-conclusion-and-a-beginning", "tags": ["космос", "время"]}, {"id": "00i1303", "title": "Мы сделаны из звёзд", "text": "Когда Вселенная после Большого взрыва остыла настолько, что смогли существовать атомы, всё вещество состояло из водорода и гелия с крошечной примесью лития. Остальные элементы возникли позже, в недрах звёзд. Там созданы железо, кремний, магний и кислород, из которых сложена Земля, и углерод, кислород и азот, без которых невозможна жизнь, какой мы её знаем.", "source": "Учебник OpenStax Astronomy 2e, раздел 30.1", "url": "https://openstax.org/books/astronomy-2e/pages/30-1-the-cosmic-context-for-life", "tags": ["космос", "химия"]}, {"id": "00i1304", "title": "Бледно-голубая точка", "text": "14 февраля 1990 года аппарат «Вояджер-1» с расстояния шесть миллиардов километров от Солнца сфотографировал Землю. На снимке она — светлая точка размером около пикселя в рассеянном солнечном луче. Этот кадр дал название книге Карла Сагана. В ней он написал: «Взгляните ещё раз на эту точку. Это здесь. Это наш дом. Это мы».", "source": "NASA: снимок «Вояджера-1», 1990; Карл Саган", "url": "https://science.nasa.gov/mission/voyager/voyager-1s-pale-blue-dot/", "tags": ["космос", "перспектива"]}, {"id": "00i1305", "title": "Почти вся масса — в Солнце", "text": "На Солнце приходится 99,8% массы всей Солнечной системы. Чтобы уравновесить его на весах, понадобилось бы больше 330 тысяч таких планет, как Земля, а чтобы заполнить его объём — 1,3 миллиона. Почти всё, что осталось после рождения Солнца, досталось Юпитеру: в нём более чем вдвое больше вещества, чем во всех остальных телах системы вместе взятых.", "source": "NASA: факты о Солнце и Юпитере", "url": "https://science.nasa.gov/sun/facts/", "tags": ["космос", "масштаб"]}, {"id": "00i1306", "title": "Парадокс Ферми", "text": "В 1950 году физик Энрико Ферми за обедом обсуждал с коллегами, что в Галактике может быть много развитых цивилизаций, и задал вопрос, который помнят до сих пор: «Где же все?» Расчёт такой: цивилизация, способная расселяться, заняла бы всю Галактику за десятки миллионов лет, а это мгновение по сравнению с её возрастом. Но следов мы не видим. Объяснений предложено много: например, межзвёздные перелёты могут быть непомерно дороги.", "source": "Энрико Ферми, 1950; Институт SETI", "url": "https://www.seti.org/fermi-paradox-0", "tags": ["космос", "жизнь"]}]}, {"id": "00s14", "title": "Экономика на пальцах", "note": "Несколько идей, которыми экономисты объясняют повседневные решения.", "color": 0, "ideas": [{"id": "00i1401", "title": "Альтернативная стоимость", "text": "Экономисты называют альтернативной стоимостью то, от чего приходится отказаться, чтобы получить желаемое. Настоящая цена вещи — это упущенная возможность сделать или купить что-то другое, то есть ценность лучшей из отвергнутых альтернатив. Пример из учебника: чтобы купить ещё один бургер, Альфонсо должен отказаться от четырёх билетов на автобус. Значит, бургер стоит ему четырёх поездок, и брать его имеет смысл, только если он ценнее их.", "source": "Учебник OpenStax Principles of Economics 3e, раздел 2.1", "url": "https://openstax.org/books/principles-economics-3e/pages/2-1-how-individuals-make-choices-based-on-their-budget-constraint", "tags": ["экономика", "решения"]}, {"id": "00i1402", "title": "Закон Гудхарта", "text": "Когда показатель становится целью, он перестаёт быть хорошим показателем. Так формулируют закон Гудхарта. Наглядный пример дала сама наука. Исследователи изучили больше 120 миллионов научных статей и увидели, как привычные мерила успеха теряют смысл. Число публикаций перестало быть хорошим показателем: статьи стали короче, списки авторов длиннее, а самих статей всё больше. Показатели цитирования искажают самоцитирование и разросшиеся списки литературы.", "source": "Файр и Гестрин, журнал GigaScience, 2019", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC6541803", "tags": ["экономика", "стимулы"]}, {"id": "00i1403", "title": "Трагедия общин", "text": "Эколог Гаррет Хардин описал это на примере общего пастбища. Каждому скотоводу выгодно добавить ещё животное: прибыль достанется ему одному, а издержки разделят все. Каждый рассуждает логично, и в итоге пастбище истощено для всех. Но это не приговор. Элинор Остром, изучив множество реальных случаев, показала, что общим имуществом часто управляют на удивление хорошо: пользователи сами вырабатывают правила и следят за их соблюдением. Её исследования общих ресурсов отмечены Нобелевской премией 2009 года.", "source": "Гаррет Хардин; Элинор Остром, Нобелевская премия по экономике 2009 года", "url": "https://www.britannica.com/science/tragedy-of-the-commons", "tags": ["экономика", "общество"]}, {"id": "00i1404", "title": "Сравнительное преимущество", "text": "В 1817 году Давид Рикардо доказывал, что специализация и свободная торговля выгодны всем участникам, даже тем, кто работает сравнительно неэффективно. Важно не то, кто производит больше, а чем приходится жертвовать ради производства. У страны сравнительное преимущество в том товаре, который обходится ей дешевле в пересчёте на другие товары. Вопрос для каждого участника торговли: от чего мы отказываемся, чтобы это произвести?", "source": "Давид Рикардо, 1817; учебник OpenStax Principles of Economics 3e, раздел 33.1", "url": "https://openstax.org/books/principles-economics-3e/pages/33-1-absolute-and-comparative-advantage", "tags": ["экономика", "торговля"]}, {"id": "00i1405", "title": "Рынок «лимонов»", "text": "Джордж Акерлоф в 1970 году разобрал рынок, где продавец знает о качестве товара больше покупателя. Его пример — подержанные автомобили; «лимоном» называют неисправную старую машину. Акерлоф показал, что такая нехватка сведений может сжать рынок до одних плохих товаров или вовсе его разрушить. Поэтому покупатели и продавцы ищут способы подтвердить качество: репутация, гарантии, сервисные контракты, возврат денег.", "source": "Джордж Акерлоф, 1970; Нобелевская премия по экономике 2001 года", "url": "https://www.nobelprize.org/prizes/economic-sciences/2001/popular-information/", "tags": ["экономика", "информация"]}, {"id": "00i1406", "title": "Убывающая предельная полезность", "text": "Предельная полезность — это добавочное удовольствие от ещё одной единицы того же самого. Как правило, она убывает: каждая следующая единица радует меньше предыдущей. Пример из учебника: первая футболка у Хосе любимая и приносит ему больше всего радости, а четвёртую он надевает, только когда остальные в стирке. То же с походами в кино: первым он выбирает фильм, который хотел увидеть больше всего.", "source": "Учебник OpenStax Principles of Economics 3e, раздел 6.1", "url": "https://openstax.org/books/principles-economics-3e/pages/6-1-consumption-choices", "tags": ["экономика", "решения"]}]}, {"id": "00s15", "title": "Как делались открытия", "note": "Истории о том, как наблюдательность и упрямство меняли науку.", "color": 6, "ideas": [{"id": "00i1501", "title": "Земмельвейс и чистые руки", "text": "В 1847 году венгерский акушер Игнац Земмельвейс заметил: в палатах, где роды принимали врачи и студенты-медики, от родильной горячки умирали 10–20% рожениц, а там, где работали акушерки, около 1%. Студенты приходили к пациенткам сразу после вскрытий, не вымыв рук. Земмельвейс предложил мыть руки раствором хлорной извести, и смертность упала до того же одного процента. Несмотря на успех, многие тогда отмахнулись от его работы, и врачи приняли мытьё рук не сразу.", "source": "Учебник OpenStax Microbiology, раздел 3.2", "url": "https://openstax.org/books/microbiology/pages/3-2-foundations-of-modern-cell-theory", "tags": ["наука", "медицина"]}, {"id": "00i1502", "title": "Джон Сноу и водяная колонка", "text": "В 1854 году в Лондоне вспыхнула холера. Врач Джон Сноу подозревал, что болезнь передаётся с водой, и проверил это двумя способами. Он выяснил, откуда брали воду заболевшие, и нанёс случаи на карту. Больше всего их оказалось среди тех, кто пользовался одной колонкой на Брод-стрит. По совету Сноу власти сняли с неё рукоять, и вспышка была остановлена. Сноу называют отцом эпидемиологии, а его способ отслеживать случаи применяют до сих пор.", "source": "Учебник OpenStax Microbiology, раздел 16.2", "url": "https://openstax.org/books/microbiology/pages/16-2-tracking-infectious-diseases", "tags": ["наука", "медицина"]}, {"id": "00i1503", "title": "Пенициллин: случайность и подготовленный ум", "text": "В 1928 году Александр Флеминг вернулся из отпуска и стал разбирать старые чашки с культурами стафилококков. В одну из них попала плесень, и рядом с ней бактерии не росли. Так был открыт пенициллин, первый природный антибиотик. Но выделить вещество и наладить его производство удалось только группе Говарда Флори и Эрнста Чейна в Оксфорде: в 1940 году они получили чистый пенициллин и показали, что он лечит инфекции у мышей. В 1945 году все трое получили Нобелевскую премию.", "source": "Учебник OpenStax Microbiology, раздел 14.1", "url": "https://openstax.org/books/microbiology/pages/14-1-history-of-chemotherapy-and-antimicrobial-discovery", "tags": ["наука", "случайность"]}, {"id": "00i1504", "title": "Эратосфен измерил Землю тенью", "text": "Около 200 года до нашей эры Эратосфен узнал, что в Сиене в первый день лета солнце в полдень освещает дно колодца, то есть стоит прямо над головой. В Александрии в тот же момент колонна отбрасывала тень: лучи отклонялись от вертикали примерно на 7 градусов, одну пятидесятую круга. Значит, расстояние между городами, 5000 стадиев, — это пятидесятая часть окружности Земли, и вся она равна 250 тысячам стадиев. Точность оценить трудно: неизвестно, каким стадием он мерил. По одной версии, ошибка около 20%, по другой — меньше 1%.", "source": "Учебник OpenStax Astronomy 2e, раздел 2.2", "url": "https://openstax.org/books/astronomy-2e/pages/2-2-ancient-astronomy", "tags": ["наука", "геометрия"]}, {"id": "00i1505", "title": "Язва оказалась инфекцией", "text": "В 1982 году, когда Барри Маршалл и Робин Уоррен открыли бактерию Helicobacter pylori, главными причинами язвы считались стресс и образ жизни. Они доказывали, что виновата бактерия. В опыте, описанном группой Маршалла в 1985 году, доброволец со здоровым желудком проглотил культуру бактерии, и на десятый день у него нашли гастрит. Сегодня установлено, что бактерия вызывает больше 90% язв двенадцатиперстной кишки и до 80% язв желудка, а лечат их коротким курсом антибиотиков. В 2005 году учёные получили Нобелевскую премию.", "source": "Нобелевская премия по физиологии и медицине 2005 года; Маршалл и соавторы, Medical Journal of Australia, 1985", "url": "https://www.nobelprize.org/prizes/medicine/2005/press-release/", "tags": ["наука", "медицина"]}, {"id": "00i1506", "title": "Вегенер и дрейф континентов", "text": "В 1912 году 32-летний немецкий метеоролог Альфред Вегенер предположил, что материки когда-то были единым целым, Пангеей, и разошлись. Его убеждали совпадение очертаний Южной Америки и Африки и одинаковые ископаемые по обе стороны океана. Но он не мог ответить, какая сила двигает континенты, и идею отвергли. Вегенер погиб в 1930 году в экспедиции в Гренландии. Позже новые данные о дне океана вернули интерес к его идее, и из неё выросла теория тектоники плит.", "source": "Геологическая служба США (USGS)", "url": "https://pubs.usgs.gov/gip/dynamic/historical.html", "tags": ["наука", "геология"]}]}, {"id": "00s16", "title": "Как работает ИИ", "note": "Что происходит внутри языковых моделей вроде Claude и ChatGPT.", "color": 3, "ideas": [{"id": "00i1601", "title": "Модель угадывает продолжение", "text": "Большая языковая модель — это модель с огромным числом параметров, обученная на гигантском объёме текстов. Учат её одному: предсказывать следующее слово по предыдущему тексту. Сама по себе такая модель плохо отвечает на вопросы и выполняет указания, поэтому её дополнительно дообучают. В итоге получается система, способная на удивительно полезные вещи: писать тексты, отвечать на вопросы, кратко пересказывать.", "source": "Глоссарий документации Claude (Anthropic)", "url": "https://docs.claude.com/en/docs/about-claude/glossary", "tags": ["ии", "технологии"]}, {"id": "00i1602", "title": "Токены, а не слова", "text": "Модель работает не со словами, а с токенами. Это мельчайшие единицы текста для модели: токеном может быть слово, часть слова, отдельный символ и даже байт. Сколько знаков приходится на токен, зависит от модели и языка; у прежних моделей Claude это около трёх с половиной знаков английского текста. Отдельное понятие — контекстное окно: объём текста, на который модель может оглядываться, когда пишет ответ. Это её «рабочая память», а не то, на чём она училась.", "source": "Глоссарий документации Claude (Anthropic)", "url": "https://docs.claude.com/en/docs/about-claude/glossary", "tags": ["ии", "технологии"]}, {"id": "00i1603", "title": "Обучение — это подбор чисел", "text": "Внутри нейросети множество чисел, которые называют весами; у больших языковых моделей их особенно много. Обучение начинается со случайных значений, а дальше повторяется один и тот же цикл: посчитать, насколько модель ошибается; определить, в какую сторону сдвинуть веса, чтобы ошибка уменьшилась; чуть-чуть сдвинуть их в эту сторону. И так до тех пор, пока ошибку удаётся уменьшать. Метод называется градиентным спуском; для многослойных нейросетей его делает возможным алгоритм обратного распространения ошибки.", "source": "Google Machine Learning Crash Course", "url": "https://developers.google.com/machine-learning/crash-course/linear-regression/gradient-descent?hl=en", "tags": ["ии", "обучение"]}, {"id": "00i1604", "title": "Почему ИИ уверенно ошибается", "text": "Даже самые сильные языковые модели иногда выдают текст, который не соответствует фактам или противоречит тому, что им дали. Это называют галлюцинациями. В документации Claude описаны способы их уменьшить: прямо разрешить модели отвечать «не знаю», просить опираться на точные цитаты из документа и подтверждать утверждения ссылками. Для читателя вывод простой: важные факты, цифры и цитаты стоит перепроверять.", "source": "Документация Claude (Anthropic): как уменьшить галлюцинации", "url": "https://docs.claude.com/en/docs/test-and-evaluate/strengthen-guardrails/reduce-hallucinations", "tags": ["ии", "критичность"]}, {"id": "00i1605", "title": "Внимание — механизм, а не метафора", "text": "Самая успешная и распространённая архитектура больших языковых моделей — трансформер. Её предложили в 2017 году исследователи Google в статье «Attention Is All You Need»: модель целиком построена на механизме внимания. Для каждого токена этот механизм как бы задаёт вопрос: насколько каждый другой токен текста влияет на его толкование? Пример авторов — слово «оно» в двух похожих фразах: в одной оно относится к животному, в другой к улице, и трансформер различает эти случаи.", "source": "Васвани и соавторы, «Attention Is All You Need», 2017; блог Google Research", "url": "https://research.google/blog/transformer-a-novel-neural-network-architecture-for-language-understanding/", "tags": ["ии", "технологии"]}, {"id": "00i1606", "title": "Хороший запрос — это хорошее объяснение", "text": "В документации Claude советуют думать о модели как о блестящем, но новом сотруднике, который ничего не знает о ваших порядках и задачах. Чем точнее вы объясните, что вам нужно, тем лучше результат. Помогает простая проверка: покажите запрос коллеге, который мало знает о задаче. Если он запутается, запутается и модель. Полезно также объяснять, зачем вам это нужно: контекст помогает модели попасть в цель.", "source": "Документация Claude (Anthropic): как писать запросы", "url": "https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/be-clear-and-direct", "tags": ["ии", "приёмы"]}]}];
