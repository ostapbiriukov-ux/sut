<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Суть</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#f1f2f6"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Суть"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Суть</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&display=swap">
<style>
/* Суть. Картотека с маркерами: бумажные карточки на прохладном столе, чернильный текст,
   цвет несут только маркеры коллекций. Телефон: колонка с нижней панелью; широкий экран: рейка слева. */
:root {
  --bg: #f1f2f6;
  --surface: #ffffff;
  --surface-2: #e7e9f0;
  --ink: #171b30;
  --ink-2: #4c526c;
  --ink-3: #7b829c;
  --line: #d8dbe6;
  --accent: #2a3fe6;
  --danger: #c22a3a;
  --shadow: 23 27 48;
  --mk-0: #ffe45e;
  --mk-1: #b9ee84;
  --mk-2: #ffb3d6;
  --mk-3: #a9d6ff;
  --mk-4: #ffc98f;
  --mk-5: #d6c6ff;
  --mk-6: #a0eadc;
  --mk-7: #ffb5a8;
  --wash-k: 60%;
  --font-ui: "Golos Text", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-read: "Literata", Georgia, "Times New Roman", serif;
  --r-card: 10px;
  --r-ctl: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1118;
    --surface: #191c28;
    --surface-2: #242838;
    --ink: #eceef7;
    --ink-2: #a9afc6;
    --ink-3: #757c97;
    --line: #2e3348;
    --accent: #8c9bff;
    --danger: #ff7785;
    --shadow: 0 0 0;
    --mk-0: #6a5a00;
    --mk-1: #2f5c17;
    --mk-2: #6f2a4c;
    --mk-3: #1d4b7c;
    --mk-4: #6e4212;
    --mk-5: #48388a;
    --mk-6: #165c52;
    --mk-7: #73302a;
    --wash-k: 42%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1118;
  --surface: #191c28;
  --surface-2: #242838;
  --ink: #eceef7;
  --ink-2: #a9afc6;
  --ink-3: #757c97;
  --line: #2e3348;
  --accent: #8c9bff;
  --danger: #ff7785;
  --shadow: 0 0 0;
  --mk-0: #6a5a00;
  --mk-1: #2f5c17;
  --mk-2: #6f2a4c;
  --mk-3: #1d4b7c;
  --mk-4: #6e4212;
  --mk-5: #48388a;
  --mk-6: #165c52;
  --mk-7: #73302a;
  --wash-k: 42%;
  color-scheme: dark;
}

/* ── основа ── */
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; background: var(--bg); }
body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.5 var(--font-ui);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, p { margin: 0; }
[hidden] { display: none !important; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.mk-0 { --mk: var(--mk-0); }
.mk-1 { --mk: var(--mk-1); }
.mk-2 { --mk: var(--mk-2); }
.mk-3 { --mk: var(--mk-3); }
.mk-4 { --mk: var(--mk-4); }
.mk-5 { --mk: var(--mk-5); }
.mk-6 { --mk: var(--mk-6); }
.mk-7 { --mk: var(--mk-7); }

/* след маркера под текстом */
.hl {
  background-image: linear-gradient(transparent 0 56%, var(--mk, var(--mk-0)) 56% 92%, transparent 92%);
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  padding: 0 0.14em;
  margin: 0 -0.14em;
}

/* ── каркас ── */
.app { height: 100%; display: flex; flex-direction: column; }
.stage { flex: 1; min-width: 0; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.view {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.vstack { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.vstack.tight { gap: 8px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.grow { flex: 1; }
.muted { color: var(--ink-2); font-size: 14px; }

.tabbar {
  display: flex;
  border-top: 1px solid var(--line);
  background: var(--bg);
  padding-left: max(6px, env(safe-area-inset-left, 0px));
  padding-right: max(6px, env(safe-area-inset-right, 0px));
}
.tab {
  flex: 1;
  min-width: 0;
  min-height: 58px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 6px 2px;
  border: 0;
  background: none;
  color: var(--ink-2);
  font: 500 11.5px/1 var(--font-ui);
}
.tab[aria-current="page"] { color: var(--ink); font-weight: 700; }
.tab[aria-current="page"] .nav-label,
.rail-item[aria-current="page"] .nav-label {
  background-image: linear-gradient(transparent 0 46%, var(--mk-0) 46% 100%);
  padding: 0 3px;
  margin: 0 -3px;
}
.tab-plus { width: 46px; height: 34px; display: grid; place-items: center; border-radius: 11px; background: var(--ink); color: var(--bg); }

.rail { display: none; }
.brand { padding: 0 10px 22px; font: 700 27px/1 var(--font-read); letter-spacing: -0.01em; }
.rail-item {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 44px;
  padding: 0 12px;
  border: 0;
  border-radius: var(--r-ctl);
  background: none;
  color: var(--ink-2);
  font: 500 15px/1 var(--font-ui);
  text-align: left;
}
.rail-item:hover { background: var(--surface-2); color: var(--ink); }
.rail-item[aria-current="page"] { color: var(--ink); font-weight: 700; }
.rail-add { margin-top: 14px; }
.rail-foot { margin-top: auto; padding: 0 10px; font-size: 12.5px; line-height: 1.45; color: var(--ink-3); }

@media (min-width: 900px) {
  .app { flex-direction: row; }
  .tabbar { display: none; }
  .rail {
    flex: 0 0 236px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 28px 14px 22px max(14px, env(safe-area-inset-left, 0px));
    border-right: 1px solid var(--line);
  }
  .view {
    padding-block: 40px 64px;
    padding-left: max(32px, env(safe-area-inset-left, 0px));
    padding-right: max(32px, env(safe-area-inset-right, 0px));
  }
}

/* ── текст и заголовки ── */
.vh { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.vh h1, .stash-head h1 { font: 700 clamp(28px, 6.4vw, 36px)/1.14 var(--font-read); letter-spacing: -0.012em; text-wrap: balance; overflow-wrap: anywhere; }
.eyebrow { margin-bottom: 4px; font: 500 13.5px/1.3 var(--font-ui); color: var(--ink-2); }
.label { font: 600 11.5px/1.2 var(--font-ui); letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-2); }
.hint { font-size: 13.5px; line-height: 1.45; color: var(--ink-2); }
.lead { max-width: 62ch; font: 400 16px/1.55 var(--font-read); color: var(--ink-2); }
.pill {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 34px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 17px;
  background: var(--surface);
  font: 600 14px/1 var(--font-ui);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* ── кнопки и поля ── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 18px;
  border: 1px solid transparent;
  border-radius: var(--r-ctl);
  background: var(--surface-2);
  color: var(--ink);
  font: 600 15px/1.1 var(--font-ui);
  white-space: nowrap;
}
.btn:disabled { opacity: 0.45; cursor: default; }
.btn-primary { background: var(--ink); color: var(--bg); }
.btn-line { background: transparent; border-color: var(--line); }
.btn-ghost { background: transparent; }
.btn-danger { color: var(--danger); }
.btn-solid-danger { background: var(--danger); color: var(--bg); }
.btn-sm { min-height: 36px; padding: 0 12px; font-size: 14px; }
.iconbtn {
  flex: none;
  width: 44px;
  height: 44px;
  display: inline-grid;
  place-items: center;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--ink);
}
.iconbtn:hover { background: color-mix(in srgb, var(--ink) 9%, transparent); }
.iconbtn.line { border: 1px solid var(--line); }
.linkbtn { align-self: flex-start; padding: 6px 0; border: 0; background: none; color: var(--accent); font: 600 14px/1.2 var(--font-ui); text-align: left; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.input, .textarea, .select {
  width: 100%;
  min-height: 46px;
  padding: 11px 13px;
  border: 1px solid var(--line);
  border-radius: var(--r-ctl);
  background: var(--surface);
  color: var(--ink);
  font: 400 16px/1.4 var(--font-ui);
}
.textarea { min-height: 124px; resize: vertical; font-family: var(--font-read); line-height: 1.5; }
.textarea.short { min-height: 84px; }
.input::placeholder, .textarea::placeholder { color: var(--ink-3); }
.select.sm { width: auto; min-height: 36px; padding: 6px 10px; font-size: 14px; }
.counter { font: 500 12.5px/1 var(--font-ui); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.counter.warn { color: var(--danger); }
.form-error { color: var(--danger); font-size: 14px; font-weight: 500; }

.seg { align-self: flex-start; display: inline-flex; max-width: 100%; gap: 2px; padding: 3px; border-radius: 12px; background: var(--surface-2); }
.seg button {
  min-height: 36px;
  padding: 0 14px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--ink-2);
  font: 600 14px/1 var(--font-ui);
  white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(var(--shadow) / 0.16); }
.seg.full { align-self: stretch; display: flex; }
.seg.full button { flex: 1; min-width: 0; padding: 0 6px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 34px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 17px;
  background: transparent;
  color: var(--ink-2);
  font: 500 13.5px/1 var(--font-ui);
  white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

.searchbox { position: relative; }
.searchbox svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.searchbox .input { padding-left: 40px; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }

/* ── блоки экранов ── */
.notice {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 12px;
  margin-bottom: 18px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  background: var(--surface);
  font-size: 14px;
  line-height: 1.45;
}
.notice.inline { margin-bottom: 0; }
.notice svg { flex: none; color: var(--accent); }
.notice p { flex: 1 1 220px; min-width: 0; }

.deck {
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin-bottom: 10px;
  padding: 20px 20px 18px;
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  background: var(--surface);
  /* две карточки, выглядывающие из-под верхней */
  box-shadow: 0 5px 0 -1px var(--surface), 0 5px 0 0 var(--line), 0 10px 0 -2px var(--surface), 0 10px 0 -1px var(--line);
}
.deck-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.deck-count { font: 600 13px/1 var(--font-ui); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.deck-title { font: 700 clamp(22px, 5.4vw, 28px)/1.26 var(--font-read); letter-spacing: -0.01em; text-wrap: balance; overflow-wrap: anywhere; }
.deck-meta { color: var(--ink-2); font-size: 14.5px; }
.dots { display: flex; gap: 5px; }
.dots i { flex: 1; max-width: 44px; height: 5px; border-radius: 3px; background: var(--surface-2); }
.dots i.on { background: var(--ink); }

.block { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.block-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
.block-head h2 { font: 700 19px/1.2 var(--font-read); }

.week {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 4px;
  padding: 14px 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  background: var(--surface);
}
.wd { display: flex; flex-direction: column; align-items: center; gap: 7px; font: 500 12px/1 var(--font-ui); color: var(--ink-3); }
.wd-dot {
  width: 34px;
  max-width: 100%;
  height: 34px;
  display: grid;
  place-items: center;
  border: 1.5px solid var(--line);
  border-radius: 50%;
  color: var(--ink);
  font: 600 13px/1 var(--font-ui);
  font-variant-numeric: tabular-nums;
}
.wd.on .wd-dot { border-color: var(--mk-0); background: var(--mk-0); }
.wd.today { color: var(--ink); font-weight: 700; }
.wd.today .wd-dot { border-color: var(--ink); }

.list { display: flex; flex-direction: column; gap: 10px; }
.icard {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
  padding: 16px 16px 13px;
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  background: var(--surface);
  cursor: pointer;
}
.icard:hover { border-color: var(--ink-3); }
.icard-title { font: 600 18px/1.34 var(--font-read); overflow-wrap: anywhere; }
.icard-text {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  line-clamp: 3;
  overflow: hidden;
  font: 400 15px/1.52 var(--font-read);
  color: var(--ink-2);
  overflow-wrap: anywhere;
}
.icard-text.solo { -webkit-line-clamp: 4; line-clamp: 4; font-size: 16.5px; color: var(--ink); }
.icard-meta { display: flex; align-items: center; gap: 10px; min-width: 0; padding-top: 2px; font: 500 12.5px/1.3 var(--font-ui); color: var(--ink-3); }
.tag-st { display: inline-flex; align-items: center; gap: 6px; min-width: 0; color: var(--ink-2); }
.tag-st i, .rcard-kicker i { flex: none; width: 10px; height: 10px; border-radius: 3px; background: var(--mk, var(--mk-0)); }
.ellip { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { flex: none; padding: 3px 7px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); font: 600 11px/1 var(--font-ui); letter-spacing: 0.03em; }
.fav-on { flex: none; display: inline-grid; color: var(--danger); }
.fav-on svg { fill: currentColor; }
.icard.is-skip { opacity: 0.6; }

/* строка готовой подборки в каталоге */
.pack { display: flex; align-items: center; gap: 12px; min-width: 0; padding: 14px 14px 14px 16px; border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); }
.pack-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.pack-title { display: flex; align-items: center; gap: 8px; min-width: 0; font: 600 16.5px/1.3 var(--font-read); overflow-wrap: anywhere; }
.pack-title i { flex: none; width: 10px; height: 10px; border-radius: 3px; background: var(--mk); }
.pack-meta { font: 500 12.5px/1.3 var(--font-ui); color: var(--ink-3); }

/* сводка интересов */
.taste { display: flex; flex-direction: column; }
.taste-row { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 14px; min-width: 0; padding: 9px 0; border-top: 1px solid var(--line); }
.taste-row:first-child { padding-top: 0; border-top: 0; }
.taste-row .tag-st { font: 600 14.5px/1.3 var(--font-ui); color: var(--ink); }
.taste-nums { font: 500 13px/1.3 var(--font-ui); color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* коллекция: карточка-разделитель с язычком, как в картотечном ящике */
.stashes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 32px 12px; padding-top: 21px; }
.stash {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
  min-height: 104px;
  padding: 14px 14px 12px;
  border: 1px solid var(--line);
  border-radius: 0 var(--r-card) var(--r-card) var(--r-card);
  background: var(--surface);
  box-shadow: 0 4px 0 -1px var(--surface), 0 4px 0 0 var(--line);
  color: var(--ink);
  text-align: left;
}
.stash:hover { border-color: var(--ink-3); }
.stash-tab {
  position: absolute;
  left: -1px;
  bottom: 100%;
  min-width: 44px;
  height: 21px;
  display: inline-flex;
  align-items: center;
  padding: 0 10px;
  border-radius: 7px 7px 0 0;
  background: var(--mk);
  color: var(--ink);
  font: 700 12px/1 var(--font-ui);
  font-variant-numeric: tabular-nums;
}
.stash-title { font: 600 17px/1.28 var(--font-read); overflow-wrap: anywhere; }
.stash-meta { margin-top: auto; font: 500 12.5px/1.3 var(--font-ui); color: var(--ink-3); }
.stash.new {
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-style: dashed;
  border-radius: var(--r-card);
  background: transparent;
  box-shadow: none;
  color: var(--ink-2);
  font: 600 14px/1.2 var(--font-ui);
  text-align: center;
}

.backlink {
  align-self: flex-start;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 36px;
  margin: -6px 0 -10px -6px;
  padding: 0 8px 0 4px;
  border: 0;
  border-radius: 8px;
  background: none;
  color: var(--ink-2);
  font: 600 14px/1 var(--font-ui);
}
.stash-head { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
.tabchip { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 7px; background: var(--mk); color: var(--ink); font: 700 12px/1 var(--font-ui); }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 620px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: 14px 14px 12px; border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); }
.tile b { font: 700 30px/1 var(--font-read); font-variant-numeric: tabular-nums; }
.tile span { font: 500 12.5px/1.3 var(--font-ui); color: var(--ink-2); }
.panel { display: flex; flex-direction: column; gap: 14px; min-width: 0; padding: 16px; border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); }
.heat-wrap { overflow-x: auto; }
.heat { display: grid; grid-template-rows: repeat(7, 14px); grid-auto-flow: column; grid-auto-columns: 14px; gap: 3px; width: max-content; }
.heat i, .legend i { border-radius: 3px; background: var(--surface-2); }
.heat i.l1, .legend i.l1 { background: var(--ink-3); background: color-mix(in srgb, var(--accent) 30%, var(--surface-2)); }
.heat i.l2, .legend i.l2 { background: var(--ink-2); background: color-mix(in srgb, var(--accent) 62%, var(--surface-2)); }

<script>
window.SUT_PACKS = [{"id": "00s1", "title": "Привычки", "note": "Как маленькие ежедневные действия складываются в большие перемены.", "color": 0, "ideas": [{"id": "00i101", "title": "Один процент в день — это не мелочь", "text": "Маленькие улучшения незаметны по отдельности, но складываются как сложный процент. Если становиться лучше на 1% каждый день, за год результат вырастет почти в 38 раз. Верно и обратное: если каждый день сдавать на 1%, к концу года останется около 3% от исходного. Цифры условны, но направление показывают верно.", "source": "Джеймс Клир, «Атомные привычки»", "url": "https://jamesclear.com/continuous-improvement", "tags": ["привычки", "рост"]}, {"id": "00i102", "title": "Петля привычки: сигнал, действие, награда", "text": "Привычка устроена как цикл: сигнал запускает действие, а награда его закрепляет. Чтобы изменить привычку, не обязательно бороться с ней в лоб. Оставьте прежние сигнал и награду, но подставьте между ними другое действие.", "source": "Чарльз Дахигг, «Сила привычки»", "url": "https://en.wikipedia.org/wiki/The_Power_of_Habit", "tags": ["привычки"]}, {"id": "00i103", "title": "Привяжите новую привычку к старой", "text": "Проще всего встроить новое действие сразу после того, что вы и так делаете каждый день. Формула простая: «После того как я [привычное дело], я [новая привычка]». Например: после того как налью утренний кофе, запишу три дела на сегодня.", "source": "Би Джей Фогг; Джеймс Клир, «Атомные привычки»", "url": "https://jamesclear.com/habit-stacking", "tags": ["привычки", "приёмы"]}, {"id": "00i104", "title": "Правило двух минут для привычек", "text": "Начало новой привычки должно занимать не больше двух минут. «Читать перед сном» превращается в «прочитать одну страницу», «бегать по утрам» — в «надеть кроссовки». Смысл не в результате, а в том, чтобы научиться начинать: привычку сначала закрепляют и только потом улучшают.", "source": "Джеймс Клир, «Атомные привычки»", "url": "https://jamesclear.com/how-to-stop-procrastinating", "tags": ["привычки", "приёмы"]}, {"id": "00i105", "title": "Среда сильнее силы воли", "text": "Поведение во многом зависит от того, что лежит на виду. Сделайте сигналы хороших привычек заметными: книга на подушке, вода на столе, кроссовки у двери. Сигналы вредных, наоборот, уберите подальше. Перестроить окружение легче, чем каждый день побеждать себя.", "source": "Джеймс Клир, «Атомные привычки»", "url": "https://jamesclear.com/environment-design-organ-donation", "tags": ["привычки", "среда"]}, {"id": "00i106", "title": "Сначала решите, кем вы хотите быть", "text": "Самые устойчивые перемены начинаются не с цели, а с представления о себе. Не «хочу пробежать марафон», а «я человек, который не пропускает тренировки». Тогда каждое маленькое действие становится голосом за того, кем вы становитесь.", "source": "Джеймс Клир, «Атомные привычки»", "url": "https://jamesclear.com/identity-based-habits", "tags": ["привычки", "идентичность"]}, {"id": "00i107", "title": "Намерение с местом и временем", "text": "Расплывчатое «буду больше заниматься» почти не работает. Надёжнее заранее решить, когда и где вы это сделаете: «в понедельник в семь вечера иду в зал у дома». Исследования намерений реализации показывают, что такой план заметно повышает шансы довести дело до конца.", "source": "Петер Голльвитцер, исследования намерений реализации", "url": "https://ru.wikipedia.org/wiki/Реализационные_намерения", "tags": ["привычки", "планирование"]}]}, {"id": "00s2", "title": "Фокус и глубокая работа", "note": "Как беречь внимание и делать сложное без спешки.", "color": 3, "ideas": [{"id": "00i201", "title": "Глубокая работа — редкий и ценный навык", "text": "Глубокая работа — это сосредоточенный труд без отвлечений на пределе умственных возможностей. Именно она создаёт новое и развивает мастерство. Почта, чаты и мелкие задачи дают ощущение занятости, но такую работу легко повторить, и ценится она меньше.", "source": "Кэл Ньюпорт, «В работу с головой»", "url": "https://calnewport.com/deep-work-rules-for-focused-success-in-a-distracted-world/", "tags": ["фокус", "работа"]}, {"id": "00i202", "title": "Остаток внимания", "text": "Переключаясь с одной задачи на другую, вы не переносите внимание целиком: часть его ещё какое-то время остаётся на прежнем деле. Поэтому «быстро заглянуть в почту» посреди сложной работы обходится дороже, чем кажется.", "source": "Софи Лерой, исследование остаточного внимания", "url": "https://ideas.repec.org/a/eee/jobhdp/v109y2009i2p168-181.html", "tags": ["фокус", "внимание"]}, {"id": "00i203", "title": "Метод помидора", "text": "Работайте отрезками по 25 минут с пятиминутными перерывами, а после четырёх отрезков отдохните подольше. Таймер снимает вопрос «сколько ещё?» и превращает большую задачу в серию коротких забегов, на каждый из которых легко решиться.", "source": "Франческо Чирилло, техника Pomodoro", "url": "https://ru.wikipedia.org/wiki/Метод_помидора", "tags": ["фокус", "приёмы"]}, {"id": "00i204", "title": "Состояние потока", "text": "Поток — это полная поглощённость делом, когда время идёт незаметно. Он возникает, когда сложность задачи соответствует вашим умениям и требует их целиком, цель ясна, а результат каждого шага виден сразу. Слишком простая задача вызывает скуку, слишком трудная — тревогу.", "source": "Михай Чиксентмихайи, «Поток»", "url": "https://ru.wikipedia.org/wiki/Поток_(психология)", "tags": ["фокус", "поток"]}, {"id": "00i205", "title": "Закон Паркинсона", "text": "Работа заполняет всё время, которое на неё отпущено. Дайте задаче неделю — она займёт неделю; дайте два часа — и нередко хватит двух часов. Жёсткий, но реалистичный срок помогает отсечь лишнее.", "source": "Сирил Норткот Паркинсон, 1955", "url": "https://ru.wikipedia.org/wiki/Законы_Паркинсона", "tags": ["время", "работа"]}, {"id": "00i206", "title": "Незаконченное не отпускает", "text": "Незавершённые дела навязчиво возвращаются в мысли и мешают заниматься другим. Масикампо и Баумайстер показали: если записать конкретный план, когда и как вы вернётесь к делу, эти мысли стихают, хотя само дело ещё не сделано. Часто достаточно записать следующий шаг.", "source": "Масикампо и Баумайстер, 2011", "url": "https://pubmed.ncbi.nlm.nih.gov/21688924/", "tags": ["внимание", "приёмы"]}]}, {"id": "00s3", "title": "Как учиться и запоминать", "note": "Приёмы, которые помогают знаниям остаться в голове надолго.", "color": 1, "ideas": [{"id": "00i301", "title": "Кривая забывания", "text": "Без повторения новое забывается быстрее всего в первые часы и дни, а потом забывание замедляется. Каждое своевременное повторение делает след в памяти прочнее и отодвигает момент, когда понадобится следующее.", "source": "Герман Эббингауз, «О памяти», 1885", "url": "https://ru.wikipedia.org/wiki/Кривая_забывания", "tags": ["память", "учёба"]}, {"id": "00i302", "title": "Интервальные повторения", "text": "Повторять лучше не подряд, а с промежутками: например, через день, через несколько дней, через пару недель. Вспомнить с небольшим усилием, когда материал уже начал ускользать, полезнее, чем зубрить всё за один вечер. Главное здесь сами промежутки; должны ли они расти, исследования однозначно не показали.", "source": "Эффект распределённой практики", "url": "https://ru.wikipedia.org/wiki/Интервальные_повторения", "tags": ["память", "приёмы"]}, {"id": "00i303", "title": "Вспоминать полезнее, чем перечитывать", "text": "Перечитывание создаёт иллюзию знания: текст кажется знакомым, а достать его из памяти не получается. Закройте книгу и попробуйте пересказать главное или ответить на вопросы. Сама попытка вспомнить укрепляет память.", "source": "Рёдигер и Карпике, эффект тестирования", "url": "https://ru.wikipedia.org/wiki/Эффект_тестирования", "tags": ["память", "учёба"]}, {"id": "00i304", "title": "Метод Фейнмана", "text": "Чтобы проверить, поняли ли вы тему, объясните её простыми словами, будто рассказываете школьнику. Там, где вы запинаетесь или прячетесь за терминами, остались пробелы. Вернитесь к источнику, разберитесь и объясните ещё раз, проще.", "source": "Метод, названный в честь Ричарда Фейнмана", "url": "https://fs.blog/feynman-technique/", "tags": ["учёба", "понимание"]}, {"id": "00i305", "title": "Желательные трудности", "text": "То, что даётся легко, часто хуже запоминается. Самопроверка, перерывы между занятиями и чередование тем замедляют прогресс сегодня, зато улучшают запоминание надолго. Ощущение лёгкости на занятии — плохой показатель того, что знание останется.", "source": "Роберт Бьорк, концепция желательных трудностей", "url": "https://en.wikipedia.org/wiki/Desirable_difficulty", "tags": ["учёба", "память"]}, {"id": "00i306", "title": "Осознанная практика", "text": "Мастерство растёт не от числа часов, а от их качества. Осознанная практика — это работа над конкретным слабым местом чуть за пределами привычного, с полной концентрацией и быстрой обратной связью. Просто повторять то, что уже получается, почти бесполезно.", "source": "Андерс Эрикссон, «Максимум»", "url": "https://en.wikipedia.org/wiki/Practice_(learning_method)", "tags": ["учёба", "мастерство"]}]}, {"id": "00s4", "title": "Ясное мышление", "note": "Ловушки ума и простые инструменты, чтобы в них не попадаться.", "color": 5, "ideas": [{"id": "00i401", "title": "Склонность к подтверждению", "text": "Мы охотнее замечаем и запоминаем то, что подтверждает уже сложившееся мнение, а неудобные факты пропускаем или объясняем. Противоядие — нарочно искать доводы против своей позиции и спрашивать себя: что убедило бы меня в обратном?", "source": "Когнитивные искажения", "url": "https://ru.wikipedia.org/wiki/Склонность_к_подтверждению_своей_точки_зрения", "tags": ["мышление", "искажения"]}, {"id": "00i402", "title": "Ошибка выжившего", "text": "Мы судим по тем, кто прошёл отбор, и не видим тех, кто выбыл. Во Вторую мировую статистик Абрахам Вальд предложил укреплять самолёты там, где у вернувшихся машин не было пробоин: попадания в эти места просто не давали вернуться.", "source": "Абрахам Вальд", "url": "https://ru.wikipedia.org/wiki/Систематическая_ошибка_выжившего", "tags": ["мышление", "искажения"]}, {"id": "00i403", "title": "Невозвратные затраты", "text": "Потраченные время, деньги и силы уже не вернуть, и на следующий шаг они влиять не должны. Важно одно: стоит ли продолжать с учётом будущих выгод и издержек. Вопрос для проверки: начал бы я это сегодня с нуля?", "source": "Поведенческая экономика", "url": "https://ru.wikipedia.org/wiki/Невозвратные_затраты", "tags": ["мышление", "решения"]}, {"id": "00i404", "title": "Инверсия: думайте от обратного", "text": "Трудную задачу иногда проще решать с конца. Вместо «как добиться успеха?» спросите «что наверняка приведёт к провалу?» и избегайте этого. Не делать глупостей часто надёжнее, чем пытаться быть гениальным.", "source": "Карл Якоби; Чарли Мангер", "url": "https://fs.blog/inversion/", "tags": ["мышление", "модели"]}, {"id": "00i405", "title": "Бритва Оккама", "text": "Из объяснений, одинаково хорошо согласующихся с фактами, стоит предпочесть то, которое требует меньше допущений. Это не закон природы, а рабочее правило: начинайте с простой версии и усложняйте её, только когда к этому вынуждают факты.", "source": "Уильям Оккам, XIV век", "url": "https://ru.wikipedia.org/wiki/Бритва_Оккама", "tags": ["мышление", "модели"]}, {"id": "00i406", "title": "Бритва Хэнлона", "text": "Не приписывайте злому умыслу то, что вполне объясняется невнимательностью, спешкой или ошибкой. Большинство обид рождается из недоразумений, а не из заговоров. Такое допущение бережёт нервы и отношения.", "source": "Бритва Хэнлона", "url": "https://ru.wikipedia.org/wiki/Бритва_Хэнлона", "tags": ["мышление", "люди"]}, {"id": "00i407", "title": "Эффект Даннинга — Крюгера", "text": "Новичку не хватает знаний не только для хорошей работы, но и для трезвой оценки себя: в опытах Крюгера и Даннинга студенты, справившиеся хуже всех, сильнее всех завышали свой результат. Сильные, наоборот, слегка занижали своё место среди других. О масштабе эффекта спорят: часть учёных считает, что его во многом объясняет статистика.", "source": "Джастин Крюгер и Дэвид Даннинг, 1999", "url": "https://ru.wikipedia.org/wiki/Эффект_Даннинга_—_Крюгера", "tags": ["мышление", "искажения"]}, {"id": "00i408", "title": "Думать от первых принципов", "text": "Вместо рассуждения по аналогии («так делают все») разберите задачу до базовых фактов, в которых вы уверены, и соберите решение заново. Так находятся варианты, которых не видно, пока опираешься на привычные ответы.", "source": "Метод первых принципов", "url": "https://en.wikipedia.org/wiki/First_principle", "tags": ["мышление", "модели"]}, {"id": "00i409", "title": "Круг компетентности", "text": "У каждого есть область, в которой он действительно разбирается. Важен не размер этого круга, а знание его границ: серьёзные ошибки чаще всего случаются там, где мы уверенно действуем за его пределами.", "source": "Уоррен Баффет, письмо акционерам, 1996", "url": "https://www.berkshirehathaway.com/letters/1996.html", "tags": ["мышление", "решения"]}]}, {"id": "00s5", "title": "Стоицизм на каждый день", "note": "Мысли Эпиктета, Сенеки и Марка Аврелия о спокойствии и поступках.", "color": 4, "ideas": [{"id": "00i501", "title": "Что в нашей власти", "text": "Эпиктет делит всё на зависящее и не зависящее от нас. От нас зависят суждения, стремления, желания и то, чего мы избегаем, то есть наши собственные действия. Не зависят тело, имущество, репутация, должности. Спокойствие приходит, когда силы уходят на первое, а второе принимается как данность.", "source": "Эпиктет, «Энхиридион», 1", "url": "https://ru.wikipedia.org/wiki/Эпиктет", "tags": ["стоицизм", "спокойствие"]}, {"id": "00i502", "title": "Нас тревожат не события, а суждения о них", "text": "Людей расстраивают не сами вещи, а то, что они о них думают. Между событием и реакцией стоит оценка, и её можно пересмотреть. Полезный вопрос: что здесь факт, а что моя трактовка?", "source": "Эпиктет, «Энхиридион», 5", "url": "https://standardebooks.org/ebooks/epictetus/short-works/george-long/text/the-enchiridion", "tags": ["стоицизм", "эмоции"]}, {"id": "00i503", "title": "Заранее представить худшее", "text": "Стоики советовали время от времени мысленно проживать возможные неудачи: потерю, отказ, срыв планов. Это не пессимизм, а тренировка. Беда, продуманная заранее, пугает меньше и реже застаёт врасплох.", "source": "Сенека, «Нравственные письма к Луцилию», письма 24 и 91", "url": "https://ru.wikipedia.org/wiki/Нравственные_письма_к_Луцилию", "tags": ["стоицизм", "практика"]}, {"id": "00i504", "title": "Помни о смерти", "text": "Мысль о конечности жизни нужна не для уныния, а для ясности. Марк Аврелий советовал совершать каждое дело так, будто оно последнее в жизни: без суеты, притворства и недовольства своей участью.", "source": "Марк Аврелий, «Размышления», 2.5", "url": "https://ru.wikipedia.org/wiki/Memento_mori", "tags": ["стоицизм", "время"]}, {"id": "00i505", "title": "Препятствие становится путём", "text": "То, что мешает действию, может стать его материалом: помеха делу продвигает дело. Трудность — это ещё и повод проявить терпение, изобретательность или смелость, которых без неё не понадобилось бы.", "source": "Марк Аврелий, «Размышления», 5.20", "url": "https://ru.wikipedia.org/wiki/К_самому_себе", "tags": ["стоицизм", "трудности"]}, {"id": "00i506", "title": "Воображение мучает сильнее, чем реальность", "text": "Сенека замечает: нас больше пугает, чем на самом деле давит, и страдаем мы чаще в воображении, чем в действительности. Многое из того, чего мы ждём со страхом, так и не наступает. Тревога заставляет пережить беду заранее, и нередко впустую.", "source": "Сенека, «Нравственные письма к Луцилию», письмо 13", "url": "https://en.wikisource.org/wiki/Moral_letters_to_Lucilius/Letter_13", "tags": ["стоицизм", "тревога"]}, {"id": "00i507", "title": "Вечерний разбор дня", "text": "Перед сном Сенека перебирал прожитый день: что сделал хорошо, где ошибся, что стоит поправить завтра. Эту привычку он перенял у философа Секстия. Смысл не в том, чтобы себя наказать, а в том, чтобы вовремя заметить и выровнять курс.", "source": "Сенека, «О гневе», III, 36", "url": "https://standardebooks.org/ebooks/seneca/dialogues/aubrey-stewart/text/on-anger", "tags": ["стоицизм", "практика"]}]}, {"id": "00s6", "title": "Решения и приоритеты", "note": "Как выбирать главное и не застревать в сомнениях.", "color": 2, "ideas": [{"id": "00i601", "title": "Принцип Парето", "text": "Примерно 20% усилий дают около 80% результата. Цифры условны, но закономерность встречается часто: немногие клиенты приносят основную часть дохода, немногие задачи — основную пользу. Найдите свои 20% и начните с них.", "source": "Вильфредо Парето, Джозеф Джуран", "url": "https://ru.wikipedia.org/wiki/Закон_Парето", "tags": ["приоритеты", "модели"]}, {"id": "00i602", "title": "Матрица Эйзенхауэра", "text": "Разложите дела по двум вопросам: это важно? это срочно? Важное и срочное делают сразу. Важное, но несрочное планируют: здесь живут здоровье, учёба и отношения. Срочное, но неважное стараются передать другим, а остальное вычёркивают.", "source": "Идея из речи Дуайта Эйзенхауэра 1954 года; матрицу популяризировал Стивен Кови", "url": "https://ru.wikipedia.org/wiki/Матрица_Эйзенхауэра", "tags": ["приоритеты", "приёмы"]}, {"id": "00i603", "title": "Дело на две минуты делайте сразу", "text": "Если задача занимает меньше двух минут, выполнить её сейчас быстрее, чем записывать, хранить и возвращаться к ней потом. Всё, что дольше, отправляется в список дел или в календарь.", "source": "Дэвид Аллен, «Как привести дела в порядок»", "url": "https://ru.wikipedia.org/wiki/Getting_Things_Done", "tags": ["приоритеты", "приёмы"]}, {"id": "00i604", "title": "Двери в одну и в две стороны", "text": "Решения бывают обратимыми и необратимыми. Обратимые, «двери в обе стороны», стоит принимать быстро: ошибку легко исправить. Необратимые требуют времени и тщательности. Частая ошибка — относиться ко всем решениям как к необратимым.", "source": "Джефф Безос, письмо акционерам Amazon за 2015 год", "url": "https://www.sec.gov/Archives/edgar/data/1018724/000119312516530910/d168744dex991.htm", "tags": ["решения", "модели"]}, {"id": "00i605", "title": "Правило 10–10–10", "text": "Перед трудным решением спросите себя: какими будут последствия каждого варианта через 10 минут, через 10 месяцев и через 10 лет? Взгляд из трёх точек во времени помогает отделить сиюминутные эмоции от того, что действительно важно.", "source": "Сьюзи Уэлч, «10-10-10», 2009", "url": "https://en.wikipedia.org/wiki/Suzy_Welch", "tags": ["решения", "приёмы"]}, {"id": "00i606", "title": "Разбор провала до старта", "text": "Перед запуском проекта представьте, что он уже провалился. Запишите, почему так вышло. В таком формате проще высказать сомнения, о которых обычно молчат, и заранее прикрыть слабые места.", "source": "Гэри Кляйн, метод premortem, 2007", "url": "https://en.wikipedia.org/wiki/Pre-mortem", "tags": ["решения", "планирование"]}]}, {"id": "00s07", "title": "Почему затягивает лента", "note": "Как приложения удерживают внимание и что с этим можно сделать.", "color": 7, "ideas": [{"id": "00i0701", "title": "Награда, которую нельзя предсказать", "text": "Скиннер и Фёрстер в опытах с голубями показали: если награда приходит после непредсказуемого числа действий, животное работает быстро и ровно и дольше упорствует, когда награды прекращаются. Лента похожа на такую схему: никогда не знаешь, окажется ли следующий ролик интересным, и поэтому листаешь дальше. Это аналогия, а не доказанная причина зависимости.", "source": "Б. Ф. Скиннер и Чарльз Фёрстер, «Режимы подкрепления», 1957", "url": "https://ru.wikipedia.org/wiki/Оперантное_обусловливание", "tags": ["внимание", "привычки"]}, {"id": "00i0702", "title": "У ленты нет конца, и это не случайность", "text": "У книги есть главы, у серии — титры. Такие естественные точки остановки помогают решить, продолжать или нет. Бесконечная прокрутка и автовоспроизведение их убирают, и решение «хватит» приходится принимать самому, без подсказки. Аза Раскин, который называет себя автором бесконечной прокрутки, позже говорил, что сожалеет о её последствиях.", "source": "Адам Алтер, «Не оторваться»; Аза Раскин", "url": "https://en.wikipedia.org/wiki/Infinite_scrolling", "tags": ["внимание", "технологии"]}, {"id": "00i0703", "title": "Хотеть — не значит получать удовольствие", "text": "По теории нейробиолога Кента Берриджа, за желание и за удовольствие в мозге отвечают разные системы. Дофамин связан прежде всего с «хочу», то есть с тягой к награде и её сигналам, а «нравится» обеспечивают другие участки, и дофамин для него не обязателен. Поэтому рука может тянуться к телефону снова и снова, даже когда радости от ленты мало.", "source": "Кент Берридж и Терри Робинсон, теория «хочу» и «нравится»", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC5171207", "tags": ["мозг", "внимание"]}, {"id": "00i0704", "title": "Плохие новости цепляют сильнее", "text": "Отрицательное мы замечаем быстрее и помним дольше, чем положительное: для выживания пропустить угрозу было опаснее, чем пропустить приятное. Ленты, которые подбирают то, на что мы сильнее реагируем, легко заполняются тревожным и возмущающим. Это особенность внимания, а не точная картина мира.", "source": "Рой Баумайстер и соавторы, «Плохое сильнее хорошего», 2001", "url": "https://en.wikipedia.org/wiki/Negativity_bias", "tags": ["внимание", "новости"]}, {"id": "00i0705", "title": "Сделайте вредное неудобным", "text": "Чем меньше шагов до действия, тем чаще мы его совершаем. Это работает в обе стороны. Уберите приложение с первого экрана, выйдите из аккаунта, отключите уведомления: каждая лишняя секунда даёт шанс заметить, что вы делаете. А на освободившееся место поставьте то, чем хотите заниматься вместо этого.", "source": "Модель поведения Би Джея Фогга (Стэнфорд)", "url": "https://behaviordesign.stanford.edu/resources/fogg-behavior-model", "tags": ["привычки", "приёмы"]}, {"id": "00i0706", "title": "Скука — не поломка", "text": "Когда нечем заняться, ум начинает блуждать: вспоминает, строит планы, связывает далёкие мысли. В опыте Сэнди Манн и Ребекки Кэдман участники сначала переписывали номера из телефонного справочника, а потом придумывали больше способов применить пластиковые стаканчики, чем те, кто не скучал. Авторы связывают это с мечтами наяву, но результаты разных работ расходятся.", "source": "Сэнди Манн и Ребекка Кэдман, Creativity Research Journal, 2014", "url": "https://knowledge.lancashire.ac.uk/22263/", "tags": ["внимание", "креативность"]}]}, {"id": "00s08", "title": "Деньги без паники", "note": "Базовые идеи о личных финансах, которые полезно знать каждому.", "color": 1, "ideas": [{"id": "00i0801", "title": "Сложный процент и правило 72", "text": "Когда доход начисляется и на вложенное, и на уже заработанные проценты, сумма растёт всё быстрее. Прикинуть срок удвоения помогает правило 72: разделите 72 на годовую ставку. При 8% годовых деньги удваиваются примерно за 9 лет, при 12% — за 6. По тому же правилу растут и долги.", "source": "Правило 72", "url": "https://ru.wikipedia.org/wiki/Правило_72", "tags": ["деньги", "проценты"]}, {"id": "00i0802", "title": "Инфляция съедает молча", "text": "Деньги, которые просто лежат, со временем покупают всё меньше. При инфляции 6% в год цены удваиваются примерно за 12 лет: та же сумма превращается в половину прежней покупательной способности. Поэтому важно смотреть не на сам процент дохода, а на то, насколько он обгоняет рост цен.", "source": "Основы личных финансов", "url": "https://ru.wikipedia.org/wiki/Инфляция", "tags": ["деньги", "инфляция"]}, {"id": "00i0803", "title": "Подушка безопасности", "text": "Распространённый ориентир — запас на три–шесть месяцев обычных расходов; точная сумма зависит от вашей ситуации. Такой запас превращает потерю работы, болезнь или срочный ремонт из катастрофы в неприятность. Его смысл не в доходности, а в доступности: деньги должны лежать там, откуда их можно быстро забрать без потерь.", "source": "Основы личных финансов", "url": "https://www.consumerfinance.gov/an-essential-guide-to-building-an-emergency-fund/", "tags": ["деньги", "запас"]}, {"id": "00i0804", "title": "Сначала заплати себе", "text": "Откладывать то, что останется в конце месяца, обычно не получается: не остаётся ничего. Надёжнее перевернуть порядок: в день дохода сразу отправить фиксированную долю в накопления, а жить на остальное. В классической книге о деньгах советуют начинать с десятой части.", "source": "Джордж Клейсон, «Самый богатый человек в Вавилоне»", "url": "https://ru.wikipedia.org/wiki/Самый_богатый_человек_в_Вавилоне", "tags": ["деньги", "привычки"]}, {"id": "00i0805", "title": "Расходы растут вслед за доходами", "text": "После повышения зарплаты прежняя жизнь быстро начинает казаться слишком скромной: жильё получше, такси почаще, подписок побольше. Через год свободных денег столько же, сколько было. Простой приём: при каждом росте дохода сразу направлять часть прибавки в накопления, пока к ней не привыкли.", "source": "Инфляция образа жизни", "url": "https://en.wikipedia.org/wiki/Lifestyle_creep", "tags": ["деньги", "привычки"]}, {"id": "00i0806", "title": "Цена вещи в часах жизни", "text": "Любую покупку можно пересчитать в часы жизни. Посчитайте свой реальный заработок в час: вычтите из дохода расходы, связанные с работой, а к рабочим часам прибавьте дорогу и сборы. Разделите цену вещи на эту ставку. Кроссовки ценой в три рабочих дня воспринимаются иначе, чем цифра на ценнике.", "source": "Вики Робин и Джо Домингес, «Кошелёк или жизнь?»", "url": "https://en.wikipedia.org/wiki/Your_Money_or_Your_Life", "tags": ["деньги", "решения"]}]}, {"id": "00s09", "title": "Сон и энергия", "note": "Что известно о сне и бодрости и как этим пользоваться.", "color": 6, "ideas": [{"id": "00i0901", "title": "Сколько сна нужно взрослому", "text": "Национальный фонд сна (США) рекомендует взрослым от 18 до 64 лет спать семь–девять часов в сутки, людям старше 65 — семь–восемь. Недосып накапливается незаметно: человек привыкает к усталости и перестаёт её замечать, хотя внимание и память работают хуже. Поэтому ощущению «мне хватает пяти часов» стоит доверять с осторожностью.", "source": "Национальный фонд сна (США), рекомендации 2015 года", "url": "https://pubmed.ncbi.nlm.nih.gov/29073412/", "tags": ["сон", "здоровье"]}, {"id": "00i0902", "title": "Режим важнее подвигов", "text": "Внутренние часы любят постоянство. Если ложиться и вставать примерно в одно время, включая выходные, засыпать становится легче, а просыпаться бодрее. Попытка отоспаться в субботу до обеда сдвигает часы, и в понедельник организм чувствует себя как после перелёта.", "source": "Тилль Рённеберг, «социальный джетлаг»", "url": "https://en.wikipedia.org/wiki/Social_jetlag", "tags": ["сон", "режим"]}, {"id": "00i0903", "title": "Свет настраивает внутренние часы", "text": "Главный сигнал для биологических часов — свет. Яркий свет утром, лучше всего дневной, помогает проснуться и сдвигает засыпание на более раннее время. Яркий свет поздно вечером делает обратное: подавляет выработку мелатонина и отодвигает сон.", "source": "Хронобиология: влияние света на циркадные ритмы", "url": "https://ru.wikipedia.org/wiki/Циркадный_ритм", "tags": ["сон", "свет"]}, {"id": "00i0904", "title": "Кофеин действует дольше, чем кажется", "text": "Кофеин блокирует рецепторы аденозина, вещества, которое копится за день и вызывает сонливость. Половина дозы выводится в среднем за пять часов (у разных людей от трёх до семи), так что вечером в крови ещё остаётся заметная часть. В небольшом опыте 400 мг кофеина за шесть часов до сна сократили сон больше чем на час, а участники этого не заметили.", "source": "Дрейк и соавторы, Journal of Clinical Sleep Medicine, 2013", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC3805807", "tags": ["сон", "кофеин"]}, {"id": "00i0905", "title": "Короткий дневной сон", "text": "Короткий дневной сон возвращает бодрость. В опыте Брукс и Лэка участники, не выспавшиеся ночью, дремали днём разное время. Лучше всего сработали десять минут: внимание и бодрость выросли сразу и держались больше двух часов. После тридцати минут сначала наступала вялость, которую называют инерцией сна, а польза приходила позже.", "source": "Брукс и Лэк, журнал Sleep, 2006", "url": "https://pubmed.ncbi.nlm.nih.gov/16796222/", "tags": ["сон", "энергия"]}, {"id": "00i0906", "title": "Движение как минимум", "text": "Всемирная организация здравоохранения рекомендует взрослым 150–300 минут умеренной активности в неделю, например быстрой ходьбы, или 75–150 минут интенсивной. Это около получаса в день пять раз в неделю. Польза начинается раньше нормы: любое движение лучше, чем его отсутствие.", "source": "Рекомендации ВОЗ по физической активности, 2020", "url": "https://www.who.int/publications/i/item/9789240015128", "tags": ["здоровье", "движение"]}]}, {"id": "00s10", "title": "Как устроены люди", "note": "Открытия социальной психологии о том, как мы видим себя и других.", "color": 2, "ideas": [{"id": "00i1001", "title": "Фундаментальная ошибка атрибуции", "text": "Объясняя чужие поступки, мы склонны переоценивать роль характера и недооценивать обстоятельства. Ли Росс в 1977 году назвал это фундаментальной ошибкой атрибуции. Подрезал водитель — «хам»; подрезал я — «опаздывал и не заметил»: о себе мы чаще вспоминаем ситуацию. Прежде чем делать вывод о человеке, спросите: как повёл бы себя я на его месте?", "source": "Ли Росс, 1977", "url": "https://ru.wikipedia.org/wiki/Фундаментальная_ошибка_атрибуции", "tags": ["психология", "люди"]}, {"id": "00i1002", "title": "Эффект прожектора", "text": "Нам кажется, что окружающие замечают наши промахи и внешность гораздо внимательнее, чем это происходит на деле. В эксперименте студенты в нелепой футболке были уверены, что её запомнит половина аудитории, а запомнила примерно четверть. Люди заняты в основном собой, как и мы.", "source": "Томас Гилович и соавторы, 2000", "url": "https://ru.wikipedia.org/wiki/Эффект_прожектора", "tags": ["психология", "тревога"]}, {"id": "00i1003", "title": "Эффект свидетеля", "text": "В опытах Дарли и Латане чем больше людей, по мнению участника, знали о чьей-то беде, тем реже он сам спешил на помощь: ответственность словно делится на всех. Позже выяснилось, что при явной и серьёзной опасности эффект слабее. Если помощь нужна вам, обращайтесь к конкретному человеку: «Вы, в синей куртке, вызовите скорую».", "source": "Джон Дарли и Бибб Латане, 1968", "url": "https://ru.wikipedia.org/wiki/Эффект_свидетеля", "tags": ["психология", "люди"]}, {"id": "00i1004", "title": "Давление большинства", "text": "В опытах Соломона Аша участники сравнивали длину линий, и ответ был очевиден. Но когда подставная группа единогласно называла неверный вариант, около трёх четвертей участников хотя бы раз соглашались с ней вопреки собственным глазам. Достаточно было одного несогласного союзника, чтобы давление резко ослабло.", "source": "Соломон Аш, 1951", "url": "https://ru.wikipedia.org/wiki/Эксперимент_Аша", "tags": ["психология", "группа"]}, {"id": "00i1005", "title": "Эффект ореола", "text": "Одно яркое качество окрашивает всё впечатление о человеке. Привлекательного мы невольно считаем более умным и добрым, уверенного — более компетентным. То же работает с вещами и компаниями. Полезно оценивать качества по отдельности: что я знаю об этом на самом деле, а что дорисовал?", "source": "Эдвард Торндайк, 1920", "url": "https://ru.wikipedia.org/wiki/Гало-эффект", "tags": ["психология", "искажения"]}, {"id": "00i1006", "title": "Запоминаются пик и финал", "text": "Оценивая прошедшее событие, мы не усредняем все его минуты. В памяти остаются самый сильный момент и конец, а длительность почти не важна: в опытах с холодной водой люди выбирали более долгую неприятную пробу, если она заканчивалась мягче. Правило лучше всего работает для коротких эпизодов с ясным началом и концом: встречи, презентации, процедуры.", "source": "Даниэль Канеман, Барбара Фредриксон и соавторы, 1993", "url": "https://en.wikipedia.org/wiki/Peak–end_rule", "tags": ["психология", "память"]}]}, {"id": "00s11", "title": "Разговор и влияние", "note": "Приёмы, которые помогают слушать, договариваться и говорить о трудном.", "color": 4, "ideas": [{"id": "00i1101", "title": "Сначала понять, потом быть понятым", "text": "В споре мы обычно слушаем, чтобы ответить, а не чтобы понять. Кови советует сначала внимательно выслушать и пересказать позицию собеседника своими словами так, чтобы он почувствовал, что его поняли. По Кови, после этого человек охотнее слушает в ответ: защищаться ему больше незачем.", "source": "Стивен Кови, «7 навыков высокоэффективных людей», навык 5", "url": "https://ru.wikipedia.org/wiki/Семь_навыков_высокоэффективных_людей", "tags": ["общение", "слушание"]}, {"id": "00i1102", "title": "Я-сообщения", "text": "Фраза «Ты опять опоздал» звучит как обвинение и вызывает оборону. Фраза «Я волнуюсь, когда не знаю, во сколько ты придёшь» говорит о том же через собственные чувства. Я-сообщение по Гордону состоит из трёх частей: описание поведения без обвинения, его влияние на меня, мои чувства. Спорить с чужими чувствами труднее, чем с упрёком.", "source": "Томас Гордон, 1970", "url": "https://ru.wikipedia.org/wiki/Я-высказывание", "tags": ["общение", "конфликты"]}, {"id": "00i1103", "title": "Четыре шага ненасильственного общения", "text": "Чтобы сказать о трудном без нападения, разделите сообщение на четыре части. Наблюдение: факт без оценок. Чувство: что я испытываю. Потребность: что для меня здесь важно. Просьба: конкретное действие, о котором я прошу. Например: «Когда встреча начинается позже, я нервничаю, мне важно планировать день. Давай предупреждать заранее».", "source": "Маршалл Розенберг, «Ненасильственное общение»", "url": "https://ru.wikipedia.org/wiki/Ненасильственное_общение", "tags": ["общение", "конфликты"]}, {"id": "00i1104", "title": "Назовите чувство вслух", "text": "Когда собеседник раздражён или расстроен, спорить с эмоцией бесполезно. Крис Восс советует назвать её вслух: «Похоже, вас это сильно задело». Этот приём он называет labeling: чувству дают имя, не соглашаясь и не споря. По Воссу, человек чувствует, что его услышали, напряжение снижается, и разговор возвращается к сути.", "source": "Крис Восс, «Никаких компромиссов»", "url": "https://en.wikipedia.org/wiki/Christopher_Voss", "tags": ["переговоры", "эмоции"]}, {"id": "00i1105", "title": "Запасной вариант в переговорах", "text": "Сила в переговорах зависит от того, что вы будете делать, если договориться не получится. Этот запасной вариант называют BATNA, лучшей альтернативой обсуждаемому соглашению. Продумайте его заранее: тогда понятно, на каких условиях стоит соглашаться, а когда спокойно встать и уйти.", "source": "Роджер Фишер и Уильям Юри, «Переговоры без поражения. Гарвардский метод»", "url": "https://en.wikipedia.org/wiki/Best_alternative_to_a_negotiated_agreement", "tags": ["переговоры", "решения"]}, {"id": "00i1106", "title": "Обратная связь по трём шагам", "text": "Замечание «ты безответственный» обижает и ничего не меняет. Полезнее описать три вещи: ситуацию, поведение и его последствия. «Вчера на встрече ты дважды перебил клиента, и он перестал задавать вопросы». Человек понимает, что именно произошло и почему это важно, и не слышит оценки своей личности.", "source": "Модель SBI, Центр креативного лидерства", "url": "https://www.ccl.org/articles/leading-effectively-articles/closing-the-gap-between-intent-vs-impact-sbii/", "tags": ["общение", "работа"]}]}, {"id": "00s12", "title": "Мысленные эксперименты", "note": "Короткие истории, которыми философы проверяют наши убеждения.", "color": 5, "ideas": [{"id": "00i1201", "title": "Корабль Тесея", "text": "Афиняне хранили корабль Тесея и по мере износа заменяли в нём старые брёвна новыми. Плутарх пишет, что философы спорили: тот же это корабль или уже другой? Позже Гоббс добавил ход: если собрать второй корабль из снятых досок, какой из двух настоящий? Вопрос касается и нас: мы меняемся, но считаем себя тем же человеком.", "source": "Плутарх, «Тесей»; Томас Гоббс", "url": "https://ru.wikipedia.org/wiki/Корабль_Тесея", "tags": ["философия", "идентичность"]}, {"id": "00i1202", "title": "Пещера Платона", "text": "Узники с детства сидят в пещере лицом к стене и видят только тени предметов, которые проносят у них за спиной. Тени они считают реальностью. Освобождённого слепит свет, но он привыкает и видит солнце. Когда он возвращается, глаза уже отвыкли от темноты, и остальные над ним смеются. Какие наши «очевидности» — всего лишь тени?", "source": "Платон, «Государство», книга VII", "url": "https://ru.wikipedia.org/wiki/Миф_о_пещере", "tags": ["философия", "познание"]}, {"id": "00i1203", "title": "Проблема вагонетки", "text": "Вагонетка несётся на пятерых. Можно перевести стрелку, и тогда погибнет один: большинство считает это допустимым. Но если тех же пятерых можно спасти, только столкнув человека с моста, большинство отказывается. Итог одинаков, а оценка разная: похоже, мы судим поступки не только по последствиям.", "source": "Филиппа Фут, 1967; Джудит Томсон", "url": "https://ru.wikipedia.org/wiki/Проблема_вагонетки", "tags": ["философия", "этика"]}, {"id": "00i1204", "title": "Завеса неведения", "text": "Представьте, что вы придумываете правила для общества, но не знаете, кем в нём окажетесь: богатым или бедным, здоровым или больным, каким по полу и происхождению. Джон Ролз считал, что справедливы те правила, которые мы выбрали бы в таком положении. Это удобный тест для любого спорного решения.", "source": "Джон Ролз, «Теория справедливости», 1971", "url": "https://ru.wikipedia.org/wiki/Занавес_неведения", "tags": ["философия", "справедливость"]}, {"id": "00i1205", "title": "Китайская комната", "text": "Человек, не знающий китайского, сидит в комнате с подробной инструкцией: какие иероглифы выдавать в ответ на какие. Снаружи кажется, что в комнате понимают китайский. Джон Сёрл спрашивает: понимает ли здесь кто-нибудь язык? Так он оспаривал идею, что правильные ответы машины равны пониманию.", "source": "Джон Сёрл, 1980", "url": "https://ru.wikipedia.org/wiki/Китайская_комната", "tags": ["философия", "сознание"]}, {"id": "00i1206", "title": "Машина опыта", "text": "Вам предлагают подключиться к машине, которая создаст любые переживания: успех, любовь, приключения. Отличить их от реальности будет нельзя. Подключились бы вы навсегда? В опросах большинство отвечает «нет», хотя результат зависит от формулировки вопроса. Роберт Нозик делал вывод: нам важны не только приятные ощущения, но и то, чтобы жизнь была настоящей.", "source": "Роберт Нозик, «Анархия, государство и утопия», 1974", "url": "https://iep.utm.edu/experience-machine/", "tags": ["философия", "счастье"]}]}, {"id": "00s13", "title": "Космос и масштаб", "note": "Факты о Вселенной, после которых привычные расстояния кажутся другими.", "color": 3, "ideas": [{"id": "00i1301", "title": "Смотреть в небо — значит смотреть в прошлое", "text": "Свет летит быстро, но не мгновенно. От Солнца до нас он добирается чуть больше восьми минут, от ближайшей звезды — больше четырёх лет, от галактики Андромеды — около двух с половиной миллионов лет. Мы видим не то, что есть сейчас, а то, каким всё было, когда свет отправился в путь.", "source": "Астрономия: скорость света и расстояния", "url": "https://ru.wikipedia.org/wiki/Световой_год", "tags": ["космос", "свет"]}, {"id": "00i1302", "title": "Космический календарь", "text": "Если сжать 13,8 миллиарда лет истории Вселенной в один год, Солнечная система появится в начале сентября, динозавры — в последних числах декабря, а люди современного типа — за несколько минут до полуночи 31 декабря. Вся записанная история уместится в последние секунды.", "source": "Космический календарь Карла Сагана («Драконы Эдема»), пересчёт на 13,8 млрд лет", "url": "https://ru.wikipedia.org/wiki/Космический_календарь", "tags": ["космос", "время"]}, {"id": "00i1303", "title": "Мы сделаны из звёзд", "text": "После Большого взрыва во Вселенной были почти только водород и гелий. Углерод, кислород, железо и другие тяжёлые элементы возникли позже: в недрах звёзд и при их гибели. Так что всё в нашем теле, кроме водорода, когда-то было частью звезды.", "source": "Звёздный нуклеосинтез", "url": "https://ru.wikipedia.org/wiki/Нуклеосинтез", "tags": ["космос", "химия"]}, {"id": "00i1304", "title": "Бледно-голубая точка", "text": "В 1990 году аппарат «Вояджер-1» с расстояния около шести миллиардов километров сфотографировал Землю. На снимке она занимает меньше пикселя: светлая точка в солнечном луче. Карл Саган заметил, что на этой точке прошла жизнь каждого, о ком мы когда-либо слышали.", "source": "Снимок «Вояджера-1», 1990; Карл Саган", "url": "https://ru.wikipedia.org/wiki/Pale_Blue_Dot", "tags": ["космос", "перспектива"]}, {"id": "00i1305", "title": "Почти вся масса — в Солнце", "text": "На Солнце приходится около 99,8% всей массы Солнечной системы. Юпитер тяжелее всех остальных планет вместе взятых, но и он лишь примерно тысячная доля Солнца. По объёму в Солнце поместилось бы больше миллиона таких планет, как Земля.", "source": "Астрономия: Солнечная система", "url": "https://ru.wikipedia.org/wiki/Солнечная_система", "tags": ["космос", "масштаб"]}, {"id": "00i1306", "title": "Парадокс Ферми", "text": "В нашей Галактике сотни миллиардов звёзд, и у многих есть планеты. За миллиарды лет разумная жизнь могла бы возникнуть много раз и заметно себя проявить. Но следов её мы не видим. «Где все?» — спросил физик Энрико Ферми в 1950 году. Объяснений предложены десятки, общепринятого нет.", "source": "Энрико Ферми, 1950", "url": "https://ru.wikipedia.org/wiki/Парадокс_Ферми", "tags": ["космос", "жизнь"]}]}, {"id": "00s14", "title": "Экономика на пальцах", "note": "Несколько идей, которыми экономисты объясняют повседневные решения.", "color": 0, "ideas": [{"id": "00i1401", "title": "Альтернативная стоимость", "text": "Настоящая цена выбора — это лучшее из того, от чего пришлось отказаться. Вечер за сериалом стоит не ноль рублей, а несостоявшуюся встречу, тренировку или сон. Вопрос «что я мог бы сделать вместо этого?» полезнее, чем вопрос «могу ли я себе это позволить?».", "source": "Базовое понятие экономики", "url": "https://ru.wikipedia.org/wiki/Альтернативные_издержки", "tags": ["экономика", "решения"]}, {"id": "00i1402", "title": "Закон Гудхарта", "text": "Когда показатель становится целью, он перестаёт быть хорошим показателем. Так мысль экономиста Чарльза Гудхарта о денежной политике позже обобщила антрополог Мэрилин Стратерн. Если учителей оценивать по баллам тестов, их тянет натаскивать на тесты; если программистов — по числу строк, код раздувается. Люди оптимизируют то, что измеряют, а не то, ради чего измерение придумали.", "source": "Чарльз Гудхарт, 1975; формулировка Мэрилин Стратерн, 1997", "url": "https://ru.wikipedia.org/wiki/Закон_Гудхарта", "tags": ["экономика", "стимулы"]}, {"id": "00i1403", "title": "Трагедия общин", "text": "Если ресурс общий и бесплатный, каждому выгодно взять побольше: выгода достаётся одному, а ущерб делится на всех. В итоге пастбище вытоптано, а рыба выловлена. Но это не приговор: Элинор Остром показала, что сообщества часто сами договариваются о правилах и успешно берегут общее.", "source": "Гаррет Хардин, 1968; Элинор Остром", "url": "https://ru.wikipedia.org/wiki/Трагедия_общих_ресурсов", "tags": ["экономика", "общество"]}, {"id": "00i1404", "title": "Сравнительное преимущество", "text": "Торговать выгодно, даже если один участник лучше другого во всём. Юристу, который печатает быстрее своего помощника, всё равно стоит отдать набор текста помощнику: час юридической работы приносит больше. Каждому лучше делать то, в чём его преимущество самое большое, и меняться результатами.", "source": "Давид Рикардо, 1817; пример из учебников экономики", "url": "https://ru.wikipedia.org/wiki/Теория_сравнительных_преимуществ", "tags": ["экономика", "торговля"]}, {"id": "00i1405", "title": "Рынок «лимонов»", "text": "Когда продавец знает о товаре больше покупателя, рынок портится. Покупатель подержанной машины не может отличить хорошую от плохой и готов платить только среднюю цену. Владельцам хороших машин такая цена невыгодна, они уходят, и средний уровень падает ещё ниже. Гарантии, отзывы и проверки существуют, чтобы эту проблему решать.", "source": "Джордж Акерлоф, 1970", "url": "https://en.wikipedia.org/wiki/The_Market_for_Lemons", "tags": ["экономика", "информация"]}, {"id": "00i1406", "title": "Убывающая предельная полезность", "text": "Каждая следующая единица одного и того же радует меньше предыдущей. Первый кусок пиццы после долгого дня прекрасен, пятый уже в тягость. С деньгами похоже: прибавка в одну и ту же сумму много значит при небольшом доходе и почти незаметна при большом.", "source": "Базовое понятие экономики", "url": "https://ru.wikipedia.org/wiki/Предельная_полезность", "tags": ["экономика", "решения"]}]}, {"id": "00s15", "title": "Как делались открытия", "note": "Истории о том, как наблюдательность и упрямство меняли науку.", "color": 6, "ideas": [{"id": "00i1501", "title": "Земмельвейс и чистые руки", "text": "В 1847 году венский врач Игнац Земмельвейс заметил, что в отделении, где роды принимали студенты-медики, приходившие после вскрытий, женщины умирали гораздо чаще. Он велел мыть руки раствором хлорной извести, и смертность упала в несколько раз. Коллеги идею отвергли. Признали её только после его смерти.", "source": "История медицины", "url": "https://ru.wikipedia.org/wiki/Земмельвейс,_Игнац_Филипп", "tags": ["наука", "медицина"]}, {"id": "00i1502", "title": "Джон Сноу и водяная колонка", "text": "В 1854 году в Лондоне вспыхнула холера. Считалось, что болезнь разносит дурной воздух. Врач Джон Сноу нанёс случаи смерти на карту и увидел, что они собраны вокруг одной водяной колонки на Брод-стрит. По его настоянию с колонки сняли рукоять. Так появился один из первых примеров эпидемиологии.", "source": "История медицины", "url": "https://ru.wikipedia.org/wiki/Вспышка_холеры_на_Брод-стрит", "tags": ["наука", "медицина"]}, {"id": "00i1503", "title": "Пенициллин: случайность и подготовленный ум", "text": "В 1928 году Александр Флеминг вернулся из отпуска и увидел, что в одну из чашек с бактериями попала плесень, а вокруг неё бактерии погибли. Многие просто выбросили бы испорченную чашку. Флеминг стал разбираться. До лекарства открытие довели Говард Флори и Эрнст Чейн больше десяти лет спустя.", "source": "История медицины", "url": "https://ru.wikipedia.org/wiki/Флеминг,_Александр", "tags": ["наука", "случайность"]}, {"id": "00i1504", "title": "Эратосфен измерил Землю тенью", "text": "В III веке до нашей эры Эратосфен знал, что в Сиене в полдень летнего солнцестояния солнце стоит прямо над головой, а в Александрии в это же время предметы отбрасывают тень. Измерив её угол и зная расстояние между городами, он вычислил окружность Земли. Результат близок к современному значению, но точность оценить трудно: длина древнего стадия известна неточно.", "source": "История науки", "url": "https://ru.wikipedia.org/wiki/Эратосфен", "tags": ["наука", "геометрия"]}, {"id": "00i1505", "title": "Врач, который выпил бактерии", "text": "В начале 1980-х считалось, что язву желудка вызывают стресс и кислота. Австралийцы Барри Маршалл и Робин Уоррен подозревали бактерию Helicobacter pylori, но им не верили. Тогда Маршалл выпил культуру бактерий и заболел гастритом. Позже язву стали лечить антибиотиками, а учёные получили Нобелевскую премию.", "source": "Нобелевская премия по физиологии и медицине, 2005", "url": "https://ru.wikipedia.org/wiki/Маршалл,_Барри", "tags": ["наука", "медицина"]}, {"id": "00i1506", "title": "Вегенер и дрейф континентов", "text": "В 1912 году метеоролог Альфред Вегенер предположил, что материки когда-то были единым целым и разошлись: слишком хорошо совпадают берега Африки и Южной Америки, породы и ископаемые по обе стороны океана. Объяснить, что двигает континенты, он не мог, и многие геологи десятилетиями отвергали идею. Признали её в 1960-х, когда появилась теория тектоники плит.", "source": "История геологии", "url": "https://ru.wikipedia.org/wiki/Теория_дрейфа_материков", "tags": ["наука", "геология"]}]}, {"id": "00s16", "title": "Как работает ИИ", "note": "Что происходит внутри языковых моделей вроде Claude и ChatGPT.", "color": 3, "ideas": [{"id": "00i1601", "title": "Модель угадывает продолжение", "text": "Языковая модель делает одну вещь: по уже написанному тексту оценивает, какой фрагмент вероятнее всего идёт следующим. Ответ собирается по кусочку, шаг за шагом. Удивительно, но этого умения достаточно, чтобы писать код, переводить и рассуждать: чтобы хорошо продолжать тексты о мире, нужно многое о мире усвоить.", "source": "Устройство языковых моделей", "url": "https://ru.wikipedia.org/wiki/Большая_языковая_модель", "tags": ["ии", "технологии"]}, {"id": "00i1602", "title": "Токены, а не слова", "text": "Модель работает не с буквами и не со словами, а с токенами: частыми кусочками текста. Короткое слово может быть одним токеном, длинное или редкое — несколькими. В токенах измеряют и длину запроса, и объём памяти модели в одном разговоре, который называют контекстным окном.", "source": "Устройство языковых моделей", "url": "https://en.wikipedia.org/wiki/Large_language_model", "tags": ["ии", "технологии"]}, {"id": "00i1603", "title": "Обучение — это подбор чисел", "text": "Внутри модели миллиарды чисел, параметров. При обучении ей показывают огромное количество текстов и просят предсказывать продолжение, а после каждой ошибки параметры чуть-чуть поправляют в нужную сторону. Никто не пишет правила вручную: знания о языке и мире оседают в этих числах сами.", "source": "Устройство языковых моделей", "url": "https://ru.wikipedia.org/wiki/Метод_обратного_распространения_ошибки", "tags": ["ии", "обучение"]}, {"id": "00i1604", "title": "Почему ИИ уверенно ошибается", "text": "Модель обучена выдавать правдоподобный текст, а правдоподобное не всегда верно. Если точного знания нет, она может сочинить убедительную цитату, ссылку или цифру. Такие ошибки называют галлюцинациями. Важные факты, особенно числа, имена и источники, стоит перепроверять.", "source": "Устройство языковых моделей", "url": "https://ru.wikipedia.org/wiki/Галлюцинация_(искусственный_интеллект)", "tags": ["ии", "критичность"]}, {"id": "00i1605", "title": "Внимание — механизм, а не метафора", "text": "Современные модели построены на архитектуре «трансформер», предложенной в 2017 году. Её ключевая часть называется механизмом внимания: обрабатывая каждое слово, модель взвешивает, какие другие слова текста для него важны. Так она связывает местоимение с именем из начала абзаца или вопрос с нужным местом в документе.", "source": "Васвани и соавторы, «Attention Is All You Need», 2017", "url": "https://ru.wikipedia.org/wiki/Трансформер_(модель_машинного_обучения)", "tags": ["ии", "технологии"]}, {"id": "00i1606", "title": "Хороший запрос — это хорошее объяснение", "text": "Модель не знает вашей ситуации, пока вы о ней не рассказали. Ответы становятся лучше, если объяснить, кто вы, что нужно получить, для кого и в каком виде, и дать пример. Помогает простая проверка: понял бы эту просьбу умный человек, который видит её впервые?", "source": "Практика работы с языковыми моделями", "url": "https://en.wikipedia.org/wiki/Prompt_engineering", "tags": ["ии", "приёмы"]}]}];
